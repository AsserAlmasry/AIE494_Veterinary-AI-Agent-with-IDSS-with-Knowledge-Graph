: Akkou Madjid, Titouche Yacine, Bentayeb Lamia Journal: Veterinary research communications (2024) PMID: 38963470  Abstract: Adoption of a rational management in dairy farms would improve the milk quality and farmers' income. In the current study, we aimed to describe bovine mastitis in 32 dairy herds, identify the main cow- and herd-associated risk factors, and analyze both epidemiological along with molecular characteristics of Staphylococcus aureus infecting udders. Based on Californian Mastitis Test and clinical examination, the prevalence of mastitis in cows was 52.25% (116/222), of which 6.3% was clinical mastitis and 45.94% was subclinical mastitis. Overall, 218 (24.54%) quarters suffered from mastitis, whose 29.81% (65/218) infected with S. aureus. Mastitis was lowest in mid-lactation with OR\\u2009=\\u20090.371 with 95% confidence interval (CI) of 0\",\n  \"pmid\": \"38963470\",\n  \"title\": \"Risk factors for dairy cows mastitis in Algeria, antibiotic resistance and molecular typing of the causative Staphylococcus aureus.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1568", "label": "Phagocytosis and reactive oxygen species (ROS) production by CH138", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Phagocytosis and reactive oxygen species (ROS) production by CH138 Scholars: da Costa E Silva Cynthia Pereira, Madureira Karina M\\u00e9dici, Baldacim Vinicius Alvim Passos Journal: Veterinary immunology and immunopathology (2025) PMID: 39889387  Abstract: This study investigated the functional activity of CH138\\u202f+\\u202fgranulocytes in the blood, colostrum, and transitional milk of Holstein cows throughout the transition period. Thirteen cows were assessed weekly, beginning three weeks before calving (W-3, W-2, and W-1), on the day of calving, and continuing to three weeks postpartum (W1, W2, and W3). Physical examination of the udder tissue, bacterial cultures, and blood immune function tests were performed. Microscopic Somatic Cell Count (MSCC), phagocytosis, and intracellular ROS production by CH138\\u202f+\\u202fgranulocytes in colostrum and transitional milk were measured weekly, from calving to W3. Disease incidence was recorded, with four cows developing metritis at W2. Mammary gland edema, affecting\",\n  \"pmid\": \"39889387\",\n  \"title\": \"Phagocytosis and reactive oxygen species (ROS) production by CH138\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1569", "label": "Galyean Appreciation Club Review: revisiting nutrition and health of newly received cattle-what have we learned in the last 15 years?", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 Galyean Appreciation Club Review: revisiting nutrition and health of newly received cattle-what have we learned in the last 15 years? Scholars: Galyean Michael L, Duff Glenn C, Rivera J Daniel Journal: Journal of animal science (2022) PMID: 35246687  Abstract: Our objective was to review the literature related to the health and management of newly received cattle published since a previous review by Duff and Galyean (2007). Bovine respiratory disease (BRD) continues to be a major challenge for the beef industry. Depending on disease severity, animals treated for BRD have decreased performance and lowered carcass value. Diagnosis of BRD is less effective than desired, and progress on developing real-time, chute-side methods to diagnose BRD has been limited. Systems that combine lung auscultation with temperature and body weight data show promise. Assessment of blood metabolites and behavior monitoring offer potential for early identification of morbid animals. Vaccination and metaphyl\",\n  \"pmid\": \"35246687\",\n  \"title\": \"Galyean Appreciation Club Review: revisiting nutrition and health of newly received cattle-what have we learned in the last 15 years?\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1570", "label": "Risk factors associated with testing positive for tuberculosis in high-yielding Holstein cows.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Risk factors associated with testing positive for tuberculosis in high-yielding Holstein cows. Scholars: Mellado Miguel, P\\u00e9rez Elizabeth, Morales Juan L Journal: Tropical animal health and production (2021) PMID: 33532976  Abstract: Tuberculosis remains a significant infectious disease of farm animals and humans worldwide. The objective of this study was to assess various risk factors associated with testing positive for bovine tuberculosis (bTB) in high-yielding Holstein cows in an intensive dry-lot dairy operation. In a retrospective observational study, 9312 records from Holstein cows from a large dairy herd in northern Mexico were used. The incidence rate of lactating cows reactor to bTB was 7.3 cases/100 cow years (95% CI = 6.7-7.9%). Multiple logistic regression models indicated that cows with total milk yield during the first lactation >10,200 kg were 1.3 times (95% confidence intervals (CI) for odds ratio (OR) = 1.2-1.6) more likely to be detected as bTB reactors than cows wi\",\n  \"pmid\": \"33532976\",\n  \"title\": \"Risk factors associated with testing positive for tuberculosis in high-yielding Holstein cows.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1572", "label": "Genes and pathways revealed by whole transcriptome analysis of milk derived bovine mammary epithelial cells after Escherichia coli challenge.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Genes and pathways revealed by whole transcriptome analysis of milk derived bovine mammary epithelial cells after Escherichia coli challenge. Scholars: Iso-Touru Terhi, Panitz Frank, Fischer Daniel Journal: Veterinary research (2024) PMID: 38303095  Abstract: Mastitis, inflammation of the mammary gland, is the costliest disease in dairy cattle and a major animal welfare concern. Mastitis is usually caused by bacteria, of which staphylococci, streptococci and Escherichia coli are most frequently isolated from bovine mastitis. Bacteria activate the mammary immune system in variable ways, thereby influencing the severity of the disease. Escherichia coli is a common cause of mastitis in cattle causing both subclinical and clinical mastitis. Understanding of the molecular mechanisms that activate and regulate the host response would be central to effective prevention of mastitis and breeding of cows more resistant to mastitis. We used primary bovine mammary epithelial cell cultures extrac\",\n  \"pmid\": \"38303095\",\n  \"title\": \"Genes and pathways revealed by whole transcriptome analysis of milk derived bovine mammary epithelial cells after Escherichia coli challenge.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1574", "label": "The economic effect of cow-based reproductive management programs with a systematic use of reproductive hormones.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 The economic effect of cow-based reproductive management programs with a systematic use of reproductive hormones. Scholars: Wicaksono A, Edwardes F, Steeneveld W Journal: Journal of dairy science (2024) PMID: 39154727  Abstract: Hormone-based reproductive management programs can be beneficial to improve dairy cow's reproductive performance. This study aimed to compare the economic impact of reproductive management programs using systematic hormonal treatments to individual cows with a specific DIM range, with a reproductive management program using cow-specific hormonal treatment based on a veterinary diagnosis of ovarian dysfunction during a fertility check. An existing individual cow-based, dynamic, and stochastic bio-economic simulation model, mimicking the production dynamics of a 200 cow-herd in daily time steps, was extended with ovarian dysfunction and fertility inputs. Four hormone-based reproductive management programs were modeled. In the default reproductive management pro\",\n  \"pmid\": \"39154727\",\n  \"title\": \"The economic effect of cow-based reproductive management programs with a systematic use of reproductive hormones.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1575", "label": "Identification of DNA methylation markers for age and Bovine Respiratory Disease in dairy cattle: A pilot study based on Reduced Representation Bisulfite Sequencing.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Identification of DNA methylation markers for age and Bovine Respiratory Disease in dairy cattle: A pilot study based on Reduced Representation Bisulfite Sequencing. Scholars: Attree E, Griffiths B, Panchal K Journal: Communications biology (2024) PMID: 39363014  Abstract: Methylation profiles of animals are known to differ by age and disease status. Bovine respiratory disease (BRD), a complex infectious disease, primarily affects calves and has significant impact on animal welfare and the cattle industry, due to production losses, increased veterinary costs as well as animal losses. BRD susceptibility is multifactorial, influenced by both environmental and genetic factors. We have performed a pilot study to investigate the epigenetic profile of BRD susceptibility in six calves (three healthy versus three diagnosed with BRD) and age-related methylation differences between healthy calves and adult dairy cows (three calves versus four adult cows) using Reduced Representation Bisulfite \",\n  \"pmid\": \"39363014\",\n  \"title\": \"Identification of DNA methylation markers for age and Bovine Respiratory Disease in dairy cattle: A pilot study based on Reduced Representation Bisulfite Sequencing.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1576", "label": "Effects of nonsteroidal anti-inflammatory drugs, therapeutic hoof trimming, and orthopedic block application on lameness in multiparous dairy cattle: A randomized controlled trial.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Effects of nonsteroidal anti-inflammatory drugs, therapeutic hoof trimming, and orthopedic block application on lameness in multiparous dairy cattle: A randomized controlled trial. Scholars: Wilson J P, Green M J, Randall L V Journal: Journal of dairy science (2025) PMID: 39947595  Abstract: Hoof horn lesions are recurrent in nature and cause long-term pathological challenges to the functional anatomy of the hoof in dairy cattle. It is hypothesized that inflammation is a driver of these pathological changes. It has previously been identified that routine treatment with nonsteroidal anti-inflammatory drugs (NSAID) at first and subsequent calving and lameness events is important in reducing the future risk of lameness in dairy heifers. The effects NSAID administration has on lameness outcomes for multiparous dairy cattle is unknown. We conducted a 34-mo randomized controlled trial to investigate the effects of routine administration of the NSAID ketoprofen during treatment for lameness\",\n  \"pmid\": \"39947595\",\n  \"title\": \"Effects of nonsteroidal anti-inflammatory drugs, therapeutic hoof trimming, and orthopedic block application on lameness in multiparous dairy cattle: A randomized controlled trial.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1577", "label": "Influence of bovine pestivirus heterogeneity on serological responses to 10 different commercial vaccine formulation.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Influence of bovine pestivirus heterogeneity on serological responses to 10 different commercial vaccine formulation. Scholars: Camargo Luana, Resende da Silva Gustavo Feliciano, Baccili Camila Costa Journal: Veterinary microbiology (2024) PMID: 38996750  Abstract: Bovine Pestivirus typically involves one or more organ systems, with clinical manifestations ranging from mild to severe fatal systemic illness that lead to significant reproductive, productive, and economic losses. Vaccines face the challenge of addressing the significant variability of pestiviruses, which affects the interaction between viral antigens and the immune system's ability to provide protection. This study aimed to evaluate the serological responses against bovine viral diarrhea virus 1 (Pestivirus A) and Pestivirus B induced by 10 commercial vaccines, including one recombinant (vaccine E), two modified live (MLV multivalent, vaccine I, and MLV monovalent, vaccine J), and seven killed vaccines (KLV, vaccines A \",\n  \"pmid\": \"38996750\",\n  \"title\": \"Influence of bovine pestivirus heterogeneity on serological responses to 10 different commercial vaccine formulation.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1579", "label": "Antibiogram use on dairy cattle for bovine respiratory disease: Factors associated with bacterial pathogen identification and prediction of bacterial recovery using machine learning.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Antibiogram use on dairy cattle for bovine respiratory disease: Factors associated with bacterial pathogen identification and prediction of bacterial recovery using machine learning. Scholars: Monteiro Hugo F, Hoyos-Jaramillo Alejandro, Garzon Adriana Journal: Journal of dairy science (2025) PMID: 40250618  Abstract: Effective isolation of bacterial pathogens for bovine respiratory disease (BRD) is a critical step for accurate diagnosis of the agent associated with this disease on the dairy. Limited information is available on factors associated with herd-level bacterial pathogen recovery for BRD clinical cases, which are important data to help identify strategies to support the successful collection of a minimum number of each organism over time to generate cumulative antibiogram susceptibility testing reports. Our objective was to evaluate factors associated with the recovery of common pathobionts (Pasteurella multocida and Mannheimia haemolytica) in BRD clinical cases from prewean\",\n  \"pmid\": \"40250618\",\n  \"title\": \"Antibiogram use on dairy cattle for bovine respiratory disease: Factors associated with bacterial pathogen identification and prediction of bacterial recovery using machine learning.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1580", "label": "Bactericidal activities and biochemical features of 16 antimicrobial peptides against bovine-mastitis causative pathogens.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Bactericidal activities and biochemical features of 16 antimicrobial peptides against bovine-mastitis causative pathogens. Scholars: Cho Hye-Sun, Kim Dohun, Jeon Hyoim Journal: Veterinary research (2024) PMID: 39543729  Abstract: Mastitis, often caused by bacterial infection, is an inflammatory condition affecting the mammary glands. The condition is particularly prevalent in dairy cattle. Current treatment of bovine mastitis heavily relies on the use of antibiotics. To identify alternative solutions to antibiotic use, we evaluated the antimicrobial activity of 14 cathelicidins reported from 10 animal species. In conjunction, we assessed two bacteriocins against the bovine-mastitis causative bacterial panel, consisting of Escherichia coli, Pseudomonas aeruginosa, Staphylococcus aureus, Bacillus cereus, Enterococcus faecalis, Streptococcus agalactiae, Streptococcus dysgalactiae, and Streptococcus equi. Among the antimicrobial peptides (AMPs), cc-CATH3, ML-CATH, and PD-CATH proved to b\",\n  \"pmid\": \"39543729\",\n  \"title\": \"Bactericidal activities and biochemical features of 16 antimicrobial peptides against bovine-mastitis causative pathogens.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1582", "label": "Selective dry-cow therapy can be implemented successfully in cows of all milk production levels.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Selective dry-cow therapy can be implemented successfully in cows of all milk production levels. Scholars: Rowe Sam, Kabera Fidele, Dufour Simon Journal: Journal of dairy science (2023) PMID: 36653288  Abstract: Antibiotic stewardship on dairy farms can be heightened through the implementation of selective dry-cow therapy (SDCT). However, some producers are concerned that this practice may be related to poor udder health outcomes in cows with high milk production at the time of dry-off. The objective of this study was to evaluate if the effect of culture-guided SDCT (Cult-SDCT) and algorithm-guided SDCT (Alg-SDCT) on dry-period intramammary infection (IMI) dynamics and postcalving udder health and performance [when compared with blanket dry-cow therapy (BDCT)] varied according to milk production level before dry-off. Data were compiled from clinical trials conducted in the United States and Canada that compared Cult-SDCT and Alg-SDCT to a positive control, i.e., BDCT. In those trials\",\n  \"pmid\": \"36653288\",\n  \"title\": \"Selective dry-cow therapy can be implemented successfully in cows of all milk production levels.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1751", "label": "Non-epidermidis coagulase-negative Staphylococcus isolated from farm animals can inhibit the hemagglutinating activity of Newcastle disease virus and bovine parainfluenza virus type 3.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Non-epidermidis coagulase-negative Staphylococcus isolated from farm animals can inhibit the hemagglutinating activity of Newcastle disease virus and bovine parainfluenza virus type 3. Scholars: De la Rosa-Ramos Miguel A, Salcedo-Hern\\u00e1ndez Roberto, Sarmiento-Silva Rosa E Journal: Comparative immunology, microbiology and infectious diseases (2021) PMID: 33892436  Abstract: The Embp protein of Staphylococcus epidermidis inhibits the hemagglutination of the H1N1 influenza virus and protects birds from a viral respiratory infection. Several species of Coagulase-negative Staphylococcus (CoNS) are present in the respiratory cavity, particularly in nostrils. We hypothesize that non-epidermidis CoNS found in animals can have the same function as observed in S. epidermidis. Thirty Non-epidermidis CoNS isolates were obtained from poultry, sheep, goat, pig, and dairy cow nostrils. Haemagglutination inhibition (HI) activity was assayed in bacteria-free supernatants from non-epidermidis CoNS agai\",\n  \"pmid\": \"33892436\",\n  \"title\": \"Non-epidermidis coagulase-negative Staphylococcus isolated from farm animals can inhibit the hemagglutinating activity of Newcastle disease virus and bovine parainfluenza virus type 3.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1752", "label": "Carrier rate of the c.235G>C mutation in the bovine isoleucyl-tRNA synthetase (IARS) gene of Japanese Black cows at Kagoshima prefecture, Japan, and analysis of the metabolic profiling and reproductive performance of heterozygous cows.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Carrier rate of the c.235G>C mutation in the bovine isoleucyl-tRNA synthetase (IARS) gene of Japanese Black cows at Kagoshima prefecture, Japan, and analysis of the metabolic profiling and reproductive performance of heterozygous cows. Scholars: Islam Md Shafiqul, Shinya Urara, Takagi Mitsuhiro Journal: The Journal of veterinary medical science (2021) PMID: 33298632  Abstract: Bovine isoleucyl-tRNA synthetase (IARS) disorder, a major cause of weak calf syndrome, is caused by a homozygous missense (c.235G>C) mutation in the bovine IARS gene of Japanese Black (JB) cattle, which was identified in 2013. However, the extent to which the carrier rate has changed at Kagoshima prefecture, Japan, and whether the carrier status is associated with any clinical or reproductive problems, have yet to be ascertained. In this study, using a real-time polymerase chain reaction-based genotyping assay, we determined the carrier rate in a regional JB cow population at Kagoshima prefecture. Comparative a\",\n  \"pmid\": \"33298632\",\n  \"title\": \"Carrier rate of the c.235G>C mutation in the bovine isoleucyl-tRNA synthetase (IARS) gene of Japanese Black cows at Kagoshima prefecture, Japan, and analysis of the metabolic profiling and reproductive performance of heterozygous cows.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1753", "label": "District-wide herd sanitation and eradication of intramammary Staphylococcus aureus genotype B infection in dairy herds in Ticino, Switzerland.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 District-wide herd sanitation and eradication of intramammary Staphylococcus aureus genotype B infection in dairy herds in Ticino, Switzerland. Scholars: Sesso L, Vanzetti T, Weber J Journal: Journal of dairy science (2024) PMID: 38788844  Abstract: The present study demonstrates successful herd sanitation and eradication of contagious mastitis caused by Staphylococcus aureus genotype B (GTB) in an entire Swiss district (Ticino) including 3,364 dairy cows from 168 farms. Herd sanitation included testing of all cows using a highly GTB-specific and sensitive real-time quantitative PCR (qPCR) assay, implementation of related on-farm measures, appropriate antibiotic therapy of GTB-positive cows, and culling of therapy-resistant animals, respectively. A treatment index was used as an objective criterion to select GTB-positive cows eligible for culling and replacement payment. Sixty-two herds (37%) were initially GTB-positive with a cow prevalence between 10% and 100% and were submitted to\",\n  \"pmid\": \"38788844\",\n  \"title\": \"District-wide herd sanitation and eradication of intramammary Staphylococcus aureus genotype B infection in dairy herds in Ticino, Switzerland.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1754", "label": "Associations of cow and farm characteristics with cow-level lameness using data from an extensive cross-sectional study across 3 structurally different dairy regions in Germany.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Associations of cow and farm characteristics with cow-level lameness using data from an extensive cross-sectional study across 3 structurally different dairy regions in Germany. Scholars: Rittweg Nina, Stock Annegret, Jensen K Charlotte Journal: Journal of dairy science (2023) PMID: 37641258  Abstract: The aim of the present study was to evaluate the associations between milk recording data, body condition score (BCS), housing factors, management factors, and lameness in freestall-housed dairy cows in 3 structurally different regions in Germany. These regions substantially vary regarding herd size, breeds, access to pasture, farm management (family run or company owned), and percentage of organic farms. The data used was collected in a large cross-sectional study from 2016 to 2019. A total of 58,144 cows from 651 farms in 3 regions of Germany (North, East, and South) was scored for locomotion and body condition. Additionally, data on milk yield, milk composition, breed, age, as well \",\n  \"pmid\": \"37641258\",\n  \"title\": \"Associations of cow and farm characteristics with cow-level lameness using data from an extensive cross-sectional study across 3 structurally different dairy regions in Germany.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1755", "label": "Review: Postpartum reproductive disease and fertility in dairy cows.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Review: Postpartum reproductive disease and fertility in dairy cows. Scholars: LeBlanc Stephen J Journal: Animal : an international journal of animal bioscience (2023) PMID: 37567665  Abstract: This paper reviews recent data and concepts on metritis, purulent vaginal discharge (PVD), and endometritis in dairy cows and the ways in which these diseases affect reproductive performance. Metritis is characterized by fetid discharge from the uterus, with or without fever. Purulent vaginal discharge describes exudate that is >50% pus that may be attributable to uterine infection or cervicitis. Endometritis is inflammation of the uterus diagnosed by endometrial cytology with a proportion of neutrophils (typically\\u00a0\\u22655%) that is associated with impaired fertility. Metritis and PVD are associated with uterine bacterial dysbiosis: changes in the microbiota to lesser diversity and greater abundance of pathogens, especially Gram-negative anaerobic bacteria, and Trueperella pyogenes in the case of P\",\n  \"pmid\": \"37567665\",\n  \"title\": \"Review: Postpartum reproductive disease and fertility in dairy cows.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1756", "label": "The effect of pre-calving injection of trace mineral supplements on periparturient disease incidence in pasture based dairy cows.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 The effect of pre-calving injection of trace mineral supplements on periparturient disease incidence in pasture based dairy cows. Scholars: Bates A J, Wells M, Laven R A Journal: Veterinary journal (London, England : 1997) (2022) PMID: 35842221  Abstract: Trace minerals, have a role in immune function and a trace mineral supplement (TMS) can improve animal health in dairy herds. This prospective randomised clinical study assessed whether subcutaneous injection of 5.5\\u00a0mL of TMS (40\\u00a0mg zinc, 10\\u00a0mg manganese, 5\\u00a0mg selenium, 15\\u00a0mg copper per mL), 14-28 days before planned start of calving (PSC) reduced clinical mastitis (CM), subclinical mastitis (SCM) and purulent vaginal discharge (PVD). From four farms, half of 1700 cows stratified on somatic cell count, age and breed were randomly allocated to treatment or no treatment. Occurrence of CM from -\\u00a07 to PSC +\\u00a0100 days, SCM at PSC +\\u00a060 days and PVD at PSC +\\u00a024 days was analysed using survival analysis and Bayesian generalised mixed multiva\",\n  \"pmid\": \"35842221\",\n  \"title\": \"The effect of pre-calving injection of trace mineral supplements on periparturient disease incidence in pasture based dairy cows.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1759", "label": "Temporal trends in bulk tank milk antibody ELISA and PCR test results for bovine viral diarrhoea in New Zealand pastoral dairy herds.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Temporal trends in bulk tank milk antibody ELISA and PCR test results for bovine viral diarrhoea in New Zealand pastoral dairy herds. Scholars: Gates M C, Evans C A, Heuer C Journal: New Zealand veterinary journal (2021) PMID: 32814505  Abstract: No abstract available.\",\n  \"pmid\": \"32814505\",\n  \"title\": \"Temporal trends in bulk tank milk antibody ELISA and PCR test results for bovine viral diarrhoea in New Zealand pastoral dairy herds.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1760", "label": "Severity of Clinical Mastitis and Bacterial Shedding.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Severity of Clinical Mastitis and Bacterial Shedding. Scholars: Krebs Isabel, Zhang Yanchao, Wente Nicole Journal: Pathogens (Basel, Switzerland) (2023) PMID: 37764906  Abstract: The aim of this cross-sectional study was to investigate associated factors of the severity of clinical mastitis (CM). Milk samples of 249 cases of CM were microbiologically examined, of which 27.2% were mild, 38.5% moderate, and 34.3% severe mastitis. The samples were incubated aerobically and anaerobically to investigate the role of aerobic and anaerobic microorganisms. In addition, the pathogen shedding was quantitatively examined, and animal individual data, outside temperature and relative humidity, were collected to determine associated factors for the severity of CM. The pathogen isolated the most was \",\n  \"pmid\": \"37764906\",\n  \"title\": \"Severity of Clinical Mastitis and Bacterial Shedding.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1762", "label": "Ruminant nutrition symposium: novel microbial solutions to optimize production efficiency in beef and dairy systems.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Ruminant nutrition symposium: novel microbial solutions to optimize production efficiency in beef and dairy systems. Scholars: Cappellozza Bruno I, Cooke Reinaldo F, Amaral Rafael C Journal: Journal of animal science (2025) PMID: 40372016  Abstract: The livestock industry is in search of sustainable technologies that enhance the profitability and sustainability of food animal production. Among these technologies, microbial solutions include living bacteria that may support soil, plant, and animal health. Bacterial inoculants have been the most used additives to modulate whole-plant corn silage fermentation, including homo- and heterofermentative bacteria. Bacterial inoculants can improve fermentation characteristics of grass silage, whereas the wide variation in chemical composition and management practices across cool- and warm-season grasses makes the outcome of inoculation less predictable. Tailored recommendations for bacterial inoculant species and strains, based on species and \",\n  \"pmid\": \"40372016\",\n  \"title\": \"Ruminant nutrition symposium: novel microbial solutions to optimize production efficiency in beef and dairy systems.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1763", "label": "Characterization of the genetic pool of the Canadienne dairy cattle breed.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Characterization of the genetic pool of the Canadienne dairy cattle breed. Scholars: Carrier Alexandra, Gilbert Isabelle, Leclerc Pierre Journal: Genetics, selection, evolution : GSE (2023) PMID: 37161364  Abstract: Canadienne cattle are the oldest breed of dairy cattle in North America. The Canadienne breed originates from cattle that were brought to America by the mid-seventeenth century French settlers. The herd book was established in 1886 and the current breed characteristics include dark coat color, small size compared to the modern Holstein breed, and overall rusticity shaped by the harsh environmental conditions that were prevalent during the settlement of North America. The Canadienne breed is an invaluable genetic resource due to its high resilience, longevity and fertility. However, it is heavily threatened with a current herd limited to an estimated 1200 registered animals, of which less than 300 are fullblood. To date, no effort has been made to document the genetic pool\",\n  \"pmid\": \"37161364\",\n  \"title\": \"Characterization of the genetic pool of the Canadienne dairy cattle breed.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1765", "label": "Relationship between total and differential quarter somatic cell counts at dry-off and early lactation.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 Relationship between total and differential quarter somatic cell counts at dry-off and early lactation. Scholars: Dal Pr\\u00e0 Aldo, Biscarini Filippo, Cavani Gian Luca Journal: PloS one (2022) PMID: 36251634  Abstract: Mastitis is a most common disease of dairy cows and causes tremendous economic loss to the dairy industry worldwide. Somatic cell counts (SCC) reflect the inflammatory response to infections and is a metric used as key indicator in mastitis screening programs, typically within the framework of national milk recording schemes. Besides the determination of total SCC, the differentiation of cell types has been described to be beneficial for a more definite description of the actual udder health status of dairy cows. Differential somatic cell count (DSCC) represents the combined proportion of polymorphonuclear leukocytes (PMN) and lymphocytes expressed as a percentage of the total. The aim of this study was to investigate the relationship between SCC and differential somatic c\",\n  \"pmid\": \"36251634\",\n  \"title\": \"Relationship between total and differential quarter somatic cell counts at dry-off and early lactation.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1768", "label": "Diverse \u03b2-lactam antibiotic-resistant bacteria and microbial community in milk from mastitic cows.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Diverse \\u03b2-lactam antibiotic-resistant bacteria and microbial community in milk from mastitic cows. Scholars: Ma Zhengxin, Lee Shinyoung, Fan Peixin Journal: Applied microbiology and biotechnology (2021) PMID: 33587158  Abstract: Intramammary bacterial infection, the most common cause of mastitis, is the most costly disease in dairy cattle in the US and reason for antibiotic usage. Ceftiofur, a third-generation cephalosporin, is generally used to treat such disease, but it has a high treatment failure rate. Though the reason is not known clearly, it is hypothesized that multiple factors are associated with the treatment failure. In this study, we analyzed 169 milk samples from cows with mastitis in two independent dairy farms (Farm A and B) in which 19.4% (Farm A) and 14.3% (Farm B) of the antibiotic treated cows were not cured. The prevalence of cephalosporin-resistant bacteria (CRB) in milk was 72.0% and 42.1% in Farm A and B, respectively. Nineteen and nine bacterial genera were id\",\n  \"pmid\": \"33587158\",\n  \"title\": \"Diverse \\u03b2-lactam antibiotic-resistant bacteria and microbial community in milk from mastitic cows.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1770", "label": "A Disintegrin and Metalloproteinase 17 Disrupts Bovine Macrophage MER Proto-Oncogene Tyrosine Kinase Integrity to Impede Apoptotic Cell Clearance and Promote Inflammation in Clinical Mastitis.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 A Disintegrin and Metalloproteinase 17 Disrupts Bovine Macrophage MER Proto-Oncogene Tyrosine Kinase Integrity to Impede Apoptotic Cell Clearance and Promote Inflammation in Clinical Mastitis. Scholars: Wang Jingyi, Li Ming, Zhao Bichen Journal: Journal of agricultural and food chemistry (2025) PMID: 39731564  Abstract: In clinical mastitis of dairy cows, the abnormal accumulation of apoptotic cells (ACs) and subsequent secondary necrosis and inflammation pose significant concerns, with macrophage-mediated efferocytosis, crucial for ACs clearance, remaining unexplored in this context. In nonruminants, MER proto-oncogene tyrosine kinase (MERTK) receptors are essential for efferocytosis and A Disintegrin and Metalloproteinase 17 (ADAM17) is thought to play a role in regulating MERTK integrity. This study aimed to delineate the in situ role of efferocytosis in clinical mastitis, with a particular focus on the interaction between MERTK and ADAM17 in bovine macrophages. In mastitic mammar\",\n  \"pmid\": \"39731564\",\n  \"title\": \"A Disintegrin and Metalloproteinase 17 Disrupts Bovine Macrophage MER Proto-Oncogene Tyrosine Kinase Integrity to Impede Apoptotic Cell Clearance and Promote Inflammation in Clinical Mastitis.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1773", "label": "[Bacteria species and antibiotic resistance in bovine mastitis within the framework of the \u00abReLait\u00bb project].", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 [Bacteria species and antibiotic resistance in bovine mastitis within the framework of the \\u00abReLait\\u00bb project]. Scholars: Sommer M, Gerber B, Bodmer M Journal: Schweizer Archiv fur Tierheilkunde (2025) PMID: 40626854  Abstract: This sub-study describes the results of mastitis milk samples collected in the canton of Fribourg. In the \\u00abReLait\\u00bb project, a total of 2,441 milk samples were submitted from 123 different farms, from which 3,028 pathogens were isolated. Three pathogens were isolated from 26 milk samples, and two from 535 milk samples. Milk samples could be submitted for subclinical mastitis, clinical mastitis, or before dry period. Most milk samples (n=1,524) were collected and analyzed for subclinical mastitis or before the dry period (n=463). Only a few milk samples came from cows with clinical mastitis (n=123). The most frequently diagnosed pathogens were non-aureus staphylococci (NAS) at 37,4\\u2009%. In addition, frequently diagnosed bacteria were aesculin-positive streptococci, \",\n  \"pmid\": \"40626854\",\n  \"title\": \"[Bacteria species and antibiotic resistance in bovine mastitis within the framework of the \\u00abReLait\\u00bb project].\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1774", "label": "Invited review: Quantifying multiple burdens of dairy cattle production diseases and reproductive inefficiency-Current knowledge and proposed metrics.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Invited review: Quantifying multiple burdens of dairy cattle production diseases and reproductive inefficiency-Current knowledge and proposed metrics. Scholars: Steeneveld W, van den Borne B H P, Kok A Journal: Journal of dairy science (2024) PMID: 39033919  Abstract: The economic burden of diseases and reproductive inefficiency in dairy cattle is evident and has been quantified. Dairy diseases and reproductive inefficiency are however associated with other issues as well, including animal welfare, environmental pressure, and public health risks. Quantifying these other issues is becoming important to help farmers make decisions. Quantification of the noneconomic burdens of diseases and reproductive inefficiency is rare and lacks an overview of approaches and metrics. The first aim of this paper is to provide trends for associating diseases and reproductive inefficiency with economic and noneconomic burdens of disease. The second aim is to provide a review of approaches and metrics u\",\n  \"pmid\": \"39033919\",\n  \"title\": \"Invited review: Quantifying multiple burdens of dairy cattle production diseases and reproductive inefficiency-Current knowledge and proposed metrics.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1781", "label": "Pathogen dependent effects of high amounts of oxytocin on the bloodmilk barrier integrity during mastitis in dairy cows.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Pathogen dependent effects of high amounts of oxytocin on the bloodmilk barrier integrity during mastitis in dairy cows. Scholars: Strasser F J, Feldmann M, Gross J J Journal: Schweizer Archiv fur Tierheilkunde (2021) PMID: 33941509  Abstract: The reduction of antibiotic use in food producing animals becomes increasingly important. Therefore, suitable alternatives for mastitis treatment in dairy cows have to be considered. Oxytocin (OT) induces milk ejection and hence supports milk removal from infected mammary quarters. Beyond udder emptying, the injection of very high dosages of OT causes increased somatic cell counts (SCC) in milk and enables the transfer of immunoglobulins (Ig) from blood into milk through a reduced blood-milk barrier integrity. The aim of the present study was to investigate pathogen-specific changes of SCC, the blood derived milk components lactate dehydrogenase (LDH), serum albumin (SA), and IgG in milk of cows suffering from mastitis caused by different patho\",\n  \"pmid\": \"33941509\",\n  \"title\": \"Pathogen dependent effects of high amounts of oxytocin on the bloodmilk barrier integrity during mastitis in dairy cows.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1783", "label": "The effect of selective dry cow therapies based on 2 different algorithms on antimicrobial use, udder health, milk production, and culling in the absence of internal teat sealant use at dry-off.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 The effect of selective dry cow therapies based on 2 different algorithms on antimicrobial use, udder health, milk production, and culling in the absence of internal teat sealant use at dry-off. Scholars: Paiva D, Menta P, Bielamowicz L P Journal: Journal of dairy science (2024) PMID: 38754835  Abstract: The objective of this study was to evaluate the effect of selective dry cow therapy (SDCT) strategies based on 2 different algorithms in comparison with blanket dry cow therapy for measures of udder health, milk yield, and culling in herds not using internal teat sealant. Cows from 2 commercial farms in west Texas were randomized into 3 different groups: SDCT algorithm 1 (ALG1; n = 455) cows treated with an intramammary antimicrobial at dry-off if SCC >200,000 cells/mL at any Dairy Herd Improvement Association test date or if the cow had 2 or more cases of clinical mastitis (CM) during the enrollment lactation; SDCT algorithm 2 (ALG2; n = 458) cows treated with an intramammary antimi\",\n  \"pmid\": \"38754835\",\n  \"title\": \"The effect of selective dry cow therapies based on 2 different algorithms on antimicrobial use, udder health, milk production, and culling in the absence of internal teat sealant use at dry-off.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1784", "label": "Bovine omphalocele: errors in embryonic development, veterinarian importance, and the way forward.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 Bovine omphalocele: errors in embryonic development, veterinarian importance, and the way forward. Scholars: Boripun Ratchadaporn, Kulnanan Pawinee, Pangprasit Noppason Journal: Veterinary research communications (2022) PMID: 36107281  Abstract: Omphalocele is an embryonic developmental error presented as a neonatal visceral umbilical herniation. Epidemiological and embryological studies are reviewed that revise our understanding of midgut development and defects in cattle. Google Scholar and PubMed were searched for omphalocele, exomphalos, calves, calf, cattle, epidemiology, genetics, disease presentation, and omphalocele treatments of bovine neonates. Omphalocele contains small intestine and sometimes liver and/or pyloric abomasum. This condition may arise from inadequately expanded abdominal cavity, herniated midgut entrapment, or inappropriate umbilical ring growth. Full-term neonates are otherwise healthy but comorbidities may be present. Limited epidemiological evidence sugges\",\n  \"pmid\": \"36107281\",\n  \"title\": \"Bovine omphalocele: errors in embryonic development, veterinarian importance, and the way forward.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1785", "label": "Uterine microbial ecology and disease in cattle: A review.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Uterine microbial ecology and disease in cattle: A review. Scholars: \\u00c7\\u00f6mlekcio\\u011flu U\\u011fur, Jezierska Sylwia, Opsomer Geert Journal: Theriogenology (2024) PMID: 37804686  Abstract: Due to the critical contribution of the uterine-associated microbiota in reproductive health, physiology, and performance, culture-independent methods have been increasingly employed to unravel key aspects of microbial ecology in the uterus of cattle. Nowadays, we know that bacterial diversity is crucial to maintain uterine health, however, there is still no consensus on the exact composition of a healthy uterine microbiota (or eubiosis). Generally, loss of bacterial diversity (or dysbiosis) contributes to the development of uterine infections, associated with increased relative abundances of Bacteroides, Fusobacterium, Trueperella, and Porphyromonas. Uterine infections are highly prevalent and gravely influence the profitability of cattle operations, animal welfare, and public health. Thus, understanding the \",\n  \"pmid\": \"37804686\",\n  \"title\": \"Uterine microbial ecology and disease in cattle: A review.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1786", "label": "Why isn't the transition period getting the attention it deserves? Farm advisors' opinions and experiences of managing dairy cow health in the transition period.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Why isn't the transition period getting the attention it deserves? Farm advisors' opinions and experiences of managing dairy cow health in the transition period. Scholars: Redfern Emma A, Sinclair Liam A, Robinson Philip A Journal: Preventive veterinary medicine (2021) PMID: 34298302  Abstract: During the transition period three weeks before and after calving the dairy cow is at greater risk of developing disease, to the detriment of welfare and production. An understanding of the reasons why and how farmers and their advisors engage in efforts to control metabolic disease during the transition period is required if these diseases are to be more successfully controlled. The study reported here, based on interview research, investigates the opinions and behaviours of farm advisors on transition cow management and nutrition, their experiences of working with their respective farm clients, and interactions with other farm advisors to help manage transition cow health and productivity. S\",\n  \"pmid\": \"34298302\",\n  \"title\": \"Why isn't the transition period getting the attention it deserves? Farm advisors' opinions and experiences of managing dairy cow health in the transition period.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1787", "label": "Blood-feeding stable flies, Stomoxys calcitrans (Diptera: Muscidae), are attracted to, and transmit Staphylococcus aureus (Bacillales: Staphylococcaceae), a causal agent of bovine mastitis: a laboratory pilot study.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Blood-feeding stable flies, Stomoxys calcitrans (Diptera: Muscidae), are attracted to, and transmit Staphylococcus aureus (Bacillales: Staphylococcaceae), a causal agent of bovine mastitis: a laboratory pilot study. Scholars: Nayani Saif, Meraj Sanam, Renyard Asim Journal: Journal of medical entomology (2024) PMID: 39213529  Abstract: Stable flies, Stomoxys calcitrans (Linnaeus) (Diptera: Muscidae), are common blood-feeding ectoparasites of cows and thus potential vectors of the skin-dwelling bacterium Staphylococcus aureus, a causal agent of bovine mastitis which inflicts udder inflammation in cows. Our objectives were to determine whether stable flies (i) are attracted to disease-causing strains of S. aureus, and (ii) transmit S. aureus from infected blood to sterile blood. In 3-chamber olfactometers, five of eight S. aureus strains grown on agar and tested versus sterile agar attracted female stable flies. When flies ingested droplets of blood inoculated with S. aureus at doses of\",\n  \"pmid\": \"39213529\",\n  \"title\": \"Blood-feeding stable flies, Stomoxys calcitrans (Diptera: Muscidae), are attracted to, and transmit Staphylococcus aureus (Bacillales: Staphylococcaceae), a causal agent of bovine mastitis: a laboratory pilot study.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1789", "label": "Improvement of mammary gland health in 81 'sentinel herds' in England and Scotland between 2012 and 2021.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Improvement of mammary gland health in 81 'sentinel herds' in England and Scotland between 2012 and 2021. Scholars: Leach Katharine A, Holsey Hannah J, Bradley Andrew J Journal: The Veterinary record (2024) PMID: 38012022  Abstract: Achieving a reduction in mastitis in dairy cows is a common industry goal, but there is no recent peer-reviewed record of progress in the UK. A convenience sample of 125 herds in England and Scotland was recruited based on the quality of records in 2016, willingness to participate and representative geographical distribution. Individual cow somatic cell counts and clinical mastitis data from 2012 to 2021 were summarised annually, and temporal changes were analysed. Eighty-one herds had sufficient data for comparison between 2012 and 2021, for one or more parameters. Over this period, the median incidence rate of clinical mastitis decreased from 40.0 to 21.0 cases per 100 cows per year (p\\u00a0<\\u00a00.001), with improvement in both lactation and dry period indicato\",\n  \"pmid\": \"38012022\",\n  \"title\": \"Improvement of mammary gland health in 81 'sentinel herds' in England and Scotland between 2012 and 2021.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1790", "label": "In vitro efficacy of bovine lactoferrin against bovine viral diarrhea virus.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 In vitro efficacy of bovine lactoferrin against bovine viral diarrhea virus. Scholars: Cui Hongwei, Li Songda, Yan Xiaohuan Journal: Archives of microbiology (2025) PMID: 40261405  Abstract: Bovine viral diarrhea virus (BVDV) infection represents a significant economic challenge to the global cattle industry, leading to considerable losses in productivity and increased management costs. This underscores the urgent need for effective antiviral strategies to combat BVDV infection. In this study, we demonstrated that bovine lactoferrin (bLF), a multifunctional glycoprotein with known antimicrobial properties, exhibited potent inhibitory activity against BVDV infection. Importantly, the antiviral effect of bLF was not mediated by cytotoxicity towards host cells, indicating its safety for potential applications. Mechanistic investigations revealed that bLF did not interfere with viral RNA translation or replication, nor did it impair viral assembly or release. Instead, bLF effectively blo\",\n  \"pmid\": \"40261405\",\n  \"title\": \"In vitro efficacy of bovine lactoferrin against bovine viral diarrhea virus.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1791", "label": "Comparison between broth microdilution and agar disk diffusion methods for antimicrobial susceptibility testing of bovine mastitis pathogens.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Comparison between broth microdilution and agar disk diffusion methods for antimicrobial susceptibility testing of bovine mastitis pathogens. Scholars: Palladini Giorgia, Garbarino Chiara, Luppi Andrea Journal: Journal of microbiological methods (2023) PMID: 37544431  Abstract: In order to counter the antibiotic resistance phenomenon, a prudent and rational use of antimicrobials should be driven by an accurate clinical diagnosis and, when possible, by the isolation of the etiological agent followed by susceptibility testing, with the aim to select the most suitable molecule for therapy. Cow mastitis is considered the main cause of antibiotic use in the cattle breeding sector. The purpose of this study was to compare the broth microdilution (BMD) method performed with Sensititre Custom Plates and the agar disk diffusion (ADD) method in determining antimicrobial susceptibility of 215 isolates from bovine mastitis, including contagious pathogens (Staphylococcus aureus, Streptococcus aga\",\n  \"pmid\": \"37544431\",\n  \"title\": \"Comparison between broth microdilution and agar disk diffusion methods for antimicrobial susceptibility testing of bovine mastitis pathogens.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1793", "label": "[Investigations of a controlled, decision tree based procedure for Selective Dry Cow Treatment in Bavarian dairy farms].", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 [Investigations of a controlled, decision tree based procedure for Selective Dry Cow Treatment in Bavarian dairy farms]. Scholars: Sonnewald-Daum Tanja, Euchner Katharina, Frost Laetitia Journal: Tierarztliche Praxis. Ausgabe G, Grosstiere/Nutztiere (2024) PMID: 38701797  Abstract: Four parameters of a decision tree for Selective Dry Cow Treatment (SDCT), examined in a previous study, were analyzed regarding their efficacy in detecting cows for dry cow treatment (DCT, use of intramammary antimicrobials). This study set out to review wether all parameters (somatic cell count [SCC\\u2265 200\\u2009000 SC/ml 3 months' milk yield recordings prior dry off (DO)], clinical mastitis history during lactation [\\u22651 CM], culturing [14d prior DO, detection of major pathogens] and California-Mastitis-Test [CMT, > rate 1/+ at DO]) are necessary for accurate decision making, whether there are possible alternatives to replace culturing, and whether a simplified model could replace the decision tree. Records of 18\",\n  \"pmid\": \"38701797\",\n  \"title\": \"[Investigations of a controlled, decision tree based procedure for Selective Dry Cow Treatment in Bavarian dairy farms].\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1794", "label": "Prevalence and associated risk factors of anti-Coxiella burnetii antibodies in dairy cattle herds using bulk tank milk analysis in Kabylia area, north Algeria.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Prevalence and associated risk factors of anti-Coxiella burnetii antibodies in dairy cattle herds using bulk tank milk analysis in Kabylia area, north Algeria. Scholars: Agag Salah, Medrouh Bachir, Khaled Hamza Journal: Tropical animal health and production (2024) PMID: 38507146  Abstract: Coxiella burnetii, or Q fever agent, has notable implications for human and livestock health. Infections in cattle primarily manifest through reproductive issues where infected animals shed the bacterium in birth fluids, placental tissues, and milk, serving as potential sources of transmission. Bovine herds become reservoirs, contributing to the environmental contamination of farming areas. Comprehensive studies on the prevalence, transmission routes, and associated risk factors among cattle contribute to the development of effective control strategies, ultimately safeguarding both livestock and public health.Here we determine the prevalence of Coxiella burnetii antibodies against in dairy cattle f\",\n  \"pmid\": \"38507146\",\n  \"title\": \"Prevalence and associated risk factors of anti-Coxiella burnetii antibodies in dairy cattle herds using bulk tank milk analysis in Kabylia area, north Algeria.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1796", "label": "Risk assessment and seroprevalence of bovine herpesvirus type 1 infection in dairy herds in the inner Aegean Region of Turkey.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 Risk assessment and seroprevalence of bovine herpesvirus type 1 infection in dairy herds in the inner Aegean Region of Turkey. Scholars: \\u0130nce \\u00d6mer Bar\\u0131\\u015f, \\u015eevik Murat Journal: Comparative immunology, microbiology and infectious diseases (2022) PMID: 34929412  Abstract: This cross-sectional study was performed to investigate the seroprevalence and associated risk factors of bovine herpesvirus type 1 (BoHV-1) infection in dairy cattle herds in Afyonkarahisar province in the Aegean Region of Turkey. Blood samples were collected from 602 cattle from 56 unvaccinated dairy herds between May 2018 and June 2019. Animal and herd-level epidemiological information was collected with a questionnaire during blood collection. Specific antibodies against BoHV-1 and bovine viral diarrhea virus (BVDV) were detected by using a virus neutralization test and a commercial indirect ELISA kit, respectively. Univariable and multivariable logistic regression analyses were used to determine any association bet\",\n  \"pmid\": \"34929412\",\n  \"title\": \"Risk assessment and seroprevalence of bovine herpesvirus type 1 infection in dairy herds in the inner Aegean Region of Turkey.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1798", "label": "Mycoplasma leachii strain PG50 shows reduced adherence and invasion compared to M. bovis strains 428E and PG45.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Mycoplasma leachii strain PG50 shows reduced adherence and invasion compared to M. bovis strains 428E and PG45. Scholars: Nielsen Daniel W, Hau Samantha J, Holthausen David J Journal: Veterinary research communications (2025) PMID: 41026261  Abstract: Mycoplasma leachii is a member of the \\\"Mycoplasma mycoides cluster\\\", which includes the causative agent of contagious bovine pleuropneumonia (Mycoplasma mycoides subsp. mycoides). Mycoplasma leachii has been associated with severe outbreaks of polyarthritis, mastitis, and abortion in dairy cattle in Australia, Argentina, and China. As M. leachii has veterinary implications and is related to other foreign animal diseases of economic importance, we sought to investigate differences in adherence to and invasion of different bovine cells between M. leachii type strain PG50 and M. bovis strains (type strain PG45 and field strain 428E). Specifically, we tested the strains with Madin-Darby bovine kidney (MDBK), bovine turbinate (BTu), and the \",\n  \"pmid\": \"41026261\",\n  \"title\": \"Mycoplasma leachii strain PG50 shows reduced adherence and invasion compared to M. bovis strains 428E and PG45.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1799", "label": "Histophilus somni disease conditions with simultaneous infections by ovine gammaherpesvirus 2 in cattle herds from Southern Brazil.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Histophilus somni disease conditions with simultaneous infections by ovine gammaherpesvirus 2 in cattle herds from Southern Brazil. Scholars: Headley Selwyn Arlington, Fritzen Juliana Torres Tomazi, Silva Denise Correia Journal: Brazilian journal of microbiology : [publication of the Brazilian Society for Microbiology] (2023) PMID: 36759491  Abstract: This report investigated the cause of cattle mortality in two farms in Southern Brazil. The tissues of one animal from each farm (animals #1 and #2) respectively were used in\\u00a0pathological and molecular investigations to determine the possible cause of death. The principal pathological findings observed in animal #1 were pulmonary, myocardial, and encephalitic hemorrhages with vasculitis, and lymphoplasmacytic interstitial pneumonia with proliferative vascular lesions (PVL). The main pathological findings observed in animal #2 were purulent bronchopneumonia, hemorrhagic myocarditis, and lymphoplasmacytic interstitial pneumonia with PVL. \",\n  \"pmid\": \"36759491\",\n  \"title\": \"Histophilus somni disease conditions with simultaneous infections by ovine gammaherpesvirus 2 in cattle herds from Southern Brazil.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1801", "label": "Investigating compliance with cow comfort and mastitis control recommendations on mastitis outcomes in smallholder dairy farms in Central Kenya.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Investigating compliance with cow comfort and mastitis control recommendations on mastitis outcomes in smallholder dairy farms in Central Kenya. Scholars: Ng'ang'a E K, VanLeeuwen J, Gitau G K Journal: Research in veterinary science (2025) PMID: 39693899  Abstract: A randomized controlled trial was conducted in Kenya in 2020 with the objectives being to assess compliance of smallholder dairy farmers (SDF) with farm-specific mastitis and cow comfort recommendations, to determine factors associated with compliance, and to determine the impact of these recommendations in reducing cases of subclinical mastitis. A total of 114 SDFs (124 cows) were recruited into the study and randomly allocated into intervention (74 farms) and control (40 farms) groups during the first farm visit. Existing farm-level mastitis control and cow comfort strategies were assessed in both intervention and control farms. Cow parameters (e.g. udder hygiene) were observed or measured from individual cows. A Califor\",\n  \"pmid\": \"39693899\",\n  \"title\": \"Investigating compliance with cow comfort and mastitis control recommendations on mastitis outcomes in smallholder dairy farms in Central Kenya.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1802", "label": "Clone Dynamics and Its Application for the Diagnosis of Enzootic Bovine Leukosis.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Clone Dynamics and Its Application for the Diagnosis of Enzootic Bovine Leukosis. Scholars: Hossain Md Belal, Kobayashi Tomoko, Makimoto Sakurako Journal: Journal of virology (2023) PMID: 36533951  Abstract: Bovine leukemia virus (BLV) infection results in polyclonal expansion of infected B lymphocytes, and ~5% of infected cattle develop enzootic bovine leukosis (EBL). Since BLV is a retrovirus, each individual clone can be identified by using viral integration sites. To investigate the distribution of tumor cells in EBL cattle, we performed viral integration site analysis by using a viral DNA capture-sequencing method. We found that the same tumor clones existed in peripheral blood, with a dominance similar to that in lymphoma tissue. Additionally, we observed that multiple tumor tissues from different sites harbored the identical clones, indicating that tumor cells can circulate and distribute systematically in EBL cattle. To investigate clonal expansion of BLV-infected cells durin\",\n  \"pmid\": \"36533951\",\n  \"title\": \"Clone Dynamics and Its Application for the Diagnosis of Enzootic Bovine Leukosis.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1803", "label": "A 1-Year Investigation of Extended-Spectrum Beta-Lactamase-Producing ", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 A 1-Year Investigation of Extended-Spectrum Beta-Lactamase-Producing  Scholars: Taniguchi Takako, Latt Khin Maung, Tarigan Elpita Journal: Microbial drug resistance (Larchmont, N.Y.) (2021) PMID: 33900856  Abstract: In a large-scale dairy farm, it is important to take countermeasure of prevention against mastitis of dairy cows, and it is especially important to establish hygiene and risk management to prevent the emergence and spread of antibiotic-resistant bacteria. In this study, we have performed bacteriological testing of clinical and subclinical mastitis and investigation of antimicrobial resistance bacteria in a large-scale farm for 1 year. The bacteria isolated most frequently from 1,549 samples of 952 cow, including cows with recurring mastitis were \",\n  \"pmid\": \"33900856\",\n  \"title\": \"A 1-Year Investigation of Extended-Spectrum Beta-Lactamase-Producing \"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1804", "label": "Detection of ", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Detection of  Scholars: Brown Matthew, Laney Zackary, Tabatabai Laila Journal: Journal of veterinary diagnostic investigation : official publication of the American Association of Veterinary Laboratory Diagnosticians, Inc (2025) PMID: 39994499  Abstract: The bovine respiratory disease complex (BRDC) is a multifactorial disease of economic importance in cattle involving viral and bacterial agents and several environmental and host-associated predisposing factors. \",\n  \"pmid\": \"39994499\",\n  \"title\": \"Detection of \"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1806", "label": "Unveiling the epidemiology and community perspectives on bovine brucellosis in North Shewa, Central Highlands of Ethiopia.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Unveiling the epidemiology and community perspectives on bovine brucellosis in North Shewa, Central Highlands of Ethiopia. Scholars: Engdawork Aweke, Bulbula Abdela, Melak Awoke Journal: Scientific reports (2025) PMID: 39880840  Abstract: Brucellosis is a bacterial disease of many domestic and wild animals with great economic and public health importance. Although it has a major constraint in dairy production, comprehensive information regarding the epidemiology of brucellosis in dairy herds is limited. Besides, evaluating the dairy farmers' knowledge, attitude, and practice (KAP) regarding brucellosis is crucial for generating information that can enhance control programs and public health interventions. Thus, this study aims to investigate the seroepidemiology of brucellosis and evaluate the dairy farmers' KAP in North Shewa, central highlands of Ethiopia. A total of 511 blood samples were randomly collected from 142 dairy herds. Rose Bengal plate test (RBPT) was used for primary s\",\n  \"pmid\": \"39880840\",\n  \"title\": \"Unveiling the epidemiology and community perspectives on bovine brucellosis in North Shewa, Central Highlands of Ethiopia.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1808", "label": "Longitudinal analysis reveals transitions in pathogen profiles associated with mastitis in dairy cows.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Longitudinal analysis reveals transitions in pathogen profiles associated with mastitis in dairy cows. Scholars: Lirot H\\u00e9l\\u00e8ne, Crespin Laurent, Gasqui Patrick Journal: Veterinary research (2025) PMID: 41413575  Abstract: Mastitis is a multifactorial infection of the udder potentially caused by many pathogens of varying severity and prevalence and it is one of the most common diseases on dairy farms. Limited information exists about the ecological interactions among pathogens in mastitis infections. This study aims (1) to identify the potential sources of the mastitis-causing pathogens at the farm level, (2) to analyse the statistical associations and dynamics of these pathogens over time in the milk microbiota, and (3) to assess their impact on somatic cell count (SCC) fluctuation. To address these objectives, two 4-month longitudinal studies were conducted on cows of six dairy farms in the Auvergne region of France. Milk and faeces were collected from a total of 33 cows, along with \",\n  \"pmid\": \"41413575\",\n  \"title\": \"Longitudinal analysis reveals transitions in pathogen profiles associated with mastitis in dairy cows.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1811", "label": "Expanding Horizons: Host Range Evolution and Treatment Strategies for Highly Pathogenic Avian Influenza H5N1 and H7N9.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Expanding Horizons: Host Range Evolution and Treatment Strategies for Highly Pathogenic Avian Influenza H5N1 and H7N9. Scholars: Gazik Nika Heidari, Holodniy Mark, Bayat Vafa Journal: Viruses (2025) PMID: 41600819  Abstract: Avian influenza viruses (AIVs), including H5N1 and H7N9, from the Orthomyxoviridae family present substantial public health concerns. The predominant circulating clade 2.3.4.4b has demonstrated enhanced capacity for mammalian adaptation, raising concerns about potential reassortment with human seasonal influenza viruses. Unlike H7N9's limited host range, H5N1 infects birds, various mammals, and humans. Recent concerns include widespread H5N1 infection of U.S. dairy cattle across 18 states, affecting over 1000 herds with 71 human infections (70 H5N1 and 1 H5N5). Key observations include cow-to-cow transmission, viral presence in milk, and transmission to humans, mainly through occupational exposure. Evidence of mammal-to-mammal transmission has been documented in \",\n  \"pmid\": \"41600819\",\n  \"title\": \"Expanding Horizons: Host Range Evolution and Treatment Strategies for Highly Pathogenic Avian Influenza H5N1 and H7N9.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1812", "label": "Negatively controlled trial investigating the effects of dry cow therapy on clinical mastitis and culling in multiparous cows.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Negatively controlled trial investigating the effects of dry cow therapy on clinical mastitis and culling in multiparous cows. Scholars: Dziuba Monika, Caixeta Luciano S, Boyum Brett Journal: Journal of dairy science (2023) PMID: 37349210  Abstract: Blanket dry cow therapy (DCT) is a major contributor to overall antibiotic usage on dairy farms in the United States. With low prevalence of intramammary infections at dry-off in US herds today, alternative DCT approaches have been the focus of much research. We hypothesized that complete cessation of DCT [i.e., use of internal teat sealants (ITS) only at dry-off] could be a practical alternative to blanket DCT in well-managed herds. The objective of this negatively controlled clinical trial was to determine the effects of DCT on clinical mastitis (CM) and removal from the herd during the dry period and the first 200 d of the subsequent lactation in multiparous dairy cows treated with only ITS at dry-off. As a secondary objective, we cond\",\n  \"pmid\": \"37349210\",\n  \"title\": \"Negatively controlled trial investigating the effects of dry cow therapy on clinical mastitis and culling in multiparous cows.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1815", "label": "Retrospective evaluation of the causes and distribution of lameness in beef and dairy cattle evaluated by ambulatory and in-house clinical services at a North American veterinary teaching hospital.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Retrospective evaluation of the causes and distribution of lameness in beef and dairy cattle evaluated by ambulatory and in-house clinical services at a North American veterinary teaching hospital. Scholars: Fenster Lindsey L, Ruchti Logan L, Credille Brent C Journal: Journal of the American Veterinary Medical Association (2023) PMID: 37085143  Abstract: To describe the causes and distribution of lameness in beef and dairy cattle presenting to either a primary care ambulatory or in-house clinical service at a veterinary teaching hospital. This retrospective clinical case study was conducted by reviewing hospital admissions of beef and dairy cattle seen by in-house or ambulatory clinicians at a veterinary teaching hospital from 2001 to 2021. Final diagnosis was recorded and, when available, the affected limb, whether a lesion was localized to the digit, and the affected claw were also recorded. Data were stratified by location of initial evaluation (ambulatory vs in hospital), period \",\n  \"pmid\": \"37085143\",\n  \"title\": \"Retrospective evaluation of the causes and distribution of lameness in beef and dairy cattle evaluated by ambulatory and in-house clinical services at a North American veterinary teaching hospital.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1816", "label": "Bacteriophage Cocktails Protect Dairy Cows Against Mastitis Caused By Drug Resistant ", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Bacteriophage Cocktails Protect Dairy Cows Against Mastitis Caused By Drug Resistant  Scholars: Guo Mengting, Gao Ya, Xue Yibing Journal: Frontiers in cellular and infection microbiology (2021) PMID: 34222051  Abstract: Mastitis caused by \",\n  \"pmid\": \"34222051\",\n  \"title\": \"Bacteriophage Cocktails Protect Dairy Cows Against Mastitis Caused By Drug Resistant \"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1817", "label": "Intramammary preparation of enrofloxacin hydrochloride-dihydrate for bovine mastitis (biofilm-forming ", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Intramammary preparation of enrofloxacin hydrochloride-dihydrate for bovine mastitis (biofilm-forming  Scholars: C\\u00f3rdova-Gonz\\u00e1lez Diana, Alfonseca-Silva Edgar, Guti\\u00e9rrez Lilia Journal: Journal of veterinary science (2024) PMID: 38311321  Abstract: Chronic bovine mastitis is linked to biofilm-producing  Bp-Sa and bp-Scn were treated with intramammary preparations of either enrofloxacin HCl\\u00b72H Milk samples were obtained from the affected quarters in a herd. Phenotypical and genotypical identifications as biofilm-producing  Fifty-seven percent of the isolates were identified as  Enro-C/DMSO/chitosan eliminates bp-Sa and bp-Scn from cases of chronic bovine mastitis.\",\n  \"pmid\": \"38311321\",\n  \"title\": \"Intramammary preparation of enrofloxacin hydrochloride-dihydrate for bovine mastitis (biofilm-forming \"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1818", "label": "Total and pathogen-specific serum Immunoglobulin G concentrations in neonatal beef calves, Part 1: Risk factors.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Total and pathogen-specific serum Immunoglobulin G concentrations in neonatal beef calves, Part 1: Risk factors. Scholars: Gamsj\\u00e4ger Lisa, Haines Deborah M, L\\u00e9vy Michel Journal: Preventive veterinary medicine (2023) PMID: 37806919  Abstract: Maternal antibodies, delivered to the calf via colostrum, are crucial to prevent calfhood diseases and death. However, knowledge regarding the factors influencing this transfer of total and specific Immunoglobulin G (IgG) against common enteric and respiratory disease pathogens under current production conditions is sparse. The objectives of this study were to determine risk factors influencing total and pathogen-specific immunoglobulin G (IgG) concentrations against Escherichia coli (E. coli), bovine Rotavirus (BRoV), Cryptosporidium parvum (C. parvum), Bovine Viral Diarrhea Virus type 1 and 2 (BVDV), Parainfluenza Virus Type 3 (PI-3), Bovine Respiratory Syncytial Virus (BRSV), and Bovine Herpesvirus type 1 (BHV-1) in the serum of newborn beef c\",\n  \"pmid\": \"37806919\",\n  \"title\": \"Total and pathogen-specific serum Immunoglobulin G concentrations in neonatal beef calves, Part 1: Risk factors.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1820", "label": "Association of pathogen-specific clinical mastitis in the first 100 days of first lactation with productive lifetime: An observational study comparing competing risks models for death and sale with the Cox model.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Association of pathogen-specific clinical mastitis in the first 100 days of first lactation with productive lifetime: An observational study comparing competing risks models for death and sale with the Cox model. Scholars: Hertl Julia A, Schukken Ynte H, Tauer Loren W Journal: Preventive veterinary medicine (2023) PMID: 36841041  Abstract: The objective of this observational study was to study the association between clinical mastitis (CM) (Streptococcus spp., Staphylococcus aureus, Staphylococcus spp., Escherichia coli, Klebsiella spp., cases with other treated or other not treated organisms, CM without growth) occurring in a dairy cow's first 100 days (d) of her first lactation and her total productive lifetime, ending in death or sale (for slaughter). Data were collected from 24,831 cows in 5 New York Holstein herds from 2004 to 2014. Two analytical approaches were compared. First, removals (death, sale) were treated as competing events in separate survival analyses, in proportion\",\n  \"pmid\": \"36841041\",\n  \"title\": \"Association of pathogen-specific clinical mastitis in the first 100 days of first lactation with productive lifetime: An observational study comparing competing risks models for death and sale with the Cox model.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1821", "label": "Continuous sampling of healthy and mastitic quarters of lactating cattle by ultrafiltration after intramammary ceftiofur hydrochloride administration.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Continuous sampling of healthy and mastitic quarters of lactating cattle by ultrafiltration after intramammary ceftiofur hydrochloride administration. Scholars: Mzyk Danielle A, Halleran Jennifer L, Sylvester Hannah J Journal: Journal of veterinary internal medicine (2024) PMID: 39134329  Abstract: Pharmacological activity of intramammary drugs depends on adequate drug concentrations within the cistern, but sampling is often limited. Insight into the active drug concentration within the mammary cistern may assist in determining effective and appropriate therapeutic decisions for cows being treated for mastitis. Evaluate the disposition of ceftiofur hydrochloride administered intramammary in diseased and nondiseased quarters. Whole milk and ultrafiltrate sampling techniques were compared. Ten mature, late lactation Holstein (n\\u2009=\\u20099) and Jersey (n\\u2009=\\u20091) dairy cows (422-670\\u2009kg) with naturally occurring clinical mastitis, producing between 1.4 and 15.9\\u2009kg/day of milk. Ultrafiltration probe\",\n  \"pmid\": \"39134329\",\n  \"title\": \"Continuous sampling of healthy and mastitic quarters of lactating cattle by ultrafiltration after intramammary ceftiofur hydrochloride administration.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1825", "label": "Early life indicators of first lactation milk yield and the effect of treatment for bovine respiratory disease on survivability and risk of pregnancy in Holstein dairy cattle.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 Early life indicators of first lactation milk yield and the effect of treatment for bovine respiratory disease on survivability and risk of pregnancy in Holstein dairy cattle. Scholars: Hurst T S, Neves R C, Boerman J P Journal: Veterinary journal (London, England : 1997) (2022) PMID: 35378264  Abstract: The primary objective of this study was to evaluate the long-term effects of variables that could be measured early in life on first lactation milk production. The secondary objective was to evaluate the long-term effects of treatment for bovine respiratory disease (BRD), within the first 120 days of life, on survivability to 850 days and reproductive success. Data from Holstein heifer calves was collected from 1 October, 2015-31 January, 2020 and included milk consumption (MC; n\\u00a0=\\u00a010,431), bodyweight (BW; n\\u00a0=\\u00a09,825), average daily gain (ADG; n\\u00a0=\\u00a06,194), heifer conception age (n\\u00a0=\\u00a010,112), and 305-day first lactation milk production (305\\u00a0M; n\\u00a0=\\u00a05,823), and treatment records for BRD (\",\n  \"pmid\": \"35378264\",\n  \"title\": \"E
