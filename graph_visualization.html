arly life indicators of first lactation milk yield and the effect of treatment for bovine respiratory disease on survivability and risk of pregnancy in Holstein dairy cattle.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1826", "label": "Profile of circular RNAs in bovine mammary tissues infected with Staphylococcus aureus.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Profile of circular RNAs in bovine mammary tissues infected with Staphylococcus aureus. Scholars: Zhou Li, Luoreng Zhuoma, Wang Xingping Journal: Archives of microbiology (2025) PMID: 39982455  Abstract: Mastitis is one of the most common diseases in cattle. The causes are complex, and the disease tends to recur and its difficult to cure, resulting in significant economic losses to the global dairy industry each year. Circular RNAs (circRNAs), a class of endogenous non-coding RNAs (ncRNAs), have recently been recognized as key regulators in inflammatory diseases. However, little is known about the roles of circRNAs in mastitis caused by Staphylococcus aureus (S. aureus) infection. In this study, bovine mammary gland tissue was treated with S. aureus (10\",\n  \"pmid\": \"39982455\",\n  \"title\": \"Profile of circular RNAs in bovine mammary tissues infected with Staphylococcus aureus.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1829", "label": "Establishment of a fetal cow (Bos Borus) skin fibroblasts cell line with immortalized characterization through human telomerase reverse transcriptase (hTERT) ectopic expression.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 Establishment of a fetal cow (Bos Borus) skin fibroblasts cell line with immortalized characterization through human telomerase reverse transcriptase (hTERT) ectopic expression. Scholars: Ren Shanhui, Yang Xue, Peng Tingyu Journal: Journal of virological methods (2022) PMID: 35961484  Abstract: The ectopic introduction of the human telomerase reverse transcriptase (hTERT) is an effective way to establish an immortalized cell line. Here, hTERT was obtained by RT-PCR, and the eukaryotic expression plasmid and lentivirus shuttle plasmid of hTERT was successfully constructed by the homologous recombination method. The stable expression of hTERT in fetal cow skin fibroblasts (CSF) was established using the lentivirus package system. The hTERT-CSF proliferate and have immortalized characteristics. Meanwhile, the chromosome analysis identified that the number and structure of the hTERT-CSF genome maintain stable. The indirect immunofluorescence, western blot, and flow cytometry showed that \",\n  \"pmid\": \"35961484\",\n  \"title\": \"Establishment of a fetal cow (Bos Borus) skin fibroblasts cell line with immortalized characterization through human telomerase reverse transcriptase (hTERT) ectopic expression.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1832", "label": "Review of guidelines for functional claw trimming and therapeutic approach to claw horn lesions in cattle.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Review of guidelines for functional claw trimming and therapeutic approach to claw horn lesions in cattle. Scholars: Vidmar M, Hodnik J J, Stari\\u010d J Journal: Tropical animal health and production (2021) PMID: 34553277  Abstract: Lameness is one of the most pressing health and welfare problems in cattle, especially on dairy farms. The most common cause of lameness is claw pathology, often due to lack of appropriate functional claw trimming. Functional claw trimming restores the physiological shape of the claws and distributes weight properly between the claws and over the claw weight-bearing surface. It also allows closer examination of the claws for early signs of pathology. The methods of functional claw trimming described in the previous century are still applicable today, considering some recent findings on the subject. It is essential not to over-trim the claws and to maintain strict hygiene of the trimming tools. Claw horn pathology in the early stages is usually treated effectiv\",\n  \"pmid\": \"34553277\",\n  \"title\": \"Review of guidelines for functional claw trimming and therapeutic approach to claw horn lesions in cattle.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1833", "label": "Region-wise analysis of dairy cow movements in Japan.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Region-wise analysis of dairy cow movements in Japan. Scholars: Murato Yoshinori, Hayama Yoko, Shimizu Yumiko Journal: BMC veterinary research (2021) PMID: 34503516  Abstract: Animal movement is considered the most significant factor in the transmission of infectious diseases in livestock. A better understanding of its effects would help provide a more reliable estimation of the disease spread and help develop effective control measures. If the movement pattern is heterogeneous, its characteristics should be considered in epidemiological analyses, such as when using simulation models to obtain reliable outputs. In Japan, following the bovine spongiform encephalopathy epidemic, a traceability system for cattle was established in 2003, and the registration of all cattle movements in the national database began. This study is the first to analyze cattle movements in Japan. We examined regional and seasonal heterogeneity in dairy cow movements, which accounted for most Japanese breeding \",\n  \"pmid\": \"34503516\",\n  \"title\": \"Region-wise analysis of dairy cow movements in Japan.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1834", "label": "A stochastic animal life cycle simulation model for a whole dairy farm system model: Assessing the value of combined heifer and lactating dairy cow reproductive management programs.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 A stochastic animal life cycle simulation model for a whole dairy farm system model: Assessing the value of combined heifer and lactating dairy cow reproductive management programs. Scholars: Li M, Reed K F, Lauber M R Journal: Journal of dairy science (2023) PMID: 36907761  Abstract: This analysis introduces a stochastic herd simulation model and evaluates the estimated reproductive and economic performance of combinations of reproductive management programs for both heifers and lactating cows. The model simulates the growth, reproductive performance, production, and culling for individual animals and integrates individual animal outcomes to represent herd dynamics daily. The model has an extensible structure, allowing for future modification and expansion, and has been integrated into the Ruminant Farm Systems model, a holistic dairy farm simulation model. The herd simulation model was used to compare outcomes of 10 reproductive management scenarios based on common practices on US \",\n  \"pmid\": \"36907761\",\n  \"title\": \"A stochastic animal life cycle simulation model for a whole dairy farm system model: Assessing the value of combined heifer and lactating dairy cow reproductive management programs.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1835", "label": "Defining and Diagnosing Infectious Bovine Keratoconjunctivitis.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Defining and Diagnosing Infectious Bovine Keratoconjunctivitis. Scholars: Kneipp Mac Journal: The Veterinary clinics of North America. Food animal practice (2021) PMID: 34049656  Abstract: Pinkeye and infectious bovine keratoconjunctivitis (IBK) are imprecise terms that describe diverse ocular diseases. Moraxella bovis is the major causative agent of IBK; however, disease epidemiology is not fully known. Not all cases referred to as pinkeye are of infectious origin, and not all IBK involve M bovis. This article suggests the term pinkeye should no longer be used, offers a case definition for IBK (a herd disease), and suggests describing ocular signs of IBK using existing clinical descriptors rather than resorting to novel scores. A new term \\\"ocular moraxellosis\\\" is defined as IBK from which Moraxella spp are demonstrated.\",\n  \"pmid\": \"34049656\",\n  \"title\": \"Defining and Diagnosing Infectious Bovine Keratoconjunctivitis.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1838", "label": "Going further post-RNA-seq: ", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Going further post-RNA-seq:  Scholars: Passe Pereira Hyago, Lima Verardo Lucas, Morena Del Cambre Amaral Weller Mayara Journal: The Journal of dairy research (2021) PMID: 34372953  Abstract: This study aimed to obtain a better understanding of the regulatory genes and molecules involved in the development of mastitis. For this purpose, the transcription factors (TF) and MicroRNAs (miRNA) related to differentially expressed genes previously found in extracorporeal udders infected with Streptococcus agalactiae were investigated. The Gene-TF network highlighted LOC515333, SAA3, CD14, NFKBIA, APOC2 and LOC100335608 and genes that encode the most representative transcription factors STAT3, PPARG, EGR1 and NFKB1 for infected udders. In addition, it was possible to highlight, through the analysis of the gene-miRNA network, genes that could be post-transcriptionally regulated by miRNAs, such as the relationship between the CCL5 gene and the miRNA bta-miR-363. Overall, our data demonstrated g\",\n  \"pmid\": \"34372953\",\n  \"title\": \"Going further post-RNA-seq: \"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1841", "label": "Feasibility of the use of deep learning classification of teat-end condition in Holstein cattle.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Feasibility of the use of deep learning classification of teat-end condition in Holstein cattle. Scholars: Porter I R, Wieland M, Basran P S Journal: Journal of dairy science (2021) PMID: 33589251  Abstract: Infections with pathogenic bacteria entering the mammary gland through the teat canal are the most common cause of mastitis in dairy cows; therefore, sustaining the integrity of the teat canal and its adjacent tissues is critical to resist infection. The ability to monitor teat tissue condition is a key prerequisite for udder health management in dairy cows. However, to date, routine assessment of teat condition is limited to cow-side visual inspection, making the evaluation a time-consuming and expensive process. Here, we demonstrate a digital teat-end condition assessment by way of deep learning. A total of 398 digital images from dairy cows' udders were collected on 2 commercial farms using a digital camera. The degree of teat-end hyperkeratosis was scored using a 4-point scal\",\n  \"pmid\": \"33589251\",\n  \"title\": \"Feasibility of the use of deep learning classification of teat-end condition in Holstein cattle.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1842", "label": "Opportunistic pathogens are prevalent across the culturable exogenous and endogenous microbiota of stable flies captured at a dairy facility.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Opportunistic pathogens are prevalent across the culturable exogenous and endogenous microbiota of stable flies captured at a dairy facility. Scholars: Sommer Andrew J, Deblois Courtney L, Tu Andrew D J Journal: Veterinary research (2025) PMID: 39934928  Abstract: Stable flies in the genus Stomoxys are highly abundant, blood-feeding pests on dairy farms; however, their role in the carriage and potential transmission of pathogens is largely understudied. Here, we report on the frequency and distribution of culturable bacteria collected from Stomoxys flies captured in free stall barns and nearby calf hutches over a three-month period on a focal research farm in Wisconsin, USA. Mastitis-associated bacterial taxa, including Staphylococcus, Escherichia, Enterobacter, and Klebsiella spp., were frequently isolated from pooled samples of the internal or external portions of the flies. Conversely, selective enrichment protocols from these samples yielded only a single isolate of Salmonella an\",\n  \"pmid\": \"39934928\",\n  \"title\": \"Opportunistic pathogens are prevalent across the culturable exogenous and endogenous microbiota of stable flies captured at a dairy facility.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1843", "label": "Analysis of differentially expressed microRNAs in bovine mammary epithelial cells treated with lipoteichoic acid.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Analysis of differentially expressed microRNAs in bovine mammary epithelial cells treated with lipoteichoic acid. Scholars: Shen Puxiu, Yu Jingcheng, Yan Chenbo Journal: Journal of animal physiology and animal nutrition (2023) PMID: 35997417  Abstract: Mastitis is one of the most common diseases of dairy cattle and can be caused by physical stress, chemicals and microbial infection. Staphylococcus aureus is the most common pathogens that induce mastitis in dairy cattle. In this study, bovine mammary epithelial cells (BMECs) were treated either with lipoteichoic acid (LTA, 30\\u2009\\u00b5g/ml) or 1\\u2009\\u00d7\\u2009phosphate-buffer saline (PBS, control) and RNA-Seq was applied to explore the effect of LTA on the expression microRNAs (miRNAs) in BMECs. Compared to the control group, 43 miRNAs were significantly up-regulated and eight miRNAs were significantly down-regulated. Additionally, 724 genes were significantly up-regulated and 13 genes were significantly down-regulated in LTA group relative to the contro\",\n  \"pmid\": \"35997417\",\n  \"title\": \"Analysis of differentially expressed microRNAs in bovine mammary epithelial cells treated with lipoteichoic acid.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1844", "label": "Vaccination protocols in Qu\u00e9bec dairy herds.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Vaccination protocols in Qu\\u00e9bec dairy herds. Scholars: Morin M P, Fecteau G, Roy J P Journal: Journal of dairy science (2024) PMID: 38825099  Abstract: Information is needed on vaccination protocols used by veterinarians and dairy producers to prevent and control infections in dairy herds. This observational study described farm's vaccination standard operating procedures (SOP) developed by veterinarians in collaboration with dairy producers in Qu\\u00e9bec. Data pertaining to vaccination protocols and dairy producer practices were collected as part of the biosecurity component of the National Mandatory Quality Assurance Certification Program (proAction). Generalized statistical mixed-effects models were used to assess associations between dairy herd characteristics and the vaccination SOP, encompassing various vaccination types. These included any vaccination, core vaccines only (bovine respiratory syncytial virus, infectious bovine rhinotracheitis herpesvirus, parainfluenza virus type 3,\",\n  \"pmid\": \"38825099\",\n  \"title\": \"Vaccination protocols in Qu\\u00e9bec dairy herds.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1846", "label": "Herd and animal factors affect the variability of total and differential somatic cell count in bovine milk.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Herd and animal factors affect the variability of total and differential somatic cell count in bovine milk. Scholars: Stocco Giorgia, Cipolat-Gotet Claudio, Stefanon Bruno Journal: Journal of animal science (2023) PMID: 36516415  Abstract: The aim of this study was to quantify some environmental (individual herds, herd productivity, milking system, and season) and animal factors [individual animals, breed, days in milk (DIM) and parity] on the variability of the log-10 transformation of somatic cell count (LSCC) and differential somatic cell count (DSCC) on individual bovine milk. A total of 159,360 test-day records related to milk production and composition were extracted from 12,849 Holstein-Friesian and 9,275 Simmental cows distributed across 223 herds. Herds were classified into high and low productivity, defined according to the average daily milk net energy output (DMEO) yielded by the cows. Data included daily milk yield (DYM; kg/d), milk fat, protein, lactose, SCC, and DSCC, \",\n  \"pmid\": \"36516415\",\n  \"title\": \"Herd and animal factors affect the variability of total and differential somatic cell count in bovine milk.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1847", "label": "In vitro susceptibility testing of phytochemicals from essential oils against Prototheca species.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 In vitro susceptibility testing of phytochemicals from essential oils against Prototheca species. Scholars: Nojo Honoka, Ishijima Sanae A, Morikawa Mako Journal: The Journal of veterinary medical science (2024) PMID: 38925982  Abstract: Phytochemicals isolated from essential oils are effective alternatives for inhibiting microbial pathogens. Bovine protothecal mastitis is the cause of a reduction in milk production and the secretion of thin, watery milk with white flakes. In the present study, we performed in vitro susceptibility testing of the phytochemicals carvacrol, citral, and thymol in Prototheca strains isolated from cases of protothecosis in small animals and cow feces. The susceptibility of the algae to carvacrol, citral, and thymol was assessed using the modified CLSI M27-A3 broth microdilution method. The ranges of the minimum inhibitory concentrations (MIC%) of the phytochemicals in all isolates were 0.03% to 0.125% for carvacrol, 0.03% to 0.25% for citral, and 0.06% to 0\",\n  \"pmid\": \"38925982\",\n  \"title\": \"In vitro susceptibility testing of phytochemicals from essential oils against Prototheca species.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1848", "label": "Determination of Free Amino Acid Concentrations in Bovine Plasma Using High-Pressure Liquid Chromatography With Electrospray Ionization Mass Spectrometry Detection.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Determination of Free Amino Acid Concentrations in Bovine Plasma Using High-Pressure Liquid Chromatography With Electrospray Ionization Mass Spectrometry Detection. Scholars: Reinhardt Laurie A, Svaren Levi, Marathe Ritvik Journal: Rapid communications in mass spectrometry : RCM (2025) PMID: 40104850  Abstract: Quantification of free amino acid concentrations in plasma has become an important tool in monitoring the health of dairy cows and health of their offspring under various management regimes, especially diet. Consequently, it was desirable to develop a robust, accurate, medium-throughput method to quantitate free amino acid concentrations in bovine plasma. Bovine plasma was deproteinated with methanol and amino acids partially purified using cation exchange resin. Samples were then subjected to precolumn derivatization with phenyl isothiocyanate, followed by high-pressure liquid chromatography with positive electrospray ionization single quadrupole mass spectrometry detection f\",\n  \"pmid\": \"40104850\",\n  \"title\": \"Determination of Free Amino Acid Concentrations in Bovine Plasma Using High-Pressure Liquid Chromatography With Electrospray Ionization Mass Spectrometry Detection.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2012", "label": "Can lameness prevalence in dairy herds be predicted from farmers' reports of their motivation to control lameness and barriers to doing so? An observational study from New Zealand.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Can lameness prevalence in dairy herds be predicted from farmers' reports of their motivation to control lameness and barriers to doing so? An observational study from New Zealand. Scholars: Mason W A, Laven L J, Huxley J N Journal: Journal of dairy science (2024) PMID: 37863289  Abstract: Understanding what motivates and prevents behavioral change in farmers is a critical step in disease control in dairy cattle. A total of 101 New Zealand dairy farmers across 8 regions were randomly enrolled into a cross-sectional study to investigate farmer barriers and motivators to lameness control for cows managed 100% at pasture and the relationship between these responses and the true lameness status on farm. Trained technicians lameness scored all lactating cows on the enrolled farms on 2 occasions during one lactation. Farm-level prevalence proportions were calculated as the mean of the 2 lameness scores. Enrolled farmers were asked their perception of lameness in the current milking season \",\n  \"pmid\": \"37863289\",\n  \"title\": \"Can lameness prevalence in dairy herds be predicted from farmers' reports of their motivation to control lameness and barriers to doing so? An observational study from New Zealand.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2013", "label": "Label-free quantitative proteomics analysis of bovine mammary glands induced with Escherichia coli.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Label-free quantitative proteomics analysis of bovine mammary glands induced with Escherichia coli. Scholars: Zhou Li, Luoreng Zhuoma, Wang Xingping Journal: American journal of veterinary research (2025) PMID: 40118022  Abstract: To establish a model of Escherichia coli-induced bovine mammary gland inflammation and investigate alterations in protein expression in bovine mammary glands under different health conditions. 6 Chinese Holstein cows were selected and randomly assigned to 2 groups. Bovine mammary glands were induced with either 105 CFU/mL E coli (n = 3) or 1 X PBS (n = 3), and label-free quantitative proteomics was applied to explore the effect of E coli on the expression of proteins in bovine mammary glands. Then, these data were combined with transcriptome sequencing data for integrative analysis. A total of 944 differentially expressed proteins (DEPs) were identified; 588 proteins were upregulated and 356 were downregulated in mastitis tissues compared to healthy tissues\",\n  \"pmid\": \"40118022\",\n  \"title\": \"Label-free quantitative proteomics analysis of bovine mammary glands induced with Escherichia coli.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2016", "label": "Equine genital leptospirosis: Evidence of an important silent chronic reproductive syndrome.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 Equine genital leptospirosis: Evidence of an important silent chronic reproductive syndrome. Scholars: Di Azevedo Maria Isabel Nogueira, Lilenbaum Walter Journal: Theriogenology (2022) PMID: 36063673  Abstract: Leptospirosis may be associated with important syndromes in equines, including reproductive ones. Recently, our group demonstrated a reproductive syndrome of leptospirosis in ruminants (Bovine Genital Leptospirosis - BGL), that presents its own agent, particular diagnostic methods, and specific treatment and prevention, requiring special attention. We realized that the genital syndrome of leptospirosis may not be exclusive to ruminants and may also affect horses. The aim of the present study is to gather the available data on leptospirosis in equine reproduction and propose a new genital leptospirosis syndrome in horses, which we have named Equine Genital Leptospirosis (EGL). The main agent is most probably serovar Bratislava (serogroup Australis), whose role has been increasi\",\n  \"pmid\": \"36063673\",\n  \"title\": \"Equine genital leptospirosis: Evidence of an important silent chronic reproductive syndrome.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2017", "label": "The association of prepartum urine pH, plasma total calcium concentration at calving and postpartum diseases in Holstein dairy cattle.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 The association of prepartum urine pH, plasma total calcium concentration at calving and postpartum diseases in Holstein dairy cattle. Scholars: Melendez P, Bartolome J, Roeschmann C Journal: Animal : an international journal of animal bioscience (2021) PMID: 33573952  Abstract: The use of anionic salts to prevent milk fever in dairy cattle has been an effective nutritional strategy; however, the degree of acidification that determines the most acceptable productive responses and well-being of the cow is still a controversial topic. The objective of this study was to assess urine pH in prepartum Holstein cows fed anionic diets and determine its association with plasma total Ca, Mg, P, \\u03b2-hydroxyl-butyrate (BHB) concentrations at parturition and the occurrence of peripartum disorders. This investigation consisted of 2 studies. Study 1 was conducted on a grazing dairy. Between February and May 2019, 60 prepartum multiparous cows were tested for urine pH and plasma metabolite concentrati\",\n  \"pmid\": \"33573952\",\n  \"title\": \"The association of prepartum urine pH, plasma total calcium concentration at calving and postpartum diseases in Holstein dairy cattle.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2018", "label": "Efficacy of baloxavir marboxil against bovine H5N1 virus in mice.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Efficacy of baloxavir marboxil against bovine H5N1 virus in mice. Scholars: Kiso Maki, Uraki Ryuta, Yamayoshi Seiya Journal: Nature communications (2025) PMID: 40541931  Abstract: Since the first detection of highly pathogenic avian influenza (HPAI) H5N1 (clade 2.3.4.4b) in U.S. dairy cattle in early 2024, the virus has spread rapidly, posing a major public health concern as the number of human cases continues to rise. Although human-to-human transmission has not been confirmed, experimental data suggest that the bovine H5N1 virus can transmit via respiratory droplets in ferrets, highlighting its pandemic potential. With no vaccines currently available, antiviral drugs remain the only treatment option. Here, we investigate the efficacy of the polymerase inhibitor baloxavir marboxil (BXM) against this virus in mice. We find that early treatment post-infection is effective, but delayed treatment significantly reduces BXM efficacy and increases the risk of BXM resistance, underscoring t\",\n  \"pmid\": \"40541931\",\n  \"title\": \"Efficacy of baloxavir marboxil against bovine H5N1 virus in mice.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2019", "label": "Rumen fluke infections (Paramphistomidae) in diarrhoeal cattle in western France and association with production parameters.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 Rumen fluke infections (Paramphistomidae) in diarrhoeal cattle in western France and association with production parameters. Scholars: Delafosse Arnaud Journal: Veterinary parasitology, regional studies and reports (2022) PMID: 35256121  Abstract: This study was conducted to assess the impact of rumen flukes (RFs) (Paramphistomatidae) on various production parameters of cattle in Normandy. Faecal and blood samples were taken between 1 January 2010 and 31 December 2019 as part of the routine diagnostic activity for diarrhoea in weaned cattle, including a quantitative parasitological analysis coupled with a search for Johne's disease (paratuberculosis). Information on slaughter and carcass weight, inter-farm movements and mortality was obtained from the French national registration database (BDNI). The study was conducted at two levels using adapted categorical RF variables: 1) at the cattle level (>12\\u00a0months), an estimation of presence of adult parasites using egg count in faecal samp\",\n  \"pmid\": \"35256121\",\n  \"title\": \"Rumen fluke infections (Paramphistomidae) in diarrhoeal cattle in western France and association with production parameters.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2022", "label": "Evaluation of fully oxidised \u03b2-carotene as a feed ingredient to reduce bacterial infection and somatic cell counts in pasture-fed cows with subclinical mastitis.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Evaluation of fully oxidised \\u03b2-carotene as a feed ingredient to reduce bacterial infection and somatic cell counts in pasture-fed cows with subclinical mastitis. Scholars: McDougall S Journal: New Zealand veterinary journal (2021) PMID: 33944703  Abstract: To assess the effect of oral supplementation with fully oxidised \\u03b2-carotene (OxBC) on bacteriological cure, the incidence of clinical mastitis, and somatic cell counts (SCC) in pasture-fed cows with subclinical intramammary infection. Cows from four dairy herds were enrolled in early lactation if they had quarter-level SCC >200,000 cells/mL and they had a recognised bacterial intramammary pathogen in one or more quarters. They were randomly assigned to be individually fed from Day 0, for a mean of 40 days, with 0.5 kg of a cereal-based supplementary feed that either contained 300 mg of OxBC (treatment; n = 129 quarters) or did not (control; n = 135 quarters). Quarter-milk samples were collected on Days 21 and 42 for microbiology an\",\n  \"pmid\": \"33944703\",\n  \"title\": \"Evaluation of fully oxidised \\u03b2-carotene as a feed ingredient to reduce bacterial infection and somatic cell counts in pasture-fed cows with subclinical mastitis.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2023", "label": "New Insights into the Significance of PARP-1 Activation: Flow Cytometric Detection of Poly(ADP-Ribose) as a Marker of Bovine Intramammary Infection.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 New Insights into the Significance of PARP-1 Activation: Flow Cytometric Detection of Poly(ADP-Ribose) as a Marker of Bovine Intramammary Infection. Scholars: De Matteis Giovanna, Grandoni Francesco, Zampieri Michele Journal: Cells (2021) PMID: 33803196  Abstract: Bovine intramammary infections are common diseases affecting dairy cattle worldwide and represent a major focus of veterinary research due to financial losses and food safety concerns. The identification of new biomarkers of intramammary infection, useful for monitoring the health of dairy cows and wellness verification, represents a key advancement having potential beneficial effects on public health. In vitro experiments using bovine peripheral blood mononuclear cells (PBMC), stimulated with the bacterial endotoxin lipopolysaccharide (LPS) enabled a flow cytometric assay in order to evaluate in vivo poly-ADP-ribose (PAR) levels. Results showed a significant increase of PAR after 1 h of treatment, which is consistent with \",\n  \"pmid\": \"33803196\",\n  \"title\": \"New Insights into the Significance of PARP-1 Activation: Flow Cytometric Detection of Poly(ADP-Ribose) as a Marker of Bovine Intramammary Infection.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2024", "label": "Establishment of a latex immunochromatography for detecting bovine early pregnancy-related glycoproteins.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Establishment of a latex immunochromatography for detecting bovine early pregnancy-related glycoproteins. Scholars: Gu Linlin, Wang Weiwei, Yang Mingjie Journal: Applied microbiology and biotechnology (2025) PMID: 40590965  Abstract: Early pregnancy diagnosis in dairy cows is an important part of the production processes. Accurate early pregnancy diagnosis can help veterinarians identify open cow as soon as possible and carry out the second breeding earlier, which is of great significance for improving reproductive efficiency of dairy cow. In this study, a rapid immunochromatography based on latex microspheres for detecting pregnancy-related glycoprotein (PAG) was established with two monoclonal antibodies. The samples collected from 28 days after breeding of 559 Holstein cows were used to diagnose pregnancy. The results showed that the minimum detection limit of the established latex immunochromatography for PAG was 0.2 ng/mL. Compared to ultrasound, the sensitivity, specificity, po\",\n  \"pmid\": \"40590965\",\n  \"title\": \"Establishment of a latex immunochromatography for detecting bovine early pregnancy-related glycoproteins.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2026", "label": "Single-step production of autologous bovine platelet concentrate for clinical applications in cattle.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Single-step production of autologous bovine platelet concentrate for clinical applications in cattle. Scholars: Constant C, Desrochers A, Gagnon C A Journal: Journal of dairy science (2023) PMID: 36424320  Abstract: Platelet concentrate (PC) is an alternative therapy to treat mastitis in dairy cattle and is an alternative treatment for reproduction problems such as endometritis. Unfortunately, double-centrifugation processing methods described are time-consuming, require specialized laboratory equipment, and are usually done in a heterologous way, which risks herd health. To overcome this limitation, we evaluated single-step bovine PC processing methods readily applicable to a farm setting using an autologous conditioned plasma (ACP) production system. We investigated the hematologic findings, cytokines, and growth factors of the obtained PC samples. Autologous conditioned plasma was prepared using whole blood (WB) from 4 cows (group 1) using single-step centrifugation and 16 differe\",\n  \"pmid\": \"36424320\",\n  \"title\": \"Single-step production of autologous bovine platelet concentrate for clinical applications in cattle.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2027", "label": "Salivary heat shock protein 70 as a potential non-invasive biomarker of environmental thermal stress in dairy cattle.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Salivary heat shock protein 70 as a potential non-invasive biomarker of environmental thermal stress in dairy cattle. Scholars: Rajamanickam Kandasamy, Visha Pasuvalingam, Elango Ayyasamy Journal: International journal of biometeorology (2025) PMID: 39556253  Abstract: The present study aims to explore the potential biomarker application of salivary heat shock 70\\u00a0kDa protein in detecting thermal stress in dairy animals noninvasively. The study spans for 45 days during the mid-summer season (April-May), involving twelve multiparous non-pregnant adult Jersey crossbred cows by randomly allocating them into groups (six animals in each group). The control animals were maintained in the shed, whereas the thermal stress group animals were exposed to environment heat between 10:00\\u00a0h to 16.00\\u00a0h and they were feed and watered ad libitum. During the experimental period, the hematobiochemical, physiological, behavioural, nutritional and production responses were recorded and the whole blood and \",\n  \"pmid\": \"39556253\",\n  \"title\": \"Salivary heat shock protein 70 as a potential non-invasive biomarker of environmental thermal stress in dairy cattle.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2028", "label": "Quantifying current and future raw milk losses due to bovine mastitis on European dairy farms under climate change scenarios.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 Quantifying current and future raw milk losses due to bovine mastitis on European dairy farms under climate change scenarios. Scholars: Guzm\\u00e1n-Luna Paola, Nag Rajat, Mart\\u00ednez Ismael Journal: The Science of the total environment (2022) PMID: 35421482  Abstract: Bovine mastitis is an infectious disease that causes udder inflammation and is responsible for raw milk losses across European dairy farms. It is associated with reduced cow milk yield and contributes to elevated Somatic Cell Count (SCC) in raw milk. Staphylococcus aureus is one of the most prevalent mastitis pathogens that cause subclinical and clinical mastitis and can be present as a coloniser bacterium in cows. Climate change and geographical variability may influence the prevalence of this pathogen. Thus, this research aimed to predict the raw milk losses in three major dairy-producing regions across Europe (i.e. Mediterranean, Atlantic and Continental) under climate change scenarios. An exposure assessment model and a ste\",\n  \"pmid\": \"35421482\",\n  \"title\": \"Quantifying current and future raw milk losses due to bovine mastitis on European dairy farms under climate change scenarios.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2030", "label": "Health concerns about possible long-term effects of legally marketed milk and dairy from animals with intramammary infections.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Health concerns about possible long-term effects of legally marketed milk and dairy from animals with intramammary infections. Scholars: Schadt Iris Journal: Frontiers in public health (2023) PMID: 37701910  Abstract: Milk and dairy from animals with subclinical mastitis infections are marketable. Mastitis is detected with the somatic cell count (SCC). The EU regulation, among the stricter ones, limits an average of 400,000 somatic cells/ml in milk. Other countries have higher or no thresholds. This level suggests 40% of infected animals, and we indeed consume mastitic milk and dairy. A worldwide prevalence of dairy cattle and buffaloes with subclinical mastitis is estimated to range between 34 and 46%. The current food safety regulations account for mastitis pathogens, their toxins, and the risk of antimicrobial residues, but milk from animals with mastitis contains also compounds that derive from an immune response and inflammation process with biological function for the offspring\",\n  \"pmid\": \"37701910\",\n  \"title\": \"Health concerns about possible long-term effects of legally marketed milk and dairy from animals with intramammary infections.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2031", "label": "Behavioral patterns as indicators of resilience after parturition in dairy cows.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Behavioral patterns as indicators of resilience after parturition in dairy cows. Scholars: van Dixhoorn I D E, de Mol R M, Schnabel S K Journal: Journal of dairy science (2023) PMID: 37500445  Abstract: During the transition phase, dairy cows are susceptible to develop postpartum diseases. Cows that stay healthy or recover rapidly can be considered to be more resilient in comparison to those that develop postpartum diseases. An indication of loss of resilience will allow for early intervention with preventive and supportive measures before the onset of disease. We investigated which quantitative behavioral characteristics during the dry period could be used as indicators of reduced resilience after calving, using noninvasive Smart Tag neck and Smart Tag leg sensors in dairy cows (Nedap N.V.). We followed 180 cows during 2 wk before until 6 wk after parturition at 4 farms in the Netherlands. Serving as proxy for loss of resilience, as defined by the duration and severity of disease, a\",\n  \"pmid\": \"37500445\",\n  \"title\": \"Behavioral patterns as indicators of resilience after parturition in dairy cows.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2033", "label": "Prevalence and risk factors of coliform-associated mastitis and antibiotic resistance of coliforms from lactating dairy cows in North West Cameroon.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 Prevalence and risk factors of coliform-associated mastitis and antibiotic resistance of coliforms from lactating dairy cows in North West Cameroon. Scholars: Abegewi Ursula Anneh, Esemu Seraphine Nkie, Ndip Roland N Journal: PloS one (2022) PMID: 35881624  Abstract: Coliform bacteria are major causative agents of bovine mastitis, a disease that has devastating effect on dairy animal health and milk production. This cross-sectional study, carried out in the North West region of Cameroon, sought to determine the prevalence of bovine mastitis, coliforms associated with bovine mastitis, risk factors for infection and the antibiotic resistance pattern of coliform bacterial isolates. A total of 1608 udder quarters were sampled from 411 cows using a questionnaire, clinical examination, California Mastitis Test and milk culture. Primary isolation of coliform bacteria was done on MacConkey agar while identification of coliforms employed Gram-staining and biochemical testing. Each coliform ba\",\n  \"pmid\": \"35881624\",\n  \"title\": \"Prevalence and risk factors of coliform-associated mastitis and antibiotic resistance of coliforms from lactating dairy cows in North West Cameroon.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2034", "label": "Stable flies are bona fide carriers of mastitis-associated bacteria.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Stable flies are bona fide carriers of mastitis-associated bacteria. Scholars: Sommer Andrew J, Kettner Julia E, Coon Kerri L Journal: mSphere (2024) PMID: 38920390  Abstract: Hematophagous  Disease prevention on dairy farms has significant implications for cattle health, food security, and zoonosis. Of particular importance is the control of bovine mastitis, which can be caused by diverse bacteria, including \",\n  \"pmid\": \"38920390\",\n  \"title\": \"Stable flies are bona fide carriers of mastitis-associated bacteria.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2036", "label": "Bovine herpesviral meningoencephalitis: large case study and literature review.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Bovine herpesviral meningoencephalitis: large case study and literature review. Scholars: Santos Beth\\u00e2nia S, Lemos Ricardo A A, Rech Raquel R Journal: Journal of veterinary diagnostic investigation : official publication of the American Association of Veterinary Laboratory Diagnosticians, Inc (2025) PMID: 39966689  Abstract: Bovine herpesviral meningoencephalitis (BHM) is an infectious disease of cattle caused by bovine alphaherpesvirus 1 (BoAHV1; \",\n  \"pmid\": \"39966689\",\n  \"title\": \"Bovine herpesviral meningoencephalitis: large case study and literature review.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2037", "label": "Enterococcus species identified by MALDI-TOF MS in milk from dairy cow mastitis cases and herd surveys.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Enterococcus species identified by MALDI-TOF MS in milk from dairy cow mastitis cases and herd surveys. Scholars: Ulloa Fernando, Penati Martina, Monistero Valentina Journal: Veterinary research communications (2025) PMID: 40699410  Abstract: Enterococcus species are increasingly recognized as mastitis pathogens in dairy cows. Reliable species information is required for correctly defining the regional epidemiology of enterococcal mastitis, establishing its relationships with management variables, and understanding its impact on udder health. We investigated the species distribution of enterococci in bovine milk from subclinical mastitis (SCM) and clinical mastitis (CM) cases and full herd surveys (HS) using MALDI-TOF MS as identification method. A total of 21,864 milk samples from 106 dairy herds were routinely collected and analyzed according to the National Mastitis Council (NMC) guidelines over one year. Enterococcus spp. were found in 4.86% of CM, 5.05% of SCM, and 1.37% of HS m\",\n  \"pmid\": \"40699410\",\n  \"title\": \"Enterococcus species identified by MALDI-TOF MS in milk from dairy cow mastitis cases and herd surveys.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2038", "label": "Hyperketonemia: A Marker of Disease, a Sign of a High-Producing Dairy Cow, or Both?", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Hyperketonemia: A Marker of Disease, a Sign of a High-Producing Dairy Cow, or Both? Scholars: Mann Sabine, McArt Jessica A A Journal: The Veterinary clinics of North America. Food animal practice (2023) PMID: 37032298  Abstract: This review covers the history and nomenclature of ketosis, the source and use of ketones in transition cows, and the controversial role of hyperketonemia's association with health and production outcomes in dairy cows. With the goal of assisting veterinarians with on-farm diagnostic and treatment methods, the authors present current and evolving means of direct and indirect hyperketonemia detection as well as a summary of treatment modalities and their efficacy. They encourage veterinarians to include hyperketonemia testing as part of their routine physical examinations and contemplate day in milk at hyperketonemia diagnosis when designing treatment and management strategies.\",\n  \"pmid\": \"37032298\",\n  \"title\": \"Hyperketonemia: A Marker of Disease, a Sign of a High-Producing Dairy Cow, or Both?\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2039", "label": "Discrepancies among healthy, subclinical mastitic, and clinical mastitic cows in fecal microbiome and metabolome and serum metabolome.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 Discrepancies among healthy, subclinical mastitic, and clinical mastitic cows in fecal microbiome and metabolome and serum metabolome. Scholars: Wang Yue, Nan Xuemei, Zhao Yiguang Journal: Journal of dairy science (2022) PMID: 35931488  Abstract: Mastitis is generally considered a local inflammatory disease caused by the invasion of exogenous pathogens and resulting in the dysbiosis of microbiota and metabolites in milk. However, the entero-mammary pathway theory may establish a possible link between some endogenous gut bacteria and the occurrence and development of mastitis. In the current study, we attempted to investigate differences in the gut microbiota profile and metabolite composition in gut and serum from healthy cows and those with subclinical mastitis and clinical mastitis. Compared with those of healthy cows, the microbial community diversities in the feces of cows with subclinical mastitis (SM) and clinical mastitis (CM) were lower. Lower abundance of Bifidobacterium, Ro\",\n  \"pmid\": \"35931488\",\n  \"title\": \"Discrepancies among healthy, subclinical mastitic, and clinical mastitic cows in fecal microbiome and metabolome and serum metabolome.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2040", "label": "Seroprevalence, molecular characterization, biotyping, and associated risk factors of bovine viral diarrhea in dairy cattle in Bangladesh.", "title": "{\n  \"year\": 2026,\n  \"abstract\": \"\\ud83d\\udcc4 Seroprevalence, molecular characterization, biotyping, and associated risk factors of bovine viral diarrhea in dairy cattle in Bangladesh. Scholars: Rana Eaftekhar Ahmed, Islam Md Saiful, Hossain Belayet Journal: Research in veterinary science (2026) PMID: 41558100  Abstract: Bovine viral diarrhea virus (BVDV) is globally endemic, with the ability to establish persistent infection (PI) being central to its complex epidemiology. Currently the genetic variability of BVDV in Bangladesh remains poorly understood. This study involved a survey in commercial dairy herds in the south-eastern part of Bangladesh in 2024/2025. A total of 373 blood samples were collected from cattle in 24 dairy herds. Serum and buffy coat samples were analyzed using antibody-ELISA and RT-qPCR targeting the 5'-UTR region, followed by sequencing. The MDBK cell line was used for virus isolation and biotyping. Herd and animal-level seroprevalences were 83.3% and 15.3%, respectively, while the corresponding viremic r\",\n  \"pmid\": \"41558100\",\n  \"title\": \"Seroprevalence, molecular characterization, biotyping, and associated risk factors of bovine viral diarrhea in dairy cattle in Bangladesh.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2042", "label": "Evaluating the Reliability and Accuracy of Senior Veterinary Students in Detecting and Scoring Lameness in Dairy Cows.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Evaluating the Reliability and Accuracy of Senior Veterinary Students in Detecting and Scoring Lameness in Dairy Cows. Scholars: Ozturan Yalcin Alper, Akin Ibrahim Journal: Veterinary medicine and science (2025) PMID: 40678867  Abstract: Lameness detection is essential for effective dairy cattle management, with accurate diagnosis improving animal welfare and reducing economic losses. Senior veterinary students must acquire these skills before graduation to ensure competent diagnosis in the field. This study aimed to evaluate the reliability and accuracy of senior veterinary students in detecting and scoring lameness in dairy cows. The study included 201 senior veterinary students who scored lameness in cows using video recordings and a 5-point scoring system. Students' lameness scores were compared to those assigned by an experienced observer using a confusion matrix, with sensitivity, specificity, and accuracy calculated. Intra-rater reliability was assessed using intraclass correl\",\n  \"pmid\": \"40678867\",\n  \"title\": \"Evaluating the Reliability and Accuracy of Senior Veterinary Students in Detecting and Scoring Lameness in Dairy Cows.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2044", "label": "[Pathogenicity and transmissibility of cow-derived H5N1 highly pathogenic avian influenza viruses].", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 [Pathogenicity and transmissibility of cow-derived H5N1 highly pathogenic avian influenza viruses]. Scholars: Maemura Tadashi, Kawaoka Yoshihiro Journal: Uirusu (2024) PMID: 40024794  Abstract: The H5N1 highly pathogenic avian influenza virus (HPAIV) of clade 2.3.4.4b emerged in Europe during 2020-2021 and rapidly spread worldwide via migratory birds, causing outbreaks in poultry, wild birds, and wildlife. Sporadic cases of human infection, likely resulting from close contact with infected animals, have been reported. In March 2024, clinical signs (e.g., reduced feed intake, altered milk quality, and decreased milk production) were observed in dairy cattle on a farm in Texas, USA, where H5N1 HPAIV was subsequently isolated. By December 2024, infections had been reported in dairy cattle across 15 states in the USA. Cases of infection have also been documented in cats near affected farms and in humans suspected of exposure through contact with infected cattle or chickens that acquired \",\n  \"pmid\": \"40024794\",\n  \"title\": \"[Pathogenicity and transmissibility of cow-derived H5N1 highly pathogenic avian influenza viruses].\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2046", "label": "Host DNA depletion methods and genome-centric metagenomics of bovine hindmilk microbiome.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Host DNA depletion methods and genome-centric metagenomics of bovine hindmilk microbiome. Scholars: Duarte Vin\\u00edcius da Silva, Porcellato Davide Journal: mSphere (2024) PMID: 38054728  Abstract: Bovine mastitis is a multi-etiological and complex disease, resulting in serious economic consequences for dairy farmers and industry. In recent years, the microbiological evaluation of raw milk has been investigated in-depth using next-generation sequencing approaches such as metataxonomic analysis. Despite this, host DNA is a major concern in the shotgun metagenomic sequencing of microbial communities in milk samples, and it represents a big challenge. In this study, we aimed to evaluate different methods for host DNA depletion and/or microbial DNA enrichment and assess the use of PCR-based whole genome amplification in milk samples with high somatic cell count (SCC) by using short- and long-read sequencing technologies. Our results evidenced that DNA extraction performed differently in term\",\n  \"pmid\": \"38054728\",\n  \"title\": \"Host DNA depletion methods and genome-centric metagenomics of bovine hindmilk microbiome.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2047", "label": "Serological profile of respiratory viruses in unvaccinated steers upon their arrival at Brazilian feedlot facilities.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Serological profile of respiratory viruses in unvaccinated steers upon their arrival at Brazilian feedlot facilities. Scholars: Chicoski Larissa Melo, Fritzen Juliana Torres Tomazi, Lorenzetti Elis Journal: Brazilian journal of microbiology : [publication of the Brazilian Society for Microbiology] (2023) PMID: 37700145  Abstract: Bovine viral diarrhea virus (BVDV), bovine alphaherpesvirus 1 (BoAHV1), bovine respiratory syncytial virus (BRSV), and bovine parainfluenza virus 3 (BPIV-3) are involved in bovine respiratory disease. These viruses can infect the respiratory system and cause considerable economic losses to beef and dairy cattle herds. This study aimed to determine the serological profiles of steers for BVDV, BoAHV1, BRSV, and BPIV-3 upon their arrival at Brazilian feedlot facilities. A total of 1,282 serum samples from unvaccinated steers were obtained on the first day of feeding. Samples were collected from 31 beef cattle herds reared in an extensive rearing system in six B\",\n  \"pmid\": \"37700145\",\n  \"title\": \"Serological profile of respiratory viruses in unvaccinated steers upon their arrival at Brazilian feedlot facilities.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2048", "label": "Comprehensive at-arrival transcriptomic analysis of post-weaned beef cattle uncovers type I interferon and antiviral mechanisms associated with bovine respiratory disease mortality.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Comprehensive at-arrival transcriptomic analysis of post-weaned beef cattle uncovers type I interferon and antiviral mechanisms associated with bovine respiratory disease mortality. Scholars: Scott Matthew A, Woolums Amelia R, Swiderski Cyprianna E Journal: PloS one (2021) PMID: 33901263  Abstract: Despite decades of extensive research, bovine respiratory disease (BRD) remains the most devastating disease in beef cattle production. Establishing a clinical diagnosis often relies upon visual detection of non-specific signs, leading to low diagnostic accuracy. Thus, post-weaned beef cattle are often metaphylactically administered antimicrobials at facility arrival, which poses concerns regarding antimicrobial stewardship and resistance. Additionally, there is a lack of high-quality research that addresses the gene-by-environment interactions that underlie why some cattle that develop BRD die while others survive. Therefore, it is necessary to decipher the underlying host genomic factors\",\n  \"pmid\": \"33901263\",\n  \"title\": \"Comprehensive at-arrival transcriptomic analysis of post-weaned beef cattle uncovers type I interferon and antiviral mechanisms associated with bovine respiratory disease mortality.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2053", "label": "Intergenerational cycle of disease: Maternal mastitis is associated with poorer daughter performance in dairy cattle.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Intergenerational cycle of disease: Maternal mastitis is associated with poorer daughter performance in dairy cattle. Scholars: Swartz T H, Bradford B J, Clay J S Journal: Journal of dairy science (2021) PMID: 33612233  Abstract: Adverse prenatal environments, such as maternal stress and infections, can influence the health and performance of offspring. Mastitis is the most common disease in dairy cattle, yet the intergenerational effects have not been specifically investigated. Therefore, we examined the associations between the dam's mammary gland health and daughter performance using somatic cell score (SCS) as a proxy for mammary health. Using data obtained from Dairy Records Management Systems (Raleigh, NC), we linked daughter records with their dam's records for the lactation in which the daughter was conceived. Linear and quadratic relationships of dam mean SCS with the daughter's age at first calving (AFC; n = 15,992 daughters, 4,366 herds), first- (n = 15,119 daughters, 4,21\",\n  \"pmid\": \"33612233\",\n  \"title\": \"Intergenerational cycle of disease: Maternal mastitis is associated with poorer daughter performance in dairy cattle.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2055", "label": "Genetic diversity of Mycoplasma bovis isolated from bovine respiratory disease and bovine mastitis in Chile.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Genetic diversity of Mycoplasma bovis isolated from bovine respiratory disease and bovine mastitis in Chile. Scholars: Goddard Mat\\u00edas, Mart\\u00edn Joscelyn San, Molina-Mora Jose Arturo Journal: Veterinary microbiology (2025) PMID: 41092514  Abstract: Mycoplasma bovis, a major bacterial pathogen for cattle, is responsible for diseases such as pneumonia, mastitis, otitis, and arthritis, leading to substantial economic losses and animal welfare concerns. Despite its wide global distribution, there is limited information in South America. M. bovis has been reported as a mastitis agent in Chile, but its genetic diversity is poorly understood. Therefore, this study aimed to determine the genetic diversity of M. bovis isolates from Chilean dairy cattle (from bovine respiratory disease and mastitis cases) in the last two decades and evaluate their genetic relatedness with strains isolated in different countries using a whole genome sequencing approach. The M. bovis population in Chile was found t\",\n  \"pmid\": \"41092514\",\n  \"title\": \"Genetic diversity of Mycoplasma bovis isolated from bovine respiratory disease and bovine mastitis in Chile.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2056", "label": "Antimicrobial resistance and virulence characteristics in 3 collections of staphylococci from bovine milk samples.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Antimicrobial resistance and virulence characteristics in 3 collections of staphylococci from bovine milk samples. Scholars: Fergestad M E, De Visscher A, L'Abee-Lund T Journal: Journal of dairy science (2021) PMID: 33934873  Abstract: Mastitis is a prevalent disease in dairy cattle, and staphylococci are among the most common causative pathogens. Staphylococci can express resistance to a range of antimicrobials, of which methicillin resistance is of particular public health concern. Additionally, Staphylococcus aureus carries a variety of virulence factors, although less is understood about the virulence of non-aureus staphylococci (NAS). The aim of our study was to identify and characterize 3 collections of staphylococcal isolates from bovine milk samples regarding antimicrobial resistance, with emphasis on methicillin resistance, and their carriage of virulence genes typically displayed by Staph. aureus. A total of 272 staphylococcal isolates collected in Norway and Belgium in 201\",\n  \"pmid\": \"33934873\",\n  \"title\": \"Antimicrobial resistance and virulence characteristics in 3 collections of staphylococci from bovine milk samples.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2057", "label": "The spread and antimicrobial resistance of Staphylococcus aureus in South African dairy herds - A review.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 The spread and antimicrobial resistance of Staphylococcus aureus in South African dairy herds - A review. Scholars: Karzis Joanne, Petzer Inge-Marie, Naidoo Vinny Journal: The Onderstepoort journal of veterinary research (2021) PMID: 34797108  Abstract: Staphylococcus aureus is internationally recognised as a principal agent of mastitis and the foremost reason for economic loss in the dairy industry. The limited data available on organism-specific antibiotic resistance surveillance in dairy cattle have stimulated the need for such a review article. The objective of this study was to review relevant literature on antimicrobial resistance of mastitis-causing staphylococci isolated from dairy cows in South Africa compared to other countries. Factors relating to the incidence of mastitis and treatment strategies in terms of the One Health concept and food security were included. The Web of Science (all databases) and relevant websites were used, and articles not written in English were e\",\n  \"pmid\": \"34797108\",\n  \"title\": \"The spread and antimicrobial resistance of Staphylococcus aureus in South African dairy herds - A review.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2058", "label": "Allogenic umbilical cord blood-mesenchymal stem cells are more effective than antibiotics in alleviating subclinical mastitis in dairy cows.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 Allogenic umbilical cord blood-mesenchymal stem cells are more effective than antibiotics in alleviating subclinical mastitis in dairy cows. Scholars: Ghai Shubham, Saini Sikander, Ansari Shama Journal: Theriogenology (2022) PMID: 35569413  Abstract: Subclinical mastitis is an inflammatory disease that affects the milk production, fertility, and lifespan of animals, leading to significant losses to dairy industry. Antibiotics therapies are resulting in suboptimal benefits in treating subclinical mastitis due to prevalent antibiotic resistance in dairy herds. In a quest to develop alternative therapy, umbilical cord-derived mesenchymal stem cells (UCB-MSCs) and its extracellular vesicles (UCB-MSC-EVs) are used, in the present study, to validate its safety and efficacy as potential therapy for treatment of subclinical mastitis in dairy cows with respect to conventional antibiotic therapy (ABT). We isolated, in\\u00a0vitro cultured, and characterized the UCB-MSCs as well as UCB-MSC-EVs. The r\",\n  \"pmid\": \"35569413\",\n  \"title\": \"Allogenic umbilical cord blood-mesenchymal stem cells are more effective than antibiotics in alleviating subclinical mastitis in dairy cows.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2059", "label": "NMR-based metabolomics of plasma from dairy calves infected with two primary causal agents of bovine respiratory disease (BRD).", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 NMR-based metabolomics of plasma from dairy calves infected with two primary causal agents of bovine respiratory disease (BRD). Scholars: Santos-Rivera Mariana, Fitzkee Nicholas C, Hill Rebecca A Journal: Scientific reports (2023) PMID: 36792613  Abstract: Each year, bovine respiratory disease (BRD) results in significant economic loss in the cattle sector, and novel metabolic profiling for early diagnosis represents a promising tool for developing effective measures for disease management. Here, \",\n  \"pmid\": \"36792613\",\n  \"title\": \"NMR-based metabolomics of plasma from dairy calves infected with two primary causal agents of bovine respiratory disease (BRD).\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2060", "label": "Induced uterine infection alters bovine endometrial function and embryonic competence.", "title": "{\n  \"year\": 2026,\n  \"abstract\": \"\\ud83d\\udcc4 Induced uterine infection alters bovine endometrial function and embryonic competence. Scholars: Seekford Zachary K, Tariq Arslan, Haimon McKenzie L J Journal: Reproduction (Cambridge, England) (2026) PMID: 41575562  Abstract: Uterine diseases in dairy cattle are associated with reduced fertility, but the specific mechanisms of disease-mediated subfertility are not known. We hypothesized that intrauterine infusion of Escherichia coli and Trueperella pyogenes would alter the endometrial transcriptome and compromise oocyte developmental competence after disease resolution. Non-lactating Holstein cows received an intrauterine infusion of either sterile phosphate-buffered saline (n\\u2009=\\u200929) or pathogenic E. coli and T. pyogenes (n\\u2009=\\u200932) on day 3 of the estrous cycle to induce acute endometrial inflammation. Oocytes of antral follicles were collected by ovum pick-up following estrous synchronization 23 days after intrauterine infusion and underwent in vitro embryo production. Endometrial sam\",\n  \"pmid\": \"41575562\",\n  \"title\": \"Induced uterine infection alters bovine endometrial function and embryonic competence.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2061", "label": "Bronchopneumonia with interstitial pneumonia in beef feedlot cattle: Characterization and laboratory investigation.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Bronchopneumonia with interstitial pneumonia in beef feedlot cattle: Characterization and laboratory investigation. Scholars: Haydock Luke A J, Fenton R Kent, Sergejewich Lauren Journal: Veterinary pathology (2023) PMID: 36625178  Abstract: Bronchopneumonia with interstitial pneumonia (BIP) has been considered a variant of acute interstitial pneumonia (AIP) rather than a distinct disease. This study compared 18 BIP, 24 bronchopneumonia (BP), and 13 AIP cases in feedlot beef cattle. Grossly, BIP cases typically had cranioventral lung lesions of similar morphology and extent as BP cases, but the caudodorsal lung appeared overinflated, bulged on section, and had interlobular edema and emphysema. Gross diagnosis of BIP had 83% sensitivity and 73% specificity relative to histopathology. Histologic lesions of BIP in cranioventral areas were of chronic BP, while caudodorsal lesions included alveolar and bronchiolar damage and inflammation, interstitial hypercellularity, and multifocal hemor\",\n  \"pmid\": \"36625178\",\n  \"title\": \"Bronchopneumonia with interstitial pneumonia in beef feedlot cattle: Characterization and laboratory investigation.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2062", "label": "Randomized controlled trial comparison of analgesic drugs for control of pain associated with induced lameness in lactating dairy cattle.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Randomized controlled trial comparison of analgesic drugs for control of pain associated with induced lameness in lactating dairy cattle. Scholars: Warner R, Kleinhenz M D, Ydstie J A Journal: Journal of dairy science (2021) PMID: 33309349  Abstract: Both the economic loss and welfare implications of lameness affect the dairy industry. Currently no analgesic drugs are approved to alleviate lameness-associated pain in lactating dairy cattle in the United States. In this randomized controlled trial, 48 lactating Holsteins were enrolled to evaluate the effect of oral meloxicam and i.v. flunixin meglumine on induced lameness. Cows were allocated to 1 of 4 treatment groups (n = 12 per group): lameness and flunixin meglumine (LAME + FLU); lameness and meloxicam (LAME + MEL); lameness and placebo (LAME + PLBO); or sham induction and placebo (SHAM + PLBO). Six hours before treatment, arthritis-synovitis was induced in the distal interphalangeal joint with 20 mg of amphotericin B, whereas SHA\",\n  \"pmid\": \"33309349\",\n  \"title\": \"Randomized controlled trial comparison of analgesic drugs for control of pain associated with induced lameness in lactating dairy cattle.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2068", "label": "Phytoestrogens Modulate Bovine G Protein-Coupled Receptors and Play a Critical Role in Regulating Reproductive Functions in Animals.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Phytoestrogens Modulate Bovine G Protein-Coupled Receptors and Play a Critical Role in Regulating Reproductive Functions in Animals. Scholars: Safdar Muhammad, Junejo Yasmeen, Tariq Muhammad Journal: Reproduction in domestic animals = Zuchthygiene (2025) PMID: 40116542  Abstract: Phytoestrogens are secondary plant metabolites that are structurally analogous to endogenous oestrogens and bind to Bovine G Protein-Coupled Receptors (GPCRs) in animals. Their interaction with GPCRs activates intracellular signalling cascades, such as the cAMP/PKA pathway, which plays a crucial role in ovarian follicle development and luteinisation. These interactions may enhance reproductive performance by improving fertility, synchronising estrous cycles, and promoting ovulation. Phytoestrogens also influence the regularity and timing of the estrous cycle, offering potential applications in estrous synchronisation and reproductive management. In this study, molecular docking was conducted on 12,000 phytoc\",\n  \"pmid\": \"40116542\",\n  \"title\": \"Phytoestrogens Modulate Bovine G Protein-Coupled Receptors and Play a Critical Role in Regulating Reproductive Functions in Animals.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2069", "label": "DNA methylation profiles in bovine sperm are associated with daughter fertility.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 DNA methylation profiles in bovine sperm are associated with daughter fertility. Scholars: Zhang Ying, Plessis Cl\\u00e9ment, Prunier Julien Journal: Epigenetics (2023) PMID: 38016027  Abstract: The current decline in dairy cattle fertility has resulted in significant financial losses for dairy farmers. In the past, most efforts to improve dairy cattle fertility have been focused on either management or genetics, while epigenetics have received less attention. In this study, 12 bulls were selected from a provided 100 bull list and studied (High daughter fertility\\u2009=\\u20096, Low daughter fertility\\u2009=\\u20096) for Enzymatic methylation sequencing in the Illumina HiSeq platform according to the Canadian daughter fertility index (DFI), sires with high and low daughter fertility have average DFI of 92 and 112.6, respectively. And the bull list provided shows a mean DFI of 103.4. 252 CpGs with methylation differences greater than 20% (q\\u2009<\\u20090.01) were identified, as well as the top 10 promising DMRs with a 15%\",\n  \"pmid\": \"38016027\",\n  \"title\": \"DNA methylation profiles in bovine sperm are associated with daughter fertility.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2070", "label": "[Estimation of standardized doses of intramammary formulations for use in cattle available in Argentina].", "title": "{\n  \"year\": 2026,\n  \"abstract\": \"\\ud83d\\udcc4 [Estimation of standardized doses of intramammary formulations for use in cattle available in Argentina]. Scholars: Pe\\u00f1a Agostina, Camussone Cecilia, Tello Facundo Journal: Revista Argentina de microbiologia (2026) PMID: 41253613  Abstract: Standardized doses such as defined daily doses (DDDvet) and defined course doses (DCDvet) are essential to quantify the antimicrobials (AMs) used in veterinary medicine as a prior step for determining strategies for their responsible use. Therefore, the aim of this study was to create a list of the available intramammary formulations for mastitis and drying off in Argentina, and to estimate their DDDvet and DCDvet. DDDvet and DCDvet were determined for 29 mastitis cases and 27 drying formulations. Critically important AM formulations of the highest priority for human health (ceftiofur or cefquinome) were identified. In addition, there were combined formulations with up to four different AMs, including critically important AMs. The results of this \",\n  \"pmid\": \"41253613\",\n  \"title\": \"[Estimation of standardized doses of intramammary formulations for use in cattle available in Argentina].\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2072", "label": "AI-based prediction and detection of early-onset of digital dermatitis in dairy cows using infrared thermography.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 AI-based prediction and detection of early-onset of digital dermatitis in dairy cows using infrared thermography. Scholars: Feighelstein Marcelo, Mishael Amir, Malka Tamir Journal: Scientific reports (2024) PMID: 39617800  Abstract: Digital dermatitis (DD) is a common foot disease that can cause lameness, decreased milk production and fertility decline in cows. The prediction and early detection of DD can positively impact animal welfare and profitability of the dairy industry. This study applies deep learning-based computer vision techniques for early onset detection and prediction of DD using infrared thermography (IRT) data. We investigated the role of various inputs for these tasks, including thermal images of cow feet, statistical color features extracted from IRT images, and manually registered temperature values. Our models achieved performances of above 81% accuracy on DD detection on 'day 0' (first appearance of clinical signs), and above 70% accuracy prediction of DD two da\",\n  \"pmid\": \"39617800\",\n  \"title\": \"AI-based prediction and detection of early-onset of digital dermatitis in dairy cows using infrared thermography.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2074", "label": "Inbreeding depression for producer-recorded udder, metabolic, and reproductive diseases in US dairy cattle.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Inbreeding depression for producer-recorded udder, metabolic, and reproductive diseases in US dairy cattle. Scholars: Lozada-Soto Emmanuel A, Parker Gaddis Kristen L, Tiezzi Francesco Journal: Journal of dairy science (2024) PMID: 38056567  Abstract: This study leveraged a growing dataset of producer-recorded phenotypes for mastitis, reproductive diseases (metritis and retained placenta), and metabolic diseases (ketosis, milk fever, and displaced abomasum) to investigate the potential presence of inbreeding depression for these disease traits. Phenotypic, pedigree, and genomic information were obtained for 354,043 and 68,292 US Holstein and Jersey cows, respectively. Total inbreeding coefficients were calculated using both pedigree and genomic information; the latter included inbreeding estimates obtained using a genomic relationship matrix and runs of homozygosity. We also generated inbreeding coefficients based on the generational inbreeding for recent and old pedigree inbreeding, \",\n  \"pmid\": \"38056567\",\n  \"title\": \"Inbreeding depression for producer-recorded udder, metabolic, and reproductive diseases in US dairy cattle.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2075", "label": "An investigation of blood, milk, and urine test patterns for the diagnosis of ketosis in dairy cows in early lactation.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 An investigation of blood, milk, and urine test patterns for the diagnosis of ketosis in dairy cows in early lactation. Scholars: Serrenho R Couto, Williamson M, Berke O Journal: Journal of dairy science (2022) PMID: 35931489  Abstract: Ketosis in dairy cattle is primarily diagnosed based on the concentrations of ketone bodies in the blood, milk, or urine. Cow-side tests using these fluids are available for rapid detection of elevated concentrations of ketone bodies. Although these tests have been extensively validated, the performance of different tests has not been compared over time. Our objectives were to investigate the relationship between point-of-care diagnostic tests measuring the concentrations of \\u03b2-hydroxybutyrate (BHB) in blood (BT; Precision Xtra, Abbott Laboratories), BHB in milk (MT; Keto-Test, Elanco), and acetoacetate (AcAc) in urine (UT; Ketostix, Bayer Corporation) through cases of ketosis. Holstein cows (n = 148) were screened daily for hyperketonemia (HYK; blood \",\n  \"pmid\": \"35931489\",\n  \"title\": \"An investigation of blood, milk, and urine test patterns for the diagnosis of ketosis in dairy cows in early lactation.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2077", "label": "Survival of bovine digital dermatitis treponemes in conditions relevant to the host and farm environment.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Survival of bovine digital dermatitis treponemes in conditions relevant to the host and farm environment. Scholars: Bell Jennifer, Crosby-Durrani Hayley E, Blowey Roger W Journal: Anaerobe (2023) PMID: 37479021  Abstract: Bovine digital dermatitis (BDD), a painful infectious foot disease in dairy cattle, endemic in many countries worldwide, causes substantial economic and welfare impacts. Treponema spp. are considered key to BDD pathogenesis. To aid infection reservoir identification and control measure development, survival of BDD treponemes was investigated in different temperatures (4, 12, 20, 37, 45 and 60\\u00a0\\u00b0C), pH values (5-9.0), dairy cattle faeces and bedding types: straw shavings, sand, sand containing 5% lime (w/w) and recycled manure solids (RMS). A turbidity microplate methodology was adapted to measure pH impact on growth. Survival of BDD treponemes for the different conditions were assessed by sub-cultures of microcosms over different time points. BDD treponemes remained \",\n  \"pmid\": \"37479021\",\n  \"title\": \"Survival of bovine digital dermatitis treponemes in conditions relevant to the host and farm environment.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2078", "label": "Seroprevalence and risk factors of infectious bovine rhinotracheitis in cattle in Gharbia governorate, Egypt: A comparative study of traditional and commercial production systems.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Seroprevalence and risk factors of infectious bovine
