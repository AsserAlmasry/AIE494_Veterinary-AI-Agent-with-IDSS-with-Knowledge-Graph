rhinotracheitis in cattle in Gharbia governorate, Egypt: A comparative study of traditional and commercial production systems. Scholars: El-Sheikh Mostafa El-Sayed, Bakar Lotfy, El-Mekawy Mamdouh Fahmy Journal: Open veterinary journal (2024) PMID: 39737047  Abstract: Infectious bovine rhinotracheitis (IBR) is a global contagious respiratory disease of ruminants caused by Bovine Herpes virus-1 (BoHV-1). It causes substantial financial losses in the dairy industry worldwide and is considered one of the most important causative agents of abortion and reproductive problems in dairy cattle. This study aimed to estimate the seroprevalence of IBR and the related risk factors in the dairy population in Gharbia governorate, Egypt. A cross-sectional study was conducted to investigate the seroprevalence and associated risk factors of IBR in bovine dairy herds in Qutur district, Gharbia governorate, Egypt from March 2023 to February 2024. A to\",\n  \"pmid\": \"39737047\",\n  \"title\": \"Seroprevalence and risk factors of infectious bovine rhinotracheitis in cattle in Gharbia governorate, Egypt: A comparative study of traditional and commercial production systems.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2079", "label": "Profiling bacterial communities in feedlot cattle affected with bovine foot rot and bovine digital dermatitis lesions using 16S rRNA gene sequencing and quantitative real-time PCR.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Profiling bacterial communities in feedlot cattle affected with bovine foot rot and bovine digital dermatitis lesions using 16S rRNA gene sequencing and quantitative real-time PCR. Scholars: Pyakurel Susan, Caddey Benjamin Jordan, Dias Angelica Petersen Journal: BMC microbiology (2025) PMID: 40114065  Abstract: The primary infectious foot diseases in cattle, bovine foot rot (BFR) and bovine digital dermatitis (BDD), commonly associated with Fusobacterium necrophorum and Treponema spp., respectively, are considered polybacterial in etiology with several additional bacteria involved such as Porphyromonas levii, Bacteroides pyogenes, and Fusobacterium mortiferum. BDD is further classified into several M-stages (M2: active and ulcerative; M4: chronic proliferative). Using quantitative real-time PCR and 16S rRNA gene (V3-V4 region) sequencing, we quantified several specific bacteria and analyzed bacterial communities present in biopsies of visually diagnosed cases of BFR (n\\u2009=\\u200932), M2 (n\\u2009=\",\n  \"pmid\": \"40114065\",\n  \"title\": \"Profiling bacterial communities in feedlot cattle affected with bovine foot rot and bovine digital dermatitis lesions using 16S rRNA gene sequencing and quantitative real-time PCR.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2081", "label": "Minimizing the number of origins in batches of weaned calves to reduce their risks of developing bovine respiratory diseases.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Minimizing the number of origins in batches of weaned calves to reduce their risks of developing bovine respiratory diseases. Scholars: Morel-Journel Thibaut, Assi\\u00e9 S\\u00e9bastien, Vergu Elisabeta Journal: Veterinary research (2021) PMID: 33413651  Abstract: Bovine respiratory diseases (BRD) are a major concern for the beef cattle industry, as beef calves overwhelmingly develop BRD symptoms during the first weeks after their arrival at fattening units. These cases occur after weaned calves from various cow-calf producers are grouped into batches to be sold to fatteners. Cross-contaminations between calves from different origins (potentially carrying different pathogens), together with increased stress because of the process of batch creation, can increase their risks of developing BRD symptoms. This study investigated whether reducing the number of different origins per batch is a strategy to reduce the risk of BRD cases. We developed an algorithm aimed at creating batches with as few ori\",\n  \"pmid\": \"33413651\",\n  \"title\": \"Minimizing the number of origins in batches of weaned calves to reduce their risks of developing bovine respiratory diseases.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2082", "label": "Cross-sectional study: can endogenous procalcitonin differentiate between healthy and bovine respiratory disease-affected preweaned dairy calves?", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Cross-sectional study: can endogenous procalcitonin differentiate between healthy and bovine respiratory disease-affected preweaned dairy calves? Scholars: Sala Giulia, Boccardo Antonio, Ferrulli Vincenzo Journal: The veterinary quarterly (2024) PMID: 39609260  Abstract: Bovine respiratory disease (BRD) represents a significant challenge in cattle management due to its multifactorial nature and lack of a gold standard diagnostic method. Procalcitonin (PCT) has emerged as a potential biomarker for bacterial infections in various species, including cattle. This study aimed to investigate plasma PCT concentration variations in pre-weaned dairy calves categorized as BRD-positive using clinical scores (WRSC; BRD-positive \\u22655), thoracic ultrasonography with two cut-off (TUS; BRD-positive \\u22651 or \\u22653), or a combination of both methods (WRSC/TUS1cm or WRSC/TUS3cm). Additionally, the accuracy of PCT in diagnosing BRD was evaluated. A cross-sectional study was conducted on a convenience sample of \",\n  \"pmid\": \"39609260\",\n  \"title\": \"Cross-sectional study: can endogenous procalcitonin differentiate between healthy and bovine respiratory disease-affected preweaned dairy calves?\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2084", "label": "Association between non-esterified fatty acids and calcium concentrations at calving with early lactation clinical diseases, fertility and culling in grazing dairy cows in Uruguay.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Association between non-esterified fatty acids and calcium concentrations at calving with early lactation clinical diseases, fertility and culling in grazing dairy cows in Uruguay. Scholars: Cruz Irene, Barca Joaqu\\u00edn, Pereira Isabel Journal: Preventive veterinary medicine (2024) PMID: 39089164  Abstract: This study describes the association of non-esterified fatty acids (NEFA) and calcium concentrations at calving with early lactation disease, reproductive performance and culling in 646 dairy cows from 13 commercial grazing dairy herds in Uruguay. During one year, health events were recorded from calving to 30 days in milk (DIM). The first author visited each farm every 20 days. During each visit, body condition score (BCS) was recorded (scale 1-5), defining BCS < 3 as suboptimal and BCS > 3 as optimal, and a blood sample was taken from cows between 0 and 4 DIM for metabolite determination. To evaluate the association between health events (i.e., retained placenta-metritis and clinic\",\n  \"pmid\": \"39089164\",\n  \"title\": \"Association between non-esterified fatty acids and calcium concentrations at calving with early lactation clinical diseases, fertility and culling in grazing dairy cows in Uruguay.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2085", "label": "Meta-analysis of six dairy cattle breeds reveals biologically relevant candidate genes for mastitis resistance.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Meta-analysis of six dairy cattle breeds reveals biologically relevant candidate genes for mastitis resistance. Scholars: Cai Zexi, Iso-Touru Terhi, Sanchez Marie-Pierre Journal: Genetics, selection, evolution : GSE (2024) PMID: 39009986  Abstract: Mastitis is a disease that incurs significant costs in the dairy industry. A promising approach to mitigate its negative effects is to genetically improve the resistance of dairy cattle to mastitis. A meta-analysis of genome-wide association studies (GWAS) across multiple breeds for clinical mastitis (CM) and its indicator trait, somatic cell score (SCS), is a powerful method to identify functional genetic variants that impact mastitis resistance. We conducted meta-analyses of eight and fourteen GWAS on CM and SCS, respectively, using 30,689 and 119,438 animals from six dairy cattle breeds. Methods for the meta-analyses were selected to properly account for the multi-breed structure of the GWAS data. Our study revealed 58 lead markers that\",\n  \"pmid\": \"39009986\",\n  \"title\": \"Meta-analysis of six dairy cattle breeds reveals biologically relevant candidate genes for mastitis resistance.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2087", "label": "An economic evaluation of sensor-assisted health monitoring in dairy farming using the example of a rumen bolus.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 An economic evaluation of sensor-assisted health monitoring in dairy farming using the example of a rumen bolus. Scholars: Pfrombeck J, Gandorfer M, Zeiler E Journal: Journal of dairy science (2025) PMID: 39647619  Abstract: The study investigates the economics of sensor-assisted dairy health management and indicates a certain economic potential in the use of a commercial rumen bolus capable of tracking activity and core body temperature. The economic evaluation was performed applying a stochastic model with the net return (NR) of investment of the sensor system as the target variable. The calculated NR considers the gross margin (GM) for both sensor-assisted and visual health monitoring, time savings through sensor-assisted monitoring, additional time spent addressing false positive messages from the sensor system, labor costs, and all costs associated with the investment in the sensor system. The analysis relies on a dataset acquired from a dairy research and demonstration farm on \",\n  \"pmid\": \"39647619\",\n  \"title\": \"An economic evaluation of sensor-assisted health monitoring in dairy farming using the example of a rumen bolus.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2088", "label": "High-Risk Cattle Management and Stocker Calf Health: Modulation of the Bovine Respiratory Microbiome from a Systems Perspective.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 High-Risk Cattle Management and Stocker Calf Health: Modulation of the Bovine Respiratory Microbiome from a Systems Perspective. Scholars: Credille Brent Journal: The Veterinary clinics of North America. Food animal practice (2022) PMID: 35691626  Abstract: Bovine respiratory disease (BRD) affects animals in all segments of the North American beef industry. The segmented nature of the beef industry results in the marketing of cattle that are considered to be at high risk of developing BRD. The microbiota is the complex microbial ecosystem that exists in and on the body of all animals. The respiratory tract has its unique microbiota that is shaped by many factors. Stress reduction, appropriate nutritional management, strategic use of vaccines, and antimicrobial administration targeted to the highest risk individuals have the potential to stabilize an inherently unstable microbial population and enhance calf health.\",\n  \"pmid\": \"35691626\",\n  \"title\": \"High-Risk Cattle Management and Stocker Calf Health: Modulation of the Bovine Respiratory Microbiome from a Systems Perspective.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2090", "label": "Prevalence of digital dermatitis using mirror scoring in Finnish freestall dairy herds.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Prevalence of digital dermatitis using mirror scoring in Finnish freestall dairy herds. Scholars: Pirkkalainen Hertta, Riihim\\u00e4ki Aino, Simojoki Heli Journal: Journal of dairy science (2021) PMID: 34024607  Abstract: Digital dermatitis (DD) is a severe bacterial hoof disease found worldwide. The disease can be classified into 5 different stages, denoted as M1 to M4 and M4.1, by clinical examination. The main objective of this study was to estimate prevalence of DD lesions in Finnish freestall dairy cattle population through hind feet inspection of standing cows with a mirror. Another aim was to estimate the sensitivity and specificity of mirror scoring on standing cows in a pen or in a milking parlor without washing the feet. Three veterinarians visited 81 randomly selected herds across the country. During the herd visits, hind feet of standing cows (n = 7,010) were scored with a mirror without washing the feet, either when the cows were standing in a pen (n = 4,992) or in the milking\",\n  \"pmid\": \"34024607\",\n  \"title\": \"Prevalence of digital dermatitis using mirror scoring in Finnish freestall dairy herds.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2092", "label": "Randomized, noninferiority trial evaluating the efficacy of a novel teat sealant in pasture grazed dairy cows.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Randomized, noninferiority trial evaluating the efficacy of a novel teat sealant in pasture grazed dairy cows. Scholars: Mehrtens P, Cuttance E L, Mason W A Journal: Journal of dairy science (2023) PMID: 37641267  Abstract: The intramammary infusion at the end of lactation of a bismuth subnitrate internal teat sealant (ITS), with no antibiotic component has been shown to be an effective means of reducing new intramammary infections over the dry period. There has, however, been very few comparative studies between different brands of ITS under grazed pasture conditions. The objectives of this study were, therefore, to determine if a new bismuth subnitrate internal teal sealant (ShutOut, MSD Animal Health) was noninferior to Teatseal (Zoetis) regarding end-points such as (a) detection of the ITS product after calving, (b) clinical mastitis during the dry period and early lactation, and (c) subclinical mastitis at 30 to 60 d in milk. A total of 1,105 mixed-age cattle were enrolled acros\",\n  \"pmid\": \"37641267\",\n  \"title\": \"Randomized, noninferiority trial evaluating the efficacy of a novel teat sealant in pasture grazed dairy cows.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2093", "label": "Detection of bovine gammaherpesvirus 6 in tissues of aborted fetuses from dairy cows concomitantly infected by Histophilus somni.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 Detection of bovine gammaherpesvirus 6 in tissues of aborted fetuses from dairy cows concomitantly infected by Histophilus somni. Scholars: Headley Selwyn Arlington, Fritzen Juliana Torres Tomazi, Bon Vin\\u00edcius Rodrigues Journal: Microbial pathogenesis (2022) PMID: 35688413  Abstract: Bovine gammaherpesvirus 6 (BoGHV6), formerly known as bovine lymphotropic virus, is a member of the Macavirus genus, subfamily Gammaherpesvirinae, family Herpesviridae, that was initially associated with proliferative diseases in cattle. While the Macavirus genus contains agents, including alcelaphine gammaherpesvirus 1 (AlGHV1), ovine gammaherpesvirus 2 (OvGHV2), and caprine gammaherpesvirus-2 (CpGHV2), known to cause malignant catarrhal fever (MCF), and are collectively referred to as MCF virus (MCFV) group of organisms, diseases and/or clinical syndromes have not been associated with BoGHV6 and porcine lymphotropic herpesvirus (PLHV). This report investigated the occurrence of BoGHV6 in tissues of abo\",\n  \"pmid\": \"35688413\",\n  \"title\": \"Detection of bovine gammaherpesvirus 6 in tissues of aborted fetuses from dairy cows concomitantly infected by Histophilus somni.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2095", "label": "[Report of a field control experience of bovine viral diarrhea virus in 2 dairy farms of Argentina applying management, diagnostic, and vaccination tools].", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 [Report of a field control experience of bovine viral diarrhea virus in 2 dairy farms of Argentina applying management, diagnostic, and vaccination tools]. Scholars: Pereyra Rodrigo, Martino Fernando, Castillo Mari\\u00e1ngeles Journal: Revista Argentina de microbiologia (2025) PMID: 39875308  Abstract: Bovine viral diarrhea virus (BVDV) causes significant economic losses in the international livestock industry and in Argentina, where it circulates at high prevalence. Under high prevalence conditions, BVDV infections are controlled through vaccination once persistently infected animals are identified and segregated. This study evaluated the feasibility of controlling BVDV circulation under field conditions by combining diagnosis, management measures, and vaccination in 2 dairy farms in the province of Santa Fe. Commercial ELISAs were used for the detection of the NS3 (P80) protein or antibodies against this protein as well as an RT-nested PCR for the detection of the viral genome, and vira\",\n  \"pmid\": \"39875308\",\n  \"title\": \"[Report of a field control experience of bovine viral diarrhea virus in 2 dairy farms of Argentina applying management, diagnostic, and vaccination tools].\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2096", "label": "Polymerase mutations underlie early adaptation of H5N1 influenza virus to dairy cattle and other mammals.", "title": "{\n  \"year\": 2026,\n  \"abstract\": \"\\ud83d\\udcc4 Polymerase mutations underlie early adaptation of H5N1 influenza virus to dairy cattle and other mammals. Scholars: Dholakia Vidhi, Quantrill Jessica L, Richardson Samuel A S Journal: Nature communications (2026) PMID: 41545362  Abstract: In 2024, an unprecedented outbreak of H5N1 high pathogenicity avian influenza was detected in dairy cattle in the USA resulting in spillbacks into poultry, wild birds and other mammals including humans. Here, we present molecular and virological evidence that the cattle B3.13 genotype H5N1 viruses rapidly accumulated adaptations in polymerase genes that enabled better replication in bovine cells and tissues, as well as cells of other mammals including humans. We find evidence of several mammalian adaptations in cattle including PB2 M631L, which is found in all cattle sequences, and PA K497R, which is found in the majority. Structurally, PB2 M631L maps to the polymerase-ANP32 interface, an essential host factor for viral genome replication. We show t\",\n  \"pmid\": \"41545362\",\n  \"title\": \"Polymerase mutations underlie early adaptation of H5N1 influenza virus to dairy cattle and other mammals.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2101", "label": "Enhancing bovine abortion surveillance: A learning experience.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Enhancing bovine abortion surveillance: A learning experience. Scholars: Van Loo H, Bogado Pascottini O, Ribbens S Journal: Journal of dairy science (2024) PMID: 37806630  Abstract: Abortions and perinatal mortalities (APM) substantially affect cattle industry efficiency. Various infectious and noninfectious factors have been associated with bovine APM worldwide. Infections are often considered pivotal due to their abortifacient potential, leading laboratories to primarily investigate relevant infectious agents for APM cases. Some infectious causes, such as Brucella abortus, have also a zoonotic impact, necessitating monitoring for both animal and human health. However, underreporting of bovine APM is a global issue, affecting early detection of infectious and zoonotic causes. Previous studies identified factors influencing case submission, but regional characteristics may affect results. In Belgium, farmers are obliged to report cases of APM within the context of a national brucello\",\n  \"pmid\": \"37806630\",\n  \"title\": \"Enhancing bovine abortion surveillance: A learning experience.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2103", "label": "Technological mapping of plant-based patents for treating bovine mastitis.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Technological mapping of plant-based patents for treating bovine mastitis. Scholars: Vidal Camila Silva, de Carvalho Gustavo Henrique Santos, de Assis Maria Cristina Journal: Tropical animal health and production (2025) PMID: 40067429  Abstract: Bovine mastitis costs the world's economy an estimated USD 19.7-32 billion annually. Plant-based products have been used as alternative treatments with advantages such as minimal side effects, and no studies have reported the formation of resistant microorganisms. To identify these plant-based products, this study performed a technological mapping of patent applications. We applied the terms 'Mastitis AND Extract' and 'Bovine OR Plant OR Livestock OR Cow' to the Espacenet database to find relevant patents. Following this, we applied the same terms to the International Patent Classification (IPC) to categorize patents according to their technological area of use. We found that private companies were the main applicants, among which Chinese com\",\n  \"pmid\": \"40067429\",\n  \"title\": \"Technological mapping of plant-based patents for treating bovine mastitis.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2104", "label": "Antimicrobial efficacy of ", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Antimicrobial efficacy of  Scholars: Mohammed Abeer Laily, Alqatrani Wameedh Hashim Abbas, Jaber Nawres Norri Journal: Open veterinary journal (2023) PMID: 38027398  Abstract: This research's goal was to evaluate the antibacterial properties of an extract from  Two hundred ten cow milk samples from different areas of Basrah province had been suffering subclinical mastitis reported by using the California mastitis test (CMT).  Out of 210 samples, 99 (47.1%) were positive for the CMT, and the identification rate of \",\n  \"pmid\": \"38027398\",\n  \"title\": \"Antimicrobial efficacy of \"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2107", "label": "Serum metabolic profiling in pregnant Holstein cows 3 weeks prior to parturition using two-dimensional gas chromatography time-of-flight mass spectrometry.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Serum metabolic profiling in pregnant Holstein cows 3 weeks prior to parturition using two-dimensional gas chromatography time-of-flight mass spectrometry. Scholars: Ichizawa Shota, Uenoyama Reiko, Kawashima Chiho Journal: The Journal of veterinary medical science (2024) PMID: 38644199  Abstract: This preliminary study explored potential serum biomarkers for predicting the onset of milk fever (MF), a bovine parturient disease with hypocalcemia. We conducted two-dimensional gas chromatography mass spectrometry-based metabolomics in 8 and 17 pregnant Holstein cows that did and did not develop MF 3 weeks later, respectively. In principal component analysis (PCA) applied to a dataset containing 1,498 metabolites, serum metabolites exhibited highly similar chemical profiles between cows with and without MF. PCA with a limited dataset of metabolites containing fatty acids, which had significantly different values between the groups and/or correlation coefficients of >0.5 for the serum calc\",\n  \"pmid\": \"38644199\",\n  \"title\": \"Serum metabolic profiling in pregnant Holstein cows 3 weeks prior to parturition using two-dimensional gas chromatography time-of-flight mass spectrometry.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2108", "label": "Genomic characterization and evolutionary analysis of three bovine viral diarrhea virus 1b strains from Taiwan, highlighting genomic evidence of cytopathic evolution.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Genomic characterization and evolutionary analysis of three bovine viral diarrhea virus 1b strains from Taiwan, highlighting genomic evidence of cytopathic evolution. Scholars: Tzeng Hau-You, Chiou Yi-Ying, Lin Fong-Yuan Journal: BMC veterinary research (2025) PMID: 41272668  Abstract: Bovine viral diarrhea virus type 1 (BVDV-1) affects cattle health and productivity worldwide. A nationwide surveillance of BVDV-1 showed persistent circulation in Taiwan in past decade. It exists in two biotypes-noncytopathic (ncp) and cytopathic (cp), which differ in clinical presentation and pathogenic mechanisms. Despite its prevalence in Taiwan, the genomic features that distinguish these biotypes remain poorly characterized. We recently identified two Taiwanese BVDV-1 in clinical samples, namely BV27 and BV236, from a beef cattle without clinical symptom and a dying dairy cow, respectively, in 2023. Whole genome sequencing using the Illumina NovaSeq X Plus platform revealed genome lengths of 12,20\",\n  \"pmid\": \"41272668\",\n  \"title\": \"Genomic characterization and evolutionary analysis of three bovine viral diarrhea virus 1b strains from Taiwan, highlighting genomic evidence of cytopathic evolution.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2264", "label": "Effect of selective dry cow treatment on udder health and antimicrobial usage on Dutch dairy farms.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 Effect of selective dry cow treatment on udder health and antimicrobial usage on Dutch dairy farms. Scholars: Tijs S H W, Holstege M M C, Scherpenzeel C G M Journal: Journal of dairy science (2022) PMID: 35379456  Abstract: Since 2013, selective dry cow treatment (SDCT) has been the standard approach in the Netherlands where farmers select cows for the use of antimicrobials at drying-off. Shortly after its introduction, antimicrobial usage decreased significantly, and no significant association was found between the level of SDCT and clinical mastitis (CM). Obviously, at that time long-term associations could not be evaluated. This study aimed to provide insight into the methods and level of implementation of SDCT on Dutch dairy farms with a conventional milking system (CMS) or an automatic milking system (AMS) in 2016 and 2017, several years after the implementation of SDCT. Udder health and antimicrobial use were also assessed. For this study, 262 farmers recorded dry cow treatment\",\n  \"pmid\": \"35379456\",\n  \"title\": \"Effect of selective dry cow treatment on udder health and antimicrobial usage on Dutch dairy farms.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2265", "label": "Gene association analysis of an osteopontin polymorphism and ketosis resistance in dairy cattle.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Gene association analysis of an osteopontin polymorphism and ketosis resistance in dairy cattle. Scholars: Bauer Edyta A, Ku\\u0142aj Dominika, Sawicki Sebastian Journal: Scientific reports (2023) PMID: 38057392  Abstract: The aim of this study was to identify the c.495C\\u2009>\\u2009T polymorphism within exon 1 of the osteopontin gene (OPN), and to analyze its association with susceptibility to ketosis in Polish Holstein-Friesian (HF) cows. The study utilized blood samples from 977 HF cows, for the determination of \\u03b2-hydroxybutyric acid (BHB) and for DNA isolation. The c.495C\\u2009>\\u2009T polymorphism of the bovine osteopontin gene was determined by PCR-RFLP. The CT genotype (0.50) was deemed the most common, while TT (0.08) was the rarest genotype. Cows with ketosis most often had the CC genotype, while cows with the TT genotype had the lowest incidence of ketosis. To confirm the relationship between the genotype and ketosis in cows, a weight of evidence (WoE) was generated. A very strong effect of the TT g\",\n  \"pmid\": \"38057392\",\n  \"title\": \"Gene association analysis of an osteopontin polymorphism and ketosis resistance in dairy cattle.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2266", "label": "H5N1 clade 2.3.4.4b avian influenza viruses replicate in differentiated bovine airway epithelial cells cultured at air-liquid interface.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 H5N1 clade 2.3.4.4b avian influenza viruses replicate in differentiated bovine airway epithelial cells cultured at air-liquid interface. Scholars: Bordes Luca, Gerhards Nora M, Peters Stan Journal: The Journal of general virology (2024) PMID: 38922678  Abstract: Highly pathogenic avian influenza (HPAI) H5N1 viruses are responsible for disease outbreaks in wild birds and poultry, resulting in devastating losses to the poultry sector. Since 2020, an increasing number of outbreaks of HPAI H5N1 was seen in wild birds. Infections in mammals have become more common, in most cases in carnivores after direct contact with infected birds. Although ruminants were previously not considered a host species for HPAI viruses, in March 2024 multiple outbreaks of HPAI H5N1 were detected in goats and cattle in the United States. Here, we have used primary bronchus-derived well-differentiated bovine airway epithelial cells (WD-AECs) cultured at air-liquid interface to assess the susceptibility and permi\",\n  \"pmid\": \"38922678\",\n  \"title\": \"H5N1 clade 2.3.4.4b avian influenza viruses replicate in differentiated bovine airway epithelial cells cultured at air-liquid interface.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2267", "label": "Variation in partial direct costs of treating clinical mastitis among 37 Wisconsin dairy farms.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Variation in partial direct costs of treating clinical mastitis among 37 Wisconsin dairy farms. Scholars: Leite de Campos J, Gon\\u00e7alves J L, Kates A Journal: Journal of dairy science (2023) PMID: 37641286  Abstract: The objective of this observational study was to describe variations in partial direct costs of clinical mastitis (CM) treatments among 37 dairy herds using data obtained from herd management records. Animal health and drug purchase records were retrospectively collected from 37 Wisconsin dairy herds for a period of 1 yr. Each farm was visited to verify case definitions, recording accuracy, and detection criteria of CM cases. Descriptive statistics were used to summarize cost of drugs and milk discard. Differences in costs among protocols, intramammary (IMM) products, parities, days in milk, and recurrence were analyzed using ANOVA. Of 20,625 cases of CM, 31% did not receive antimicrobial treatment. The average cost of drugs and milk discard (including cases that were not \",\n  \"pmid\": \"37641286\",\n  \"title\": \"Variation in partial direct costs of treating clinical mastitis among 37 Wisconsin dairy farms.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2271", "label": "Practical challenges and potential approaches to predicting low-incidence diseases on farm using individual cow data: A clinical mastitis example.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 Practical challenges and potential approaches to predicting low-incidence diseases on farm using individual cow data: A clinical mastitis example. Scholars: Liebe D M, Steele N M, Petersson-Wolfe C S Journal: Journal of dairy science (2022) PMID: 35086707  Abstract: Clinical mastitis (CM) incidence is considerable in terms of cows affected per year, but cases are much less common in terms of detections per cow per milking. From a modeling perspective, where predictions are made every time any cow is milked, low CM incidence per cow day makes training, evaluating, and applying CM prediction models a challenge. The objective of this study was to build models for predicting CM incidence using time-series sensor data and choose models that maximize net return based on a cost matrix. Data collected from 2 university dairy farms, the University of Florida and Virginia Polytechnic Institute and State University, were used to gather representative data, including 110,156 milkings and 333 CM \",\n  \"pmid\": \"35086707\",\n  \"title\": \"Practical challenges and potential approaches to predicting low-incidence diseases on farm using individual cow data: A clinical mastitis example.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2272", "label": "To meet or not to meet welfare outcome thresholds: a case-control study in dairy cow herds.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 To meet or not to meet welfare outcome thresholds: a case-control study in dairy cow herds. Scholars: Schenkenfelder J, Winckler C Journal: Animal : an international journal of animal bioscience (2022) PMID: 35183010  Abstract: Recently published thresholds allow classifying dairy cattle herds according to target, caution and alert ranges for welfare outcomes. Such normative thresholds provide one way to transparently assess production practices and are a straightforward communication tool with farmers. In an ordinal response case-control study, we investigated associations of animal, management and resource-related indicators with the risk of exceeding thresholds of prevalence for lameness, claw disorders, integument alterations and leg cleanliness. To this end, we used cumulative logistic regression models on 264 tethered and 392 loose-housed Austrian dairy herds. In tethered herds, the risk indicator average lactation milk yield was positively associated with the probability to ex\",\n  \"pmid\": \"35183010\",\n  \"title\": \"To meet or not to meet welfare outcome thresholds: a case-control study in dairy cow herds.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2273", "label": "Stigmasterol from Prunella vulgaris L. Alleviates LPS-induced mammary gland injury by inhibiting inflammation and ferroptosis.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Stigmasterol from Prunella vulgaris L. Alleviates LPS-induced mammary gland injury by inhibiting inflammation and ferroptosis. Scholars: Sun Mingyang, Xu Dianwen, Liu Dianfeng Journal: Phytomedicine : international journal of phytotherapy and phytopharmacology (2025) PMID: 39809030  Abstract: Dairy mastitis, a prevalent condition affecting dairy cattle, represents a significant challenge to both animal welfare and the quality of dairy products. However, current treatment options remain limited. Stigmasterol (ST) is a bioactive component of Prunella vulgaris L. (PV) with various pharmacological functions such as anti-inflammatory and anti-oxidation. At present, the specific effects and underlying mechanisms of PV and ST on dairy mastitis are still not fully understood. The aim of this research was to evaluate the pharmacological effects of PV and its active component ST on lipopolysaccharide (LPS) -stimulated bovine mammary epithelial cells (BMECs) and a mouse mastitis model, and to e\",\n  \"pmid\": \"39809030\",\n  \"title\": \"Stigmasterol from Prunella vulgaris L. Alleviates LPS-induced mammary gland injury by inhibiting inflammation and ferroptosis.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2274", "label": "MicroRNA miR-223 modulates NLRP3 and Keap1, mitigating lipopolysaccharide-induced inflammation and oxidative stress in bovine mammary epithelial cells and murine mammary glands.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 MicroRNA miR-223 modulates NLRP3 and Keap1, mitigating lipopolysaccharide-induced inflammation and oxidative stress in bovine mammary epithelial cells and murine mammary glands. Scholars: Zhou Man, Barkema Herman W, Gao Jian Journal: Veterinary research (2023) PMID: 37710276  Abstract: Bovine mastitis, the most prevalent and costly disease in dairy cows worldwide, decreases milk quality and quantity, and increases cow culling. However, involvement of microRNAs (miRNAs) in mastitis is not well characterized. The objective was to determine the role of microRNA-223 (miR-223) in regulation of the nucleotide-binding oligomerization domain-like receptor containing pyrin domain 3 (NLRP3) inflammasome and kelch like ECH-associated protein 1 (Keap1)/nuclear factor erythroid 2-related factor 2 (Nrf2) oxidative stress pathway in mastitis models induced by lipopolysaccharide (LPS) treatment of immortalized bovine mammary epithelial cells (bMECs) and murine mammary glands. In bMECs cultured in vi\",\n  \"pmid\": \"37710276\",\n  \"title\": \"MicroRNA miR-223 modulates NLRP3 and Keap1, mitigating lipopolysaccharide-induced inflammation and oxidative stress in bovine mammary epithelial cells and murine mammary glands.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2276", "label": "Isolation and Identification of Type F Bovine Enterovirus from Clinical Cattle with Diarrhoea.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Isolation and Identification of Type F Bovine Enterovirus from Clinical Cattle with Diarrhoea. Scholars: Ji Chengyuan, Zhang Yao, Sun Ruini Journal: Viruses (2021) PMID: 34835023  Abstract: Recently, bovine enterovirus (BEV) has caused several respiratory and gastrointestinal diseases outbreaks in cattle. Monitoring the epidemiological and pathogenic characteristics of this virus is crucial to controlling its spread. We isolated a BEV strain with typical cytopathic effects from the faeces of cows with significant diarrhoeal symptoms in China and observed the viral particles within 20-30 nm through transmission electron microscopy. Then, we designated this strain as HB19-1 in this study. The multistep growth curves showed that the virus propagated well in the MDBK cells. Molecular genetic analysis of VP1 indicated that HB19-1 belonged to the BEV-F1 group. Although the challenged ICR mice did not exhibit typical disease symptoms in animal infection assay, we observed significant pathol\",\n  \"pmid\": \"34835023\",\n  \"title\": \"Isolation and Identification of Type F Bovine Enterovirus from Clinical Cattle with Diarrhoea.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2756", "label": "Theriogenology", "title": "{\n  \"name\": \"Theriogenology\"\n}", "group": "Journal", "color": "#fab1a0"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1473", "label": "Aym\u00e9e Luiza", "title": "{\n  \"name\": \"Aym\\u00e9e Luiza\"\n}", "group": "Scholar", "color": "#fd79a8"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1474", "label": "Reis Luiza", "title": "{\n  \"name\": \"Reis Luiza\"\n}", "group": "Scholar", "color": "#fd79a8"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1475", "label": "Soares Ana Clara", "title": "{\n  \"name\": \"Soares Ana Clara\"\n}", "group": "Scholar", "color": "#fd79a8"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2734", "label": "Journal of dairy science", "title": "{\n  \"name\": \"Journal of dairy science\"\n}", "group": "Journal", "color": "#fab1a0"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1476", "label": "Rodriguez Z", "title": "{\n  \"name\": \"Rodriguez Z\"\n}", "group": "Scholar", "color": "#fd79a8"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1477"
