10\",\n  \"notifiable\": false,\n  \"name\": \"abdominal_pain\",\n  \"mortality_risk\": \"medium\",\n  \"description\": \"Colic manifestations: bloat, LDA/RDA, intussusception, abomasal volvulus, hardware disease. Emergency evaluation required.\",\n  \"zoonotic\": false,\n  \"category\": \"gastrointestinal\",\n  \"prevalence_pct\": 5\n}", "group": "Disease", "color": "#ff6b6b"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:4", "label": "Case", "title": "{\n  \"confidence\": 0.6991382837295532,\n  \"case_id\": \"case_17_abdominal_pain_4441d5\",\n  \"diagnosis\": \"abdominal_pain\",\n  \"timestamp\": \"2026-04-14T11:14:22.438688\"\n}", "group": "Case", "color": "#ff9f43"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:4496", "label": "abnormal_gait", "title": "{\n  \"severity\": 3,\n  \"last_updated\": \"2026-04-12\",\n  \"species\": \"cattle\",\n  \"icd_v\": \"R26\",\n  \"notifiable\": false,\n  \"name\": \"abnormal_gait\",\n  \"mortality_risk\": \"low\",\n  \"description\": \"Ataxia, toe dragging, circumduction. Caused by spinal cord compression, peripheral nerve damage, severe laminitis, intoxication (bracken fern, lead).\",\n  \"zoonotic\": false,\n  \"category\": \"musculoskeletal\",\n  \"prevalence_pct\": 10\n}", "group": "Disease", "color": "#ff6b6b"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:5", "label": "Case", "title": "{\n  \"confidence\": 0.7582191228866577,\n  \"case_id\": \"case_17_abnormal_gait_ba84f8\",\n  \"diagnosis\": \"abnormal_gait\",\n  \"timestamp\": \"2026-04-14T11:17:18.380134\"\n}", "group": "Case", "color": "#ff9f43"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:4483", "label": "neurological_sign", "title": "{\n  \"severity\": 5,\n  \"last_updated\": \"2026-04-12\",\n  \"species\": \"cattle\",\n  \"icd_v\": \"G93\",\n  \"notifiable\": true,\n  \"name\": \"neurological_sign\",\n  \"mortality_risk\": \"high\",\n  \"description\": \"Polioencephalomalacia, listeriosis (Listeria monocytogenes, zoonotic), BSE (notifiable), hypomagnasaemia tetany, lead poisoning.\",\n  \"zoonotic\": true,\n  \"category\": \"neurological\",\n  \"prevalence_pct\": 2\n}", "group": "Disease", "color": "#ff6b6b"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:6", "label": "Case", "title": "{\n  \"confidence\": 0.7487545013427734,\n  \"case_id\": \"case_17_neurological_sign_a8789d\",\n  \"diagnosis\": \"neurological_sign\",\n  \"timestamp\": \"2026-04-14T11:29:53.608460\"\n}", "group": "Case", "color": "#ff9f43"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:7", "label": "Case", "title": "{\n  \"confidence\": 0.6856627464294434,\n  \"case_id\": \"case_17_abdominal_pain_bc3033\",\n  \"diagnosis\": \"abdominal_pain\",\n  \"timestamp\": \"2026-04-14T11:31:49.505854\"\n}", "group": "Case", "color": "#ff9f43"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:4481", "label": "metabolic_disorder", "title": "{\n  \"severity\": 4,\n  \"last_updated\": \"2026-04-12\",\n  \"species\": \"cattle\",\n  \"icd_v\": \"E88\",\n  \"notifiable\": false,\n  \"name\": \"metabolic_disorder\",\n  \"mortality_risk\": \"medium\",\n  \"description\": \"Ketosis (hyperketonemia), milk fever (hypocalcaemia), hypomagnesaemia (grass tetany), fatty liver. Periparturient cattle at highest risk.\",\n  \"zoonotic\": false,\n  \"category\": \"metabolic\",\n  \"prevalence_pct\": 15\n}", "group": "Disease", "color": "#ff6b6b"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:8", "label": "Case", "title": "{\n  \"confidence\": 0.7073835730552673,\n  \"case_id\": \"case_17_metabolic_disorder_00593e\",\n  \"diagnosis\": \"metabolic_disorder\",\n  \"timestamp\": \"2026-04-14T11:33:31.097994\"\n}", "group": "Case", "color": "#ff9f43"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:9", "label": "Case", "title": "{\n  \"confidence\": 0.8357812166213989,\n  \"case_id\": \"case_17_neurological_sign_d6f3d7\",\n  \"diagnosis\": \"neurological_sign\",\n  \"timestamp\": \"2026-04-14T11:34:55.626792\"\n}", "group": "Case", "color": "#ff9f43"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2725", "label": "reproductive_disease", "title": "{\n  \"name\": \"reproductive_disease\"\n}", "group": "Disease", "color": "#ff6b6b"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1286", "label": "Detecting Leptospira spp. infection in cows by PCR: What is the best sample to test?", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Detecting Leptospira spp. infection in cows by PCR: What is the best sample to test? Scholars: Aym\\u00e9e Luiza, Reis Luiza, Soares Ana Clara Journal: Theriogenology (2025) PMID: 39454480  Abstract: Bovine leptospirosis is a major reproductive disease. As cows can be leptospiral carriers both on the renal and genital tract, diagnosis can be challenging, with an underlying risk of misdiagnosis. Traditionally, the infection has been diagnosed by culturing or PCR from urine samples. Nevertheless, recent studies have suggested testing genital samples rather than urine, particularly for the diagnosis of genital colonization and reproductive disorders. The present study aimed to compare urine versus genital samples to detect leptospiral carriers in naturally infected cows with poor reproductive performance under field conditions. Five herds presenting >20\\u00a0% of seroreactive animals against the Sejroe serogroup were selected. Of these, 106 cows with poor reproductive performance were studied, and\",\n  \"pmid\": \"39454480\",\n  \"title\": \"Detecting Leptospira spp. infection in cows by PCR: What is the best sample to test?\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1287", "label": "Assessment of milk yield and composition, early reproductive performance, and herd removal in multiparous dairy cattle based on the week of diagnosis of hyperketonemia in early lactation.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 Assessment of milk yield and composition, early reproductive performance, and herd removal in multiparous dairy cattle based on the week of diagnosis of hyperketonemia in early lactation. Scholars: Rodriguez Z, Shepley E, Endres M I Journal: Journal of dairy science (2022) PMID: 35221059  Abstract: The purpose of this retrospective cohort study was to evaluate the effects of the timing of hyperketonemia (HYK) diagnosis during early lactation on milk yield and composition, reproductive performance, and herd removal. Plasma \\u03b2-hydroxybutyrate (BHB) was measured twice a week during the first 2 wk of lactation in 362 multiparous Holstein cows for the diagnosis of HYK. In each week, cows were diagnosed as HYK positive (HYK+) if the plasma BHB concentrations were \\u22651.2 mmol/L in at least one of the tests for the week evaluated. Milk-related outcomes (first 10 monthly milk tests) included milk yield, milk fat and protein content, milk urea nitrogen (MUN), and linear score of somatic cell coun\",\n  \"pmid\": \"35221059\",\n  \"title\": \"Assessment of milk yield and composition, early reproductive performance, and herd removal in multiparous dairy cattle based on the week of diagnosis of hyperketonemia in early lactation.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2722", "label": "mastitis", "title": "{\n  \"severity\": 4,\n  \"last_updated\": \"2026-04-12\",\n  \"species\": \"cattle\",\n  \"icd_v\": \"N10\",\n  \"notifiable\": false,\n  \"name\": \"mastitis\",\n  \"mortality_risk\": \"low\",\n  \"description\": \"Inflammation of the mammary gland, most costly dairy disease worldwide. Clinical signs include swelling, heat, pain, and abnormal milk.\",\n  \"zoonotic\": false,\n  \"category\": \"infectious\",\n  \"prevalence_pct\": 25\n}", "group": "Disease", "color": "#ff6b6b"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1288", "label": "Ozone use in the treatment of subclinical mastitis in dairy cows.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Ozone use in the treatment of subclinical mastitis in dairy cows. Scholars: Fuentes Esther Abihail, Achy Jamile A, da Silva Davi F Journal: The Journal of dairy research (2023) PMID: 38420731  Abstract: This research communication paper addresses the hypothesis that the use of therapeutic alternatives for mastitis, such as intramammary ozone, can cure the disease with lower costs and without harmful residues for human consumption and without formation of microbial resistance like the ones caused by indiscriminate use of antibiotics in dairy farms. The study was performed in 36 mammary quarters from 12 dairy cows with subclinical mastitis grade three. The experimental units were randomly assigned into four groups and each group received a treatment. Treatments comprised (a) 20 \\u03bcg/ml ozone gas; (b) 40 \\u03bcg/ml ozone gas; (c) negative control treatment of 12.5 \\u03bcg/ml ozonated saline and (d) positive control treatment of 100 mg of cephalexin + 100 mg of neomycin + 10 mg of prednisolone, all \",\n  \"pmid\": \"38420731\",\n  \"title\": \"Ozone use in the treatment of subclinical mastitis in dairy cows.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1290", "label": "Natural photosensitizer-loaded in micellar copolymer to prevent bovine mastitis: A new post-dipping protocol on milking.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Natural photosensitizer-loaded in micellar copolymer to prevent bovine mastitis: A new post-dipping protocol on milking. Scholars: Junior Ranulfo Combuca da Silva, Campanholi Katieli da Silva Souza, Maciel Bianca Cristina Journal: Photodiagnosis and photodynamic therapy (2023) PMID: 36813143  Abstract: Good management practices such as post-dipping applications (post-milking immersion bath) contribute to the dairy cattle health during lactation and minimize the appearance of mastitis (an infection in the mammary gland). The post-dipping procedure is performed conventionally using iodine-based solutions. The search for therapeutic modalities that are not invasive and do not cause resistance to the microorganisms that cause bovine mastitis instigates the interest of the scientific community. In this regard, antimicrobial Photodynamic Therapy (aPDT) is highlighted. The aPDT is based on combining a photosensitizer (PS) compound, light of adequate wavelength, and molecular oxygen (\",\n  \"pmid\": \"36813143\",\n  \"title\": \"Natural photosensitizer-loaded in micellar copolymer to prevent bovine mastitis: A new post-dipping protocol on milking.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1484", "label": "Diagnostic utility of measuring serum amyloid A with a latex agglutination turbidimetric immunoassay in bovine mastitis: Comparison with haptoglobin and alpha 1 acid glycoprotein.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Diagnostic utility of measuring serum amyloid A with a latex agglutination turbidimetric immunoassay in bovine mastitis: Comparison with haptoglobin and alpha 1 acid glycoprotein. Scholars: Otsuka Marina, Sugiyama Mieko, Ito Takaaki Journal: The Journal of veterinary medical science (2021) PMID: 33390361  Abstract: This study established the precision and accuracy of a modified latex agglutination turbidimetric immunoassay (LATIA) reagent, and evaluated the ability of the measurement of serum amyloid A (SAA) compared to haptoglobin and \\u03b11-acid glycoprotein, which are acute phase proteins (APPs), for diagnosis of clinical mastitis. Concentrations of APPs in cows with mastitis were significantly higher than those in healthy cow. Only the plasma SAA concentration in cows with clinical mastitis (44.90 mg/l; n=15) was significantly higher than that in those with subclinical mastitis (10.70 mg/l; n=16), enabling their diagnosis in contrast to other APPs. Thus, the SAA assay using a LATIA r\",\n  \"pmid\": \"33390361\",\n  \"title\": \"Diagnostic utility of measuring serum amyloid A with a latex agglutination turbidimetric immunoassay in bovine mastitis: Comparison with haptoglobin and alpha 1 acid glycoprotein.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1485", "label": "Negatively controlled trial investigating the effect of dry cow therapy in first-lactation dairy cows on the prevalence of intramammary infections in the subsequent lactation.", "title": "{\n  \"year\": 2026,\n  \"abstract\": \"\\ud83d\\udcc4 Negatively controlled trial investigating the effect of dry cow therapy in first-lactation dairy cows on the prevalence of intramammary infections in the subsequent lactation. Scholars: Pe\\u00f1a-Mosca Felipe, Ruch Megan, Florentino Cainan Journal: Journal of dairy science (2026) PMID: 41349835  Abstract: Research has shown that selective dry cow therapy (SDCT) can be implemented in well-managed dairy farms without negatively affecting postpartum udder health and performance. This raises the question of whether dry cow therapy (DCT) is necessary in well-managed farms. Our primary objective was to assess the effect of withholding DCT from cows at the end of their first lactation on postpartum quarter-level IMI prevalence. Our secondary objectives were to evaluate the effect of DCT omission on postpartum quarter-level IMI prevalence in subgroups of quarters, stratified by quarter-level SCC and California Mastitis Test (CMT) results at dry-off, and to use those findings to predict the effect\",\n  \"pmid\": \"41349835\",\n  \"title\": \"Negatively controlled trial investigating the effect of dry cow therapy in first-lactation dairy cows on the prevalence of intramammary infections in the subsequent lactation.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1489", "label": "The role of Leptospira santarosai serovar Guaricura as agent of Bovine Genital Leptospirosis.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 The role of Leptospira santarosai serovar Guaricura as agent of Bovine Genital Leptospirosis. Scholars: Aym\\u00e9e Luiza, Nogueira Di Azevedo Maria Isabel, de Souza Pedrosa Juliana Journal: Veterinary microbiology (2022) PMID: 35390628  Abstract: Bovine Genital Leptospirosis (BGL) is an important reproductive disease. The main agents are Sejroe strains, particularly the Hardjo genotypes from Leptospira interrogans and L. borgpetersenii. Although other Sejroe strain, L. santarosai genotype Guaricura, has been frequently isolated from asymptomatic and slaughtered cattle, even from vaginal fluid samples, the role of this strain as real agent of BGL remains uncertain. This study aimed to reinforce L. santarosai strain Guaricura as an important BGL agent, through genetic characterization of a uterine isolate from a live subfertile cow. Urine, cervicovaginal mucus (CVM) and uterine fragment (UF) were collected. In a set up field laboratory, urine, CVM and UF were immediately seeded in T80/40LH \",\n  \"pmid\": \"35390628\",\n  \"title\": \"The role of Leptospira santarosai serovar Guaricura as agent of Bovine Genital Leptospirosis.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1490", "label": "Association between antimicrobial use and antimicrobial resistance of Streptococcus uberis causing clinical mastitis.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Association between antimicrobial use and antimicrobial resistance of Streptococcus uberis causing clinical mastitis. Scholars: Martins Larissa, Gon\\u00e7alves Juliano L, Leite Renata F Journal: Journal of dairy science (2021) PMID: 34389143  Abstract: It is unknown whether overuse of antimicrobials against clinical mastitis (CM) from Streptococcus uberis is associated with increased antimicrobial resistance (AMR). Therefore, the aim of this study was to evaluate the association between antimicrobial use (AMU) and AMR in relation to the Strep. uberis causing CM in dairy herds. A total of 83 Strep. uberis isolates were selected from a collection created during a previous study evaluating the epidemiology of CM in dairy herds (n = 17) of southeastern Brazil. For each case of CM identified on farm, the following information was recorded: cow's identification number, affected mammary quarter, date of CM diagnosis, antimicrobial commercial names, number of administrations, and descriptions of \",\n  \"pmid\": \"34389143\",\n  \"title\": \"Association between antimicrobial use and antimicrobial resistance of Streptococcus uberis causing clinical mastitis.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1491", "label": "Sirtuin 3 relieves inflammatory responses elicited by lipopolysaccharide via the PGC1\u03b1-NF\u03baB pathway in bovine mammary epithelial cells.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Sirtuin 3 relieves inflammatory responses elicited by lipopolysaccharide via the PGC1\\u03b1-NF\\u03baB pathway in bovine mammary epithelial cells. Scholars: Liu Lei, Wang Baogen, Yang Wei Journal: Journal of dairy science (2023) PMID: 36494223  Abstract: Excessive inflammation in bovine mammary endothelial cells (BMEC) due to mastitis leads to disease progression and eventual culling of cattle. Sirtuin 3 (SIRT3), a mitochondrial deacetylase, downregulates pro-inflammatory cytokines in BMEC exposed to high concentrations of nonesterified fatty acids by blunting nuclear factor-\\u03baB (NF\\u03baB) signaling. In nonruminants, SIRT3 is under the control of PGC1\\u03b1, a transcriptional cofactor. Specific aims were to study (1) the effect of SIRT3 on inflammatory responses of lipopolysaccharide (LPS)-challenged bovine mammary epithelial cells (bovine mammary alveolar cells-T, MAC-T) models, and (2) the role of PGC1\\u03b1 in the attenuation of NF\\u03baB signaling via SIRT3. To address these objectives, first, MAC-T cells were\",\n  \"pmid\": \"36494223\",\n  \"title\": \"Sirtuin 3 relieves inflammatory responses elicited by lipopolysaccharide via the PGC1\\u03b1-NF\\u03baB pathway in bovine mammary epithelial cells.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1492", "label": "Economic losses caused by mastitis and the influence of climate variation on the occurrence of the disease in a dairy cattle farm in southern Brazil.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Economic losses caused by mastitis and the influence of climate variation on the occurrence of the disease in a dairy cattle farm in southern Brazil. Scholars: Corr\\u00eaa Diego Cristiano, Nunes Gabriela Tormes, Barcelos Roberto Ant\\u00f4nio Delgado Journal: Tropical animal health and production (2024) PMID: 38351405  Abstract: This study evaluated the economic impacts caused by mastitis in a small dairy farm with similar characteristics and production to most dairy farms in southern Brazil and investigated if climatic variations influenced mastitis occurrence in the region. A farm with, on average, 45 lactating Holstein cattle was monitored from November 2021 to October 2022, and data on mastitis cases, bulk tank milk somatic cell count, animal treatment costs, milk production, animal disposal costs, and production losses were collected. Monthly averages of temperature, relative humidity (RH), and rainfall in the region were obtained. The greatest loss was related to the drop in milk producti\",\n  \"pmid\": \"38351405\",\n  \"title\": \"Economic losses caused by mastitis and the influence of climate variation on the occurrence of the disease in a dairy cattle farm in southern Brazil.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1495", "label": "The use of stem cells in the treatment of mastitis in dairy cows.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 The use of stem cells in the treatment of mastitis in dairy cows. Scholars: Pokorska Joanna, Sawicki Sebastian, Gabry\\u015b Julia Journal: Scientific reports (2024) PMID: 38710789  Abstract: Mastitis is a multifactorial inflammatory disease. The increase in antibiotic resistance of bacteria that cause mastitis means that cattle breeders would prefer to reduce the use of antibiotics. Recently, therapies using mesenchymal stem cells (MSCs) from various sources have gained significant interest in the development of regenerative medicine in humans and animals, due to their extraordinary range of properties and functions. The aim of this study was to analyze the effectiveness of an allogeneic stem cells derived from bone marrow (BMSC) and adipose tissue (ADSC) in treating mastitis in dairy cattle. The research material consisted of milk and blood samples collected from 39 Polish Holstein-Friesian cows, 36 of which were classified as having mastitis, based on cytological evaluation of their mil\",\n  \"pmid\": \"38710789\",\n  \"title\": \"The use of stem cells in the treatment of mastitis in dairy cows.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2727", "label": "respiratory_disease", "title": "{\n  \"severity\": 4,\n  \"last_updated\": \"2026-04-12\",\n  \"species\": \"cattle\",\n  \"icd_v\": \"J22\",\n  \"notifiable\": false,\n  \"name\": \"respiratory_disease\",\n  \"mortality_risk\": \"medium\",\n  \"description\": \"Bovine Respiratory Disease (BRD) complex \\u2014 leading cause of morbidity/mortality in beef cattle. Caused by Mannheimia haemolytica, Pasteurella multocida, BRSV, IBR.\",\n  \"zoonotic\": false,\n  \"category\": \"respiratory\",\n  \"prevalence_pct\": 14\n}", "group": "Disease", "color": "#ff6b6b"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1496", "label": "Effect of bovine respiratory disease on the respiratory microbiome: a meta-analysis.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Effect of bovine respiratory disease on the respiratory microbiome: a meta-analysis. Scholars: Howe Samantha, Kegley Beth, Powell Jeremy Journal: Frontiers in cellular and infection microbiology (2023) PMID: 37743862  Abstract: Bovine respiratory disease (BRD) is the most devastating disease affecting beef and dairy cattle producers in North America. An emerging area of interest is the respiratory microbiome's relationship with BRD. However, results regarding the effect of BRD on respiratory microbiome diversity are conflicting. To examine the effect of BRD on the alpha diversity of the respiratory microbiome, a meta-analysis analyzing the relationship between the standardized mean difference (SMD) of three alpha diversity metrics (Shannon's Diversity Index (Shannon), Chao1, and Observed features (OTUs, ASVs, species, and reads) and BRD was conducted. Our multi-level model found no difference in Chao1 and Observed features SMDs between calves with BRD and controls. The Shannon SMD wa\",\n  \"pmid\": \"37743862\",\n  \"title\": \"Effect of bovine respiratory disease on the respiratory microbiome: a meta-analysis.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1499", "label": "Associations between polymorphisms of LAP3 and SIRT1 genes with clinical mastitis and milk production traits in Sahiwal and Karan Fries dairy cattle.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 Associations between polymorphisms of LAP3 and SIRT1 genes with clinical mastitis and milk production traits in Sahiwal and Karan Fries dairy cattle. Scholars: Worku Destaw, Gowane G R, Mukherjee Anupama Journal: Veterinary medicine and science (2022) PMID: 36063537  Abstract: Bovine mastitis continues to remain as the most challenging disease in dairy cattle, as a result improvement of selection methods has great economic relevance while a deeper understanding of the genetic mechanisms regulating milk production traits and mastitis is of general scientific interest. This study aimed to evaluate the association of SNPs of the LAP3 and SIRT1 genes with estimated breeding values (EBVs) of milk production traits and clinical mastitis in dairy cattle of Indian origin. DNA samples from 263 animals (Sahiwal and Karan Fries cattle) were genotyped by PCR-RFLP to assess their pattern of genetic variation. EBVs of milk production traits and phenotypic records of incidences of clinical mastitis\",\n  \"pmid\": \"36063537\",\n  \"title\": \"Associations between polymorphisms of LAP3 and SIRT1 genes with clinical mastitis and milk production traits in Sahiwal and Karan Fries dairy cattle.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1500", "label": "A scoping review of the testing of bulk milk to detect infectious diseases of dairy cattle: Diseases caused by bacteria.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 A scoping review of the testing of bulk milk to detect infectious diseases of dairy cattle: Diseases caused by bacteria. Scholars: Nobrega Diego B, French Julie E, Kelton David F Journal: Journal of dairy science (2023) PMID: 36710183  Abstract: Testing of bulk milk (BM) samples is a convenient, cost-effective strategy that can easily be implemented as part of disease surveillance programs on dairy farms. Here, we performed a scoping review to summarize the literature reporting on the testing of BM samples to detect infectious diseases of dairy cattle caused by bacteria. We also provide a non-exhaustive, albeit significant, list of diagnostic tests that are marketed for BM samples, as well as a list of disease surveillance activities that included testing of BM samples. A literature search was carried out in 5 databases, yielding 8,829 records from which 474 were retained. Overall, 575 eligible bacterial pathogens were screened for using BM samples, ranging from 1 to 6 individual pat\",\n  \"pmid\": \"36710183\",\n  \"title\": \"A scoping review of the testing of bulk milk to detect infectious diseases of dairy cattle: Diseases caused by bacteria.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2723", "label": "infectious_disease", "title": "{\n  \"name\": \"infectious_disease\"\n}", "group": "Disease", "color": "#ff6b6b"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1501", "label": "An observational cohort study on antimicrobial usage on dairy farms in Quebec, Canada.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 An observational cohort study on antimicrobial usage on dairy farms in Quebec, Canada. Scholars: Lard\\u00e9 H, Dufour S, Archambault M Journal: Journal of dairy science (2021) PMID: 33272584  Abstract: Quantification of antimicrobial usage (AMU) is crucial to measure the effect of intervention programs, to determine associations between usage and resistance, to compare populations, and for benchmarking purposes. The primary objective of the study was to describe quantitatively the AMU on Quebec dairy farms over 1 yr: (1) the total AMU, (2) the AMU per administration route (intramammary, injectable, oral, intrauterine), and (3) the AMU per antimicrobial class and according to the categorizations of Health Canada and the World Health Organization. The secondary objective was to assess the effect of several characteristics (herd size, level of milk production, and incidence rate of common infectious diseases) on AMU rate. The AMU data were obtained for 101 dairy farms randomly selected in 3 \",\n  \"pmid\": \"33272584\",\n  \"title\": \"An observational cohort study on antimicrobial usage on dairy farms in Quebec, Canada.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2726", "label": "locomotor_disease", "title": "{\n  \"name\": \"locomotor_disease\"\n}", "group": "Disease", "color": "#ff6b6b"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1502", "label": "Dietary quercetin supplementation alleviates claw lesions in dairy cows by modulating the PI3K/Akt and NF-\u03baB signaling pathways.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Dietary quercetin supplementation alleviates claw lesions in dairy cows by modulating the PI3K/Akt and NF-\\u03baB signaling pathways. Scholars: Zhai Changhong, Lin Jingyi, Yang Xiaonan Journal: BMC veterinary research (2025) PMID: 41163003  Abstract: Lameness, primarily caused by claw lesions, leads to serious economic losses and animal welfare problems in dairy farms worldwide. Currently, its treatment approaches include topical application of nonsteroidal anti-inflammatory drugs (NSAIDs), improvement of the feeding environment, and therapeutic hoof trimming. However, long-term administration of NSAIDs may lead to adverse effects such as gastrointestinal complications and drug residue issues in dairy products. Recently, there was an increasing interest in the application of flavonoids in livestock management. Quercetin, a naturally abundant and cost-effective flavonoid, possesses multifunctional bioactivities, including anti-inflammatory, antioxidant, and metabolic-modulating functions. \",\n  \"pmid\": \"41163003\",\n  \"title\": \"Dietary quercetin supplementation alleviates claw lesions in dairy cows by modulating the PI3K/Akt and NF-\\u03baB signaling pathways.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1504", "label": "Comparison between a complete preconditioning programme and conventional conduct on behaviour, health and performance of young bulls from small cow-calf herds.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Comparison between a complete preconditioning programme and conventional conduct on behaviour, health and performance of young bulls from small cow-calf herds. Scholars: Vanbergue E, Assie S, Mounaix B Journal: Animal : an international journal of animal bioscience (2024) PMID: 38772080  Abstract: Bovine respiratory diseases (BRDs) have major socioeconomic impacts in the beef sector. Antimicrobials have been traditionally used to prevent the development of BRDs upon arrival in fattening units. Currently, from a \\\"One Health and One Welfare\\\" perspective, alternative solutions are being investigated. Preconditioning programmes that aim at reducing stress and reinforcing immune functions have been proposed to decrease BRDs incidence. In this study, we assessed the effect of a preconditioning protocol set up in nine commercial beef herds on young bulls' behaviour, health, and performance. Preconditioned bulls (PREC) were weaned indoors 50\\u00a0days before departure, and progressively fed a con\",\n  \"pmid\": \"38772080\",\n  \"title\": \"Comparison between a complete preconditioning programme and conventional conduct on behaviour, health and performance of young bulls from small cow-calf herds.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1506", "label": "Estimation of epidemiological cut-off values for eight antibiotics used for treatment of bovine mastitis caused by Streptococcus uberis and Streptococcus dysgalactiae subsp. dysgalactiae.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Estimation of epidemiological cut-off values for eight antibiotics used for treatment of bovine mastitis caused by Streptococcus uberis and Streptococcus dysgalactiae subsp. dysgalactiae. Scholars: Jensen Vibeke Fr\\u00f8kj\\u00e6r, Damborg Peter, Norstr\\u00f6m Madelaine Journal: Veterinary microbiology (2024) PMID: 38281323  Abstract: Interpretive criteria for antimicrobial susceptibility testing are lacking for most antimicrobials used for bovine streptococcal mastitis. The objectives of this study were to determine (tentative) epidemiological cut-off ((T)ECOFF) values for clinically relevant antibiotics used for treatment of bovine mastitis, and to estimate the proportion of acquired resistance (non-wild-types) in Streptococcus dysgalactiae subsp. dysgalactiae and Streptococcus uberis. A total of 255\\u00a0S. uberis and 231\\u00a0S. dysgalactiae subsp. dysgalactiae isolates were obtained in Denmark and Norway from bovine mastitis. The isolates were tested for susceptibility to 10 antibiotics using broth micro\",\n  \"pmid\": \"38281323\",\n  \"title\": \"Estimation of epidemiological cut-off values for eight antibiotics used for treatment of bovine mastitis caused by Streptococcus uberis and Streptococcus dysgalactiae subsp. dysgalactiae.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:2724", "label": "metabolic_disease", "title": "{\n  \"name\": \"metabolic_disease\"\n}", "group": "Disease", "color": "#ff6b6b"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1509", "label": "Effects of Consumption of Coconut and Cow's Milk on the Metabolic Profile of Wistar Rats Fed a Hyperprotein Diet.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Effects of Consumption of Coconut and Cow's Milk on the Metabolic Profile of Wistar Rats Fed a Hyperprotein Diet. Scholars: Hauy Beatriz Nomada, Oliani Caio Henrique Peres, Fracaro Gabriela Garcia Journal: Journal of medicinal food (2021) PMID: 32544020  Abstract: The intake of milk has decreased over the past few decades in Western populations and has been replaced by drinks of plant origin. Substitution of cow's milk by vegetable drinks occurs for some reasons, such as the presence of lactose intolerance, reduced calorie intake, prevention of obesity, vegan diets, and concern about the use of hormone therapy and its possible residues in bovine milk. For these reasons, the objective of this study was to evaluate the biochemical and anthropometric profile of animals subjected to a diet supplemented with coconut milk. Animals were divided into six groups (G1-G6), treated, respectively, regular diet and coconut milk or cow's milk, and with a high-protein content diet and coconut milk o\",\n  \"pmid\": \"32544020\",\n  \"title\": \"Effects of Consumption of Coconut and Cow's Milk on the Metabolic Profile of Wistar Rats Fed a Hyperprotein Diet.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1510", "label": "Augmentation of 3\u03b2-hydroxysteroid-\u039424 Reductase (DHCR24) Expression Induced by Bovine Viral Diarrhea Virus Infection Facilitates Viral Replication via Promoting Cholesterol Synthesis.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 Augmentation of 3\\u03b2-hydroxysteroid-\\u039424 Reductase (DHCR24) Expression Induced by Bovine Viral Diarrhea Virus Infection Facilitates Viral Replication via Promoting Cholesterol Synthesis. Scholars: Ma Yingying, Han Yanyan, Li Yuan Journal: Journal of virology (2022) PMID: 36468862  Abstract: Bovine viral diarrhea virus (BVDV) is the etiologic agent of bovine viral diarrhea-mucosal disease, one of the most important viral diseases of cattle, leading to numerous losses to the cattle rearing industry worldwide. The pathogenicity of BVDV is extremely complex, and many underlying mechanisms involved in BVDV-host interactions are poorly understood, especially how BVDV utilizes host metabolism pathway for efficient viral replication and spread. In our previous study, using an integrative analysis of transcriptomics and proteomics, we found that DHCR24 (3\\u03b2-hydroxysteroid-\\u039424 reductase), a key enzyme in regulating cholesterol synthesis, was significantly upregulated at both gene and protein level\",\n  \"pmid\": \"36468862\",\n  \"title\": \"Augmentation of 3\\u03b2-hydroxysteroid-\\u039424 Reductase (DHCR24) Expression Induced by Bovine Viral Diarrhea Virus Infection Facilitates Viral Replication via Promoting Cholesterol Synthesis.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1511", "label": "Synergistic antimicrobial activity of lynronne-1 and EDTA against bovine mastitis pathogens.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Synergistic antimicrobial activity of lynronne-1 and EDTA against bovine mastitis pathogens. Scholars: Moreira Ana Julia S, de Ara\\u00fajo Domingues Katialaine C, Camargo Karine D V Journal: The Journal of antimicrobial chemotherapy (2025) PMID: 39582247  Abstract: Bovine mastitis is the costliest disease in the dairy sector and the main cause of antibiotic use in dairy cattle, potentially contributing to the antimicrobial resistance crisis. Antimicrobial peptides (AMPs) offer promise as antibiotic alternatives for controlling mastitis pathogens. The efficacy of five AMPs (Lynronne-1 [Lyn-1], Lynronne-2 [Lyn-2], Bovicin HC5, AMP 660, and AMP 1043) and two bioactive compounds (disodium ethylenediaminetetraacetic acid [EDTA] and glycerol monolaurate) was assessed against a range of 35 mastitis-causing pathogens. The fractional inhibitory concentrations index (FICI) was calculated to determine the interaction effect and values \\u22640.5 were indicative of synergism. Time-dependent killing assays \",\n  \"pmid\": \"39582247\",\n  \"title\": \"Synergistic antimicrobial activity of lynronne-1 and EDTA against bovine mastitis pathogens.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1513", "label": "An outbreak of Neospora caninum abortion in a dairy herd from the State of Georgia, United States.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 An outbreak of Neospora caninum abortion in a dairy herd from the State of Georgia, United States. Scholars: Melendez Pedro, Ilha Marcia, Woldemeskel Moges Journal: Veterinary medicine and science (2021) PMID: 32864895  Abstract: An outbreak of 92 abortions out of 1,700 pregnant cows (5.41%) in a period of 3\\u00a0weeks (19 May to 05 June 2019) occurred in a Georgia Dairy, USA, in cattle that were between 3 and 7\\u00a0months of gestation. Two sets of samples (aborted fetuses' organs, placental tissues, aborted cows blood) were submitted for laboratory investigations at the Tifton Veterinary Diagnostic and Investigational Laboratory, College of Veterinary Medicine, University of Georgia (TVDIL, Tifton, GA, USA). An abortion panel testing for the major abortion-causing agents [e.g. Bovine Viral Diarrhoea Virus (BVDV), Infectious Bovine Rhinotracheitis Virus/ Bovine Herpes Virus-I (IBR/ BHV-I), Brucella spp., Leptospira spp.] was conducted on several of the samples. On the first set of samples, mi\",\n  \"pmid\": \"32864895\",\n  \"title\": \"An outbreak of Neospora caninum abortion in a dairy herd from the State of Georgia, United States.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1516", "label": "Antimicrobial activity of brown propolis ethanolic extract and its application in intramammary formulation for the treatment of bovine mastitis.", "title": "{\n  \"year\": 2026,\n  \"abstract\": \"\\ud83d\\udcc4 Antimicrobial activity of brown propolis ethanolic extract and its application in intramammary formulation for the treatment of bovine mastitis. Scholars: da Silva Valdenice F\\u00e9lix, Rosa Danillo Sales, de Figueir\\u00eado Priscila Izidro Journal: Brazilian journal of microbiology : [publication of the Brazilian Society for Microbiology] (2026) PMID: 41524822  Abstract: The major sanitary concern in dairy cattle production chain is mastitis, causing uncountable losses, which implies in the need of alternative therapies. Thus, the purpose of this study was to evaluate the antimicrobial activity of brown propolis ethanolic extract and its therapeutic potential for application in bovine intramammary mastitis therapeutic formulation. In the in vitro study we analyzed 40 Staphylococcus sp. isolates from subclinical mastitis cases. The chemical profile of extract was obtained by High Performance Liquid Chromatography. The antimicrobial activity was determined by broth microdilution. The biofilm fo\",\n  \"pmid\": \"41524822\",\n  \"title\": \"Antimicrobial activity of brown propolis ethanolic extract and its application in intramammary formulation for the treatment of bovine mastitis.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1517", "label": "Mycoplasma bovis 5'-nucleotidase is a virulence factor conferring mammary fitness in bovine mastitis.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Mycoplasma bovis 5'-nucleotidase is a virulence factor conferring mammary fitness in bovine mastitis. Scholars: Gelgie Aga E, Schneider Peleg, Citti Christine Journal: PLoS pathogens (2024) PMID: 39531484  Abstract: Nucleases and 5' nucleotidase (5'-NT) play essential roles in cell biology and are often associated with bacterial virulence. In Mycoplasma spp., which have limited metabolic capacities and rely on nutrient availability, these enzymes are of significant importance for nucleotide salvage. This study explores the potential role of 2 membrane-associated lipoproteins, the major nuclease MnuA and 5'-NT, in Mycoplasma bovis mastitis. Mutants deficient in MnuA (mnuA::Tn) and in 5'-NT (0690::Tn) were identified through genome-wide transposon mutagenesis of M. bovis PG45 type strain and their fitness and virulence were assessed both in vitro, in axenic medium, and in vivo, using murine and cow mastitis models. The mnuA::Tn mutant demonstrated reduced nuclease activity, while 0690:\",\n  \"pmid\": \"39531484\",\n  \"title\": \"Mycoplasma bovis 5'-nucleotidase is a virulence factor conferring mammary fitness in bovine mastitis.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1520", "label": "Seroprevalence and risk factors associated with bovine viral diarrhoea virus in Turkey.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Seroprevalence and risk factors associated with bovine viral diarrhoea virus in Turkey. Scholars: \\u0130nce \\u00d6mer Bar\\u0131\\u015f, Ayaz Alparslan Journal: Tropical animal health and production (2023) PMID: 37344712  Abstract: Bovine viral diarrhoea virus (BVDV) is an infectious agent that is extensively observed worldwide and is among the crucial pathogens of the cattle industry. BVDV infection causes gastrointestinal and respiratory diseases. This study aimed to determine the seropositivity and associated potential risk factors for the risk assessment of BVDV infection in the dairy cattle population in the Aegean Region of Turkey. In this cross-sectional study, 552 serum samples were collected between August 2018 and September 2019 from 48 herds that were not vaccinated against BVDV. Farmers were interviewed using a questionnaire on potential BVDV risk factors. BVDV-specific antibodies in serum samples were detected using a commercial indirect-ELISA kit. The herd-level and animal-level prevalence o\",\n  \"pmid\": \"37344712\",\n  \"title\": \"Seroprevalence and risk factors associated with bovine viral diarrhoea virus in Turkey.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1521", "label": "Influenza D virus in respiratory disease in Canadian, province of Qu\u00e9bec, cattle: Relative importance and evidence of new reassortment between different clades.", "title": "{\n  \"year\": 2022,\n  \"abstract\": \"\\ud83d\\udcc4 Influenza D virus in respiratory disease in Canadian, province of Qu\\u00e9bec, cattle: Relative importance and evidence of new reassortment between different clades. Scholars: Saegerman Claude, Gaudino Maria, Savard Christian Journal: Transboundary and emerging diseases (2022) PMID: 33764631  Abstract: Influenza D virus (IDV), a segmented single-stranded negative-sense ribonucleic acid (RNA) virus, belongs to the new Delta influenza virus genus of the Orthomyxoviridae family. Cattle were proposed as the natural reservoir of IDV in which infection was associated with mild-to-moderate respiratory clinical signs (i.e. cough, nasal discharge and dyspnoea). In order to investigate the role of IDV in bovine respiratory disease, during the period 2017-2020, 883 nasal or naso-pharyngeal swabs from Canadian cattle with respiratory signs (cough and/or dyspnoea) were tested by (RT-)qPCR for IDV and other major bovine viral (bovine herpesvirus 1, bovine viral diarrhoea virus, bovine respiratory syncy\",\n  \"pmid\": \"33764631\",\n  \"title\": \"Influenza D virus in respiratory disease in Canadian, province of Qu\\u00e9bec, cattle: Relative importance and evidence of new reassortment between different clades.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1522", "label": "Routine hoof-trimming data provides insight into the occurrence of claw lesions in Holstein herds in the central region of South Africa.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Routine hoof-trimming data provides insight into the occurrence of claw lesions in Holstein herds in the central region of South Africa. Scholars: Joubert R C, Strydom H F, van Marle-K\\u00f6ster E Journal: Tropical animal health and production (2023) PMID: 37925377  Abstract: Claw lesions in dairy cows contribute significantly to lameness, causing distress and discomfort for affected cows and raising welfare concerns. Despite increased awareness, lameness incidence continues to rise. Defining and recording claw traits are particularly problematic. In South Africa (SA), claw data is limited to paper-based records kept by private hoof trimmers. This research analysed claw-trimming data from five dairy farms over 6 years to examine the occurrence and recording of claw lesions in SA Holstein cattle. Lesion identification followed the Claw Lesion Identification in Dairy Cattle brochure. Among the recorded lesions, digital dermatitis (DD) had the highest prevalence (64.02%), followed by sole ul\",\n  \"pmid\": \"37925377\",\n  \"title\": \"Routine hoof-trimming data provides insight into the occurrence of claw lesions in Holstein herds in the central region of South Africa.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1523", "label": "Infective mastitis due to bovine-associated Streptococcus dysgalactiae contributes to clinical persistent presentation in a murine mastitis model.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Infective mastitis due to bovine-associated Streptococcus dysgalactiae contributes to clinical persistent presentation in a murine mastitis model. Scholars: An Ran, Gao Mingchun, Meng Ye Journal: Veterinary medicine and science (2021) PMID: 33932957  Abstract: Mastitis caused by Streptococcus dysgalactiae (GCS) is a major pathology of dairy cows. The mechanisms by which GCS intramammary infection is established and maintained involve not only bacterial adherence and invasion but also modulation of the cytokines and TLR immune response. The study aimed to evaluate characteristics of persistent infection of GCS collected from bovine mastitis milk in a murine mastitis model whose mammary structure is similar to that of dairy cows; dairy cow mastitis can be well simulated by using mice as models. HLJ2019 was tested for its ability to persistently infected mice by intramammary inoculation. As antibiotics tested, establish an intramammary infection model in murine, histopathology analyses,\",\n  \"pmid\": \"33932957\",\n  \"title\": \"Infective mastitis due to bovine-associated Streptococcus dysgalactiae contributes to clinical persistent presentation in a murine mastitis model.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1524", "label": "Thermographic assessment of mastitis progression in sahiwal cattle: Insights into the patterns in the natural course of infection.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Thermographic assessment of mastitis progression in sahiwal cattle: Insights into the patterns in the natural course of infection. Scholars: Gayathri S L, Bhakat M, Mohanty T K Journal: Microbial pathogenesis (2024) PMID: 39313135  Abstract: Mastitis is a global concern in the dairy sector, demanding innovative solutions for effective management for quality lifetime milk production. In this study, infrared thermography (IRT) as a non-invasive technology was integrated into routine farm activities for continuous health monitoring of animals. For 30 days, we systematically monitored the udder health status in 40 Sahiwal cows (160 quarters), employing IRT along with the California Mastitis Test (CMT). We also assessed somatic cell count (SCC), microbial identification, and milk quality parameters of representative samples. The thermal imaging data was analyzed, considering both backward propagation from the 0\",\n  \"pmid\": \"39313135\",\n  \"title\": \"Thermographic assessment of mastitis progression in sahiwal cattle: Insights into the patterns in the natural course of infection.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1528", "label": "Exploring farmers' understanding of and responses to endemic animal health and welfare issues in the UK.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Exploring farmers' understanding of and responses to endemic animal health and welfare issues in the UK. Scholars: Mahon Niamh, Clark Beth, Proctor Amy Journal: The Veterinary record (2021) PMID: 34554593  Abstract: This paper uses two endemic health conditions to explore farmer understandings of and responses to livestock health and welfare issues. The findings are based on a survey of 42 livestock farmers in the north of England, exploring how they manage lameness in sheep and cattle and bovine viral diarrhoea in cattle. We identify similarities and differences in their approaches. Two themes emerge. (1) The importance of difference between animal types (i.e., beef cattle, dairy cattle and sheep), which highlights the 'complex' and 'multifactorial' nature of animal health and welfare. It is necessary to unpack this to understand the interplay of animal, resource and management issues in farmer responses. (2) Previous research has identified 'lack of knowledge' as a key welfare issu\",\n  \"pmid\": \"34554593\",\n  \"title\": \"Exploring farmers' understanding of and responses to endemic animal health and welfare issues in the UK.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1532", "label": "Cystic ovary disease (COD) alters structure and function of the bovine oviduct.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Cystic ovary disease (COD) alters structure and function of the bovine oviduct. Scholars: Scully Deirdre, Reese Sven, K\\u00f6lle Sabine Journal: Molecular reproduction and development (2024) PMID: 38282319  Abstract: Cystic ovary disease (COD) is a common cause of subfertility in dairy cattle. Therefore, the aim of this study was to provide novel concepts for cyst classification and to investigate the effects of COD on tubal microarchitecture, oviductal metabolic function, and the formation of the sperm reservoir. Bovine Fallopian tubes affected by follicular cysts, follicular cysts with luteinization and luteal cysts were investigated by a variety of microscopic and histological techniques and compared to control cows in metestrus and diestrus. We defined three types of cysts involved in COD, each of which had a characteristic wall thickness, inner wall appearance and cellular pattern within the cyst aspirate. Regarding the Fallopian tube, each cyst type was associated with a characteris\",\n  \"pmid\": \"38282319\",\n  \"title\": \"Cystic ovary disease (COD) alters structure and function of the bovine oviduct.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1534", "label": "Prevalence of paratuberculosis in cattle in China: A systematic review and meta-analysis.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Prevalence of paratuberculosis in cattle in China: A systematic review and meta-analysis. Scholars: Lu Na, Niu Ya-Ling, Song Yang Journal: Preventive veterinary medicine (2023) PMID: 37890218  Abstract: Bovine paratuberculosis is a chronic infectious disease caused by Mycobacterium avium subspecies paratuberculosis (MAP). Here, a systematic literature review was conducted to investigate the bovine paratuberculosis distribution and associated risk factors in China before 2022. The databases CNKI, VIP, WanFang, PubMed, and ScienceDirect were used to search for articles. The random effect model of the \\\"Meta\\\" package of \\\"R\\\" software was used, and the Arcsine transformation was chosen for the rate conversion analysis. To reveal the factors that led to research heterogeneity, the research data were used for subgroup analysis and univariate meta-regression analysis. Among the 1238 identified articles, 54 met the eligibility criteria. Based on data obtained from the selected articles, the co\",\n  \"pmid\": \"37890218\",\n  \"title\": \"Prevalence of paratuberculosis in cattle in China: A systematic review and meta-analysis.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1535", "label": "l-Glutamic Acid Alleviates Mastitis in Dairy Cows by Targeting the Sirt5/Nrf2/Prdx1 Signaling Axis and Mitochondrial Function.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 l-Glutamic Acid Alleviates Mastitis in Dairy Cows by Targeting the Sirt5/Nrf2/Prdx1 Signaling Axis and Mitochondrial Function. Scholars: Liu Shu, Jin Yuhang, Zhou Wenyi Journal: Journal of agricultural and food chemistry (2025) PMID: 39895052  Abstract: Mastitis in dairy cows is an inflammatory disease that severely affects the health and lactation functions of dairy cows. Mitochondrial damage is closely related to the inflammatory response. How to effectively alleviate mitochondrial damage is the key to preventing and treating mastitis in dairy cows. In this study, we found elevated levels of inflammatory response and mitochondrial damage accompanied by reduced expression of Sirt5 (Sirtuin5) in cows with mastitis compared with healthy cows. This suggests that Sirt5 plays an important role in mastitis in dairy cows. Subsequently, we further analyzed mammary gland tissue from healthy and mastitis cows by untargeted metabolomics (LC-MS/MS) and screened for the differential metabolite l\",\n  \"pmid\": \"39895052\",\n  \"title\": \"l-Glutamic Acid Alleviates Mastitis in Dairy Cows by Targeting the Sirt5/Nrf2/Prdx1 Signaling Axis and Mitochondrial Function.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1537", "label": "Genomic analysis of bovine respiratory disease resistance in preweaned dairy calves diagnosed by a combination of clinical signs and thoracic ultrasonography.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Genomic analysis of bovine respiratory disease resistance in preweaned dairy calves diagnosed by a combination of clinical signs and thoracic ultrasonography. Scholars: Strillacci Maria G, Ferrulli Vincenzo, Bernini Francesca Journal: PloS one (2025) PMID: 40117286  Abstract: Bovine respiratory disease (BRD) poses a significant risk of morbidity and mortality in preweaned dairy calves. Research indicates that this multifactorial disorder can be attributed to the involvement of various pathogens. Currently, there is little information from genome-wide association studies (GWAS) for BRD resistance in young calves based on objective measures and classification of the disease. In this study, we moved forward in phenotyping BRD by coupling two diagnostic tests, the thoracic ultrasonography (TUS) and Wisconsin respiratory score (WISC), in order to assess susceptible and resistant animals to BRD. A total of 240 individuals were scored for BRD using TUS and WISC. A GWAS was performed using a\",\n  \"pmid\": \"40117286\",\n  \"title\": \"Genomic analysis of bovine respiratory disease resistance in preweaned dairy calves diagnosed by a combination of clinical signs and thoracic ultrasonography.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1539", "label": "Longitudinal characterization of serum metabolome and lipidome reveals that the ceramide profile is associated with metabolic health in early postpartum cows experiencing different lipolysis.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Longitudinal characterization of serum metabolome and lipidome reveals that the ceramide profile is associated with metabolic health in early postpartum cows experiencing different lipolysis. Scholars: Zhao H Y, Tan J, Li L X Journal: Journal of dairy science (2024) PMID: 38788838  Abstract: Reduced feed intake in early lactation prompts increased fat mobilization to meet dairy cow energy needs for milk production. The increased lipolysis in cows presents significant health risks with unclear mechanisms. The objectives of our study were to compare the longitudinal profiles of metabolites and lipids of serum from high- and low-lipolysis cows. Forty multiparous Holstein dairy cows were enrolled in the retrospective study. Serum samples were collected on d 7 before expected calving, as well as on d 5, 7, 14, and 21 postpartum. Dairy cows were grouped according to mean serum nonesterified fatty acids on d 5 and 7 after parturition as low (<0.600 mmol/L; n = 8; LFM) and high (>0.750 mmol/\",\n  \"pmid\": \"38788838\",\n  \"title\": \"Longitudinal characterization of serum metabolome and lipidome reveals that the ceramide profile is associated with metabolic health in early postpartum cows experiencing different lipolysis.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1541", "label": "Chicoric acid ameliorates LPS-induced inflammatory injury in bovine lamellar keratinocytes by modulating the TLR4/MAPK/NF-\u03baB signaling pathway.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Chicoric acid ameliorates LPS-induced inflammatory injury in bovine lamellar keratinocytes by modulating the TLR4/MAPK/NF-\\u03baB signaling pathway. Scholars: Lan Xiang, Qi Dongdong, Ren Hao Journal: Scientific reports (2023) PMID: 38082032  Abstract: Damage to lamellar keratinocytes, an essential cellular component of the epidermal layer of hoof tissue, can have a detrimental effect on hoof health and the overall production value of dairy cows. We isolated and cultured cow lamellar keratinocytes using the Dispase II and collagenase methods. We purified them by differential digestion and differential velocity adherent methods at each passaging and identified them by keratin 14 immunofluorescence. We established an in vitro model of inflammation in laminar keratinocytes using LPS and investigated whether chicoric acid protects against inflammatory responses by inhibiting the activation of the TLR4/MAPK/NF-\\u03baB signaling pathway. The results showed that cow lamellar keratinocytes were success\",\n  \"pmid\": \"38082032\",\n  \"title\": \"Chicoric acid ameliorates LPS-induced inflammatory injury in bovine lamellar keratinocytes by modulating the TLR4/MAPK/NF-\\u03baB signaling pathway.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1542", "label": "Steroidal but not embryonic regulation of mucin 1 expression in bovine endometrium.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Steroidal but not embryonic regulation of mucin 1 expression in bovine endometrium. Scholars: Kubota Kaiyu, Miwa Masafumi, Hayashi Ken-Go Journal: The Journal of reproduction and development (2021) PMID: 34645736  Abstract: In cow herd management, inadequate embryo implantation leads to pregnancy loss and causes severe economic losses. Thus, it is crucial to understand the molecular mechanisms underlying endometrial receptivity and subsequent embryo implantation. Transmembrane glycocalyx mucin 1 (MUC1) has a large and highly glycosylated extracellular domain known to inhibit embryo implantation via steric hindrance. The role of MUC1 in the bovine endometrium remains to be explored. Herein, we used simple but reliable in vivo and in vitro experiments to investigate the expression and regulation of MUC1 in the bovine endometrium. MUC1 gene expression was analyzed in endometrial epithelial cells collected by the cytobrush technique using reverse transcription-quantitative polymerase cha\",\n  \"pmid\": \"34645736\",\n  \"title\": \"Steroidal but not embryonic regulation of mucin 1 expression in bovine endometrium.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1543", "label": "Antimicrobial susceptibility of mastitis pathogens isolated from North American dairy cattle, 2011-2022.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Antimicrobial susceptibility of mastitis pathogens isolated from North American dairy cattle, 2011-2022. Scholars: Sweeney Michael T, Gunnett Lacie, Kumar Dipu Mohan Journal: Veterinary microbiology (2024) PMID: 38340554  Abstract: A total of 10,890 bacterial isolates of Streptococcus dysgalactiae, Streptococcus uberis, Staphylococcus aureus and Escherichia coli isolated as etiological agents from dairy cows with mastitis by 29 veterinary laboratories across North America between 2011 and 2022 were tested for in vitro antimicrobial susceptibility by broth microdilution to ampicillin, cefoperazone, ceftiofur, cephalothin, erythromycin, oxacillin, penicillin-novobiocin and pirlimycin according to CLSI standards. Using available clinical breakpoints, antimicrobial resistance among S. dysgalactiae (n\\u00a0=\\u00a02406) was low for penicillin-novobiocin (0% resistance), ceftiofur (0.1%), erythromycin (3.2%) and pirlimycin (4.6%). Among S. uberis (n\\u00a0=\\u00a02398), resistance was low for ampicillin (0%) and\",\n  \"pmid\": \"38340554\",\n  \"title\": \"Antimicrobial susceptibility of mastitis pathogens isolated from North American dairy cattle, 2011-2022.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1546", "label": "Clinical and diagnostic comparisons of bovine foot rot and bovine digital dermatitis lesions and management differences in feedlot cattle in Alberta.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Clinical and diagnostic comparisons of bovine foot rot and bovine digital dermatitis lesions and management differences in feedlot cattle in Alberta. Scholars: Pyakurel Susan, Amarajeewa Lithira, Knight Cameron Greig Journal: The Canadian veterinary journal = La revue veterinaire canadienne (2025) PMID: 40786733  Abstract: Bovine foot rot (BFR) and bovine digital dermatitis (BDD) are infectious foot lesions with overlapping clinical features that complicate diagnosis. Our objective was to differentiate BFR and BDD using quantitative and qualitative techniques. Populations of BFR- and BDD-associated bacteria were compared across sampling strategies, histopathological features described, and risk factors assessed  Lame cattle were assessed and bacteria in punch biopsy samples (PB-samples), swabs, and subcutaneous samples (SC-samples) were quantified using quantitative real-time PCR. In addition, PB-samples were used for hematoxylin and eosin and Warthin-Faulkner staining. Feedlot recor\",\n  \"pmid\": \"40786733\",\n  \"title\": \"Clinical and diagnostic comparisons of bovine foot rot and bovine digital dermatitis lesions and management differences in feedlot cattle in Alberta.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1547", "label": "Changes in mammary infection status in dairy cows during the dry period using dry cow therapy approaches on three farms.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Changes in mammary infection status in dairy cows during the dry period using dry cow therapy approaches on three farms. Scholars: Nagahata Hajime, Komori Nodoka, Fukutome Mayu Journal: Animal science journal = Nihon chikusan Gakkaiho (2024) PMID: 39352224  Abstract: This case study evaluated the mammary infection status of dairy cows during the dry periods and explored the associated problems in their quarters with dry cow therapy (DCT). This study assessed intramammary infections, antibiotic efficacy, and antimicrobial resistance of pathogens in 464-quarter milk samples from 59 dairy cows during the dry periods after applying blanket DCT, non-DCT, and selective DCT approaches on three farms. The recovery rates of intramammary infections were 95% (19/20 quarters) with blanket DCT on farm A, 70% (14/20) with non-DCT on farm B, and 19% (4/21) with selective DCT on farm C. Analysis of mammary infections in cows with DCT revealed that mammary infections were controlled by blanket DCT, w\",\n  \"pmid\": \"39352224\",\n  \"title\": \"Changes in mammary infection status in dairy cows during the dry period using dry cow therapy approaches on three farms.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1548", "label": "Staphylococci and mammaliicocci: Which species are important for udder health on organic dairy farms?", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Staphylococci and mammaliicocci: Which species are important for udder health on organic dairy farms? Scholars: Jeffrey C E, Adkins P R F, Dufour S Journal: Journal of dairy science (2025) PMID: 39694235  Abstract: Variation in species distribution and diversity of staphylococci and mammaliicocci (SaM) causing intramammary infections in dairy cattle is associated with different management practices. Disparate selective pressures on organic dairies could potentially result in population differences of these mastitis-causing bacteria. The species-specific effect on quarter SCC of SaM for a population of certified organic dairies has not been described previously. The current study presents data from a longitudinal study of 10 certified organic dairy farms. The objective was to estimate how quarter milk somatic cell count (qmSCC) varied as a result of infection with the most frequently isolated SaM species. Aerobic culture of quarter milk samples to identify IMI was conducted in paralle\",\n  \"pmid\": \"39694235\",\n  \"title\": \"Staphylococci and mammaliicocci: Which species are important for udder health on organic dairy farms?\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1549", "label": "Standing behavior and sole horn lesions: A prospective observational longitudinal study.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Standing behavior and sole horn lesions: A prospective observational longitudinal study. Scholars: Eriksson Hanna K, Daros Ruan R, von Keyserlingk Marina A G Journal: Journal of dairy science (2021) PMID: 34304879  Abstract: Studies performed on individual research farms have reported that dairy cattle developing sole hemorrhages or sole ulcers in peak to mid lactation spent more time standing during the weeks around calving. The aim of this prospective observational longitudinal study was to evaluate whether this relationship is evident in commercial dairy herds. A convenience sample of 8 herds were visited every other week, and animals without previous severe horn lesions and deemed sound at 4 to 8 wk before calving were enrolled. Standing behavior was measured with data loggers attached to a rear leg, and standing time and duration of the longest standing bout were determined for each cow. Standing behavior was summarized into 3 periods: before (d -14 to -2), around (d -1 to 1), a\",\n  \"pmid\": \"34304879\",\n  \"title\": \"Standing behavior and sole horn lesions: A prospective observational longitudinal study.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1551", "label": "Bacterial metabolic remodeling by convergent evolution unlocks nutrient availability after a host switch.", "title": "{\n  \"year\": 2026,\n  \"abstract\": \"\\ud83d\\udcc4 Bacterial metabolic remodeling by convergent evolution unlocks nutrient availability after a host switch. Scholars: Pickering Amy C, Gorzynski Jamie, Taylor-Joyce Grace Journal: Science advances (2026) PMID: 41650264  Abstract: New pathogens typically arise from host jump events between species. \",\n  \"pmid\": \"41650264\",\n  \"title\": \"Bacterial metabolic remodeling by convergent evolution unlocks nutrient availability after a host switch.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1553", "label": "Deterministic succession patterns in the rumen and fecal microbiome associate with host metabolic shifts in peripartum dairy cattle.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Deterministic succession patterns in the rumen and fecal microbiome associate with host metabolic shifts in peripartum dairy cattle. Scholars: Wang Shuo, Kong Fanlin, Dai Dongwen Journal: GigaScience (2025) PMID: 40388308  Abstract: Metabolic disorders in peripartum ruminants affect health and productivity, with gut microbiota playing a key role in host metabolism. Therefore, our study aimed to characterize the gut microbiota of peripartum dairy cows to better understand the relationship between metabolic phenotypes and the rumen and fecal microbiomes during the peripartum period. In a longitudinal study of 91 peripartum cows, we analyzed rumen and fecal microbiomes via 16S rRNA and metagenomic sequencing across six time points. By using enterotype classification, ecological model, and random forest analysis, we identified distinct deterministic succession patterns in the rumen and fecal microbiomes (rumen: rapid transition-transition-stable; hindgut: stable-transition-stable). Key m\",\n  \"pmid\": \"40388308\",\n  \"title\": \"Deterministic succession patterns in the rumen and fecal microbiome associate with host metabolic shifts in peripartum dairy cattle.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:3019", "label": "digestive_disease", "title": "{\n  \"name\": \"digestive_disease\"\n}", "group": "Disease", "color": "#ff6b6b"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1555", "label": "The ability of a handheld near-infrared spectrometer to do a rapid quality assessment of bovine colostrum, including the immunoglobulin G concentration.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 The ability of a handheld near-infrared spectrometer to do a rapid quality assessment of bovine colostrum, including the immunoglobulin G concentration. Scholars: Goi Arianna, Costa Angela, De Marchi Massimo Journal: Journal of dairy science (2024) PMID: 38395397  Abstract: Portable infrared-based instruments have made important contributions in different research fields. Within the dairy supply chain, for example, most of portable devices are based on near-infrared spectroscopy (NIRS) and are nowadays an important support for farmers and operators of the dairy sector, allowing fast and real-time decision-making, particularly for feed and milk quality evaluation and animal health and welfare monitoring. The affordability, portability, and ease of use of these instruments have been pivotal factors for their implementation on farm. In fact, pocket-sized devices enable nonexpert users to perform quick, low-cost, and nondestructive analysis on various matrixes without complex preparation\",\n  \"pmid\": \"38395397\",\n  \"title\": \"The ability of a handheld near-infrared spectrometer to do a rapid quality assessment of bovine colostrum, including the immunoglobulin G concentration.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1556", "label": "Expression of Bovine Meat and Milk Factor in Hepatocellular Carcinoma and Colorectal Liver Metastasis Patients.", "title": "{\n  \"year\": 2025,\n  \"abstract\": \"\\ud83d\\udcc4 Expression of Bovine Meat and Milk Factor in Hepatocellular Carcinoma and Colorectal Liver Metastasis Patients. Scholars: Siqin Sumen, Rahbari Mohammad, Ernst Claudia Journal: Journal of medical virology (2025) PMID: 40741925  Abstract: Bovine meat and milk factors (BMMFs) are plasmid-like DNA molecules isolated from cow's milk, meat, and human cancer tissues proposed to contribute to the development of specific types of cancer including colorectal cancer (CRC) and breast cancer based on chronic inflammation-associated indirect carcinogenesis. Chronic necro-inflammation of the liver poses a strong risk factor for the induction of hepatocellular carcinoma (HCC), which is associated with high intake of meat. Whether BMMFs contribute to HCC carcinogenesis or the development of colorectal liver metastasis (CRLM) remains unknown. Therefore, in this study, the presence of BMMFs was assessed in the liver of patients with viral and nonviral hepatitis-related HCC (n\\u2009=\\u200925), CRLM (14) and in he\",\n  \"pmid\": \"40741925\",\n  \"title\": \"Expression of Bovine Meat and Milk Factor in Hepatocellular Carcinoma and Colorectal Liver Metastasis Patients.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1557", "label": "Effects of calfhood respiratory disease on health and performance of dairy cattle: A systematic review and meta-analysis.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Effects of calfhood respiratory disease on health and performance of dairy cattle: A systematic review and meta-analysis. Scholars: Buczinski S, Achard D, Timsit E Journal: Journal of dairy science (2021) PMID: 33896639  Abstract: Bovine respiratory disease (BRD) is one of the most common calfhood diseases in dairy cattle. Unfortunately, published data on the short- and long-term effects of calfhood BRD on health and performance are scarce and, when available, often conflicting and uncertain. The objective of this study was therefore to review the scientific literature on the effects of calfhood BRD on health and performance of dairy cattle and summarize the research findings using a meta-analysis approach. The systematic review and meta-analysis were performed following Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidelines. PubMed and CAB Abstract databases were screened for relevant studies that were published in English (until February 3, 2020). On\",\n  \"pmid\": \"33896639\",\n  \"title\": \"Effects of calfhood respiratory disease on health and performance of dairy cattle: A systematic review and meta-analysis.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1561", "label": "Employment of mastoparan-like peptides to prevent ", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Employment of mastoparan-like peptides to prevent  Scholars: Orozco Raquel M Q, Oshiro Karen G N, Pinto Ingrid B Journal: Journal of bacteriology (2024) PMID: 38629875  Abstract: Bovine mastitis is a frequent infection in lactating cattle, causing great economic losses. \",\n  \"pmid\": \"38629875\",\n  \"title\": \"Employment of mastoparan-like peptides to prevent \"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1562", "label": "Novel ways to use sensor data to improve mastitis management.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Novel ways to use sensor data to improve mastitis management. Scholars: Hogeveen Henk, Klaas Ilka C, Dalen Gunnar Journal: Journal of dairy science (2021) PMID: 34304877  Abstract: Current sensor systems are used to detect cows with clinical mastitis. Although, the systems perform well enough to not negatively affect the adoption of automatic milking systems, the performance is far from perfect. An important advantage of sensor systems is the availability of multiple measurements per day. By clearly defining the need for detection of subclinical mastitis (SCM) and clinical mastitis (CM) from the farmers' management perspective, detection and management of SCM and CM may be improved. Sensor systems may also be used for other aspects of mastitis management. In this paper we have defined 4 mastitis situations that could be managed with the support of sensor systems. Because of differences in the associated management and the epidemiology of these specific mastitis situations, the requir\",\n  \"pmid\": \"34304877\",\n  \"title\": \"Novel ways to use sensor data to improve mastitis management.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1564", "label": "Ubericin K, a New Pore-Forming Bacteriocin Targeting mannose-PTS.", "title": "{\n  \"year\": 2021,\n  \"abstract\": \"\\ud83d\\udcc4 Ubericin K, a New Pore-Forming Bacteriocin Targeting mannose-PTS. Scholars: Oftedal Thomas F, Ovchinnikov Kirill V, Hestad Kai A Journal: Microbiology spectrum (2021) PMID: 34643411  Abstract: Bovine mastitis infection in dairy cattle is a significant economic burden for the dairy industry globally. To reduce the use of antibiotics in treatment of clinical mastitis, new alternative treatment options are needed. Antimicrobial peptides from bacteria, also known as bacteriocins, are potential alternatives for combating mastitis pathogens. In search of novel bacteriocins against mastitis pathogens, we screened samples of Norwegian bovine raw milk and found a Streptococcus uberis strain with potent antimicrobial activity toward \",\n  \"pmid\": \"34643411\",\n  \"title\": \"Ubericin K, a New Pore-Forming Bacteriocin Targeting mannose-PTS.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1565", "label": "Esculetin improves murine mastitis induced by streptococcus isolated from bovine mammary glands by inhibiting NF-\u03baB and MAPK signaling pathways.", "title": "{\n  \"year\": 2023,\n  \"abstract\": \"\\ud83d\\udcc4 Esculetin improves murine mastitis induced by streptococcus isolated from bovine mammary glands by inhibiting NF-\\u03baB and MAPK signaling pathways. Scholars: Zhou GuangWei, Zhang WuHao, Wen HaoJie Journal: Microbial pathogenesis (2023) PMID: 37852550  Abstract: Cow mastitis, caused by Streptococcus infection of the mammary glands, is a common clinical disease that can lead to decreased milk quality and threaten animal welfare and performance. Esculetin (ESC) is a coumarin with anti-inflammatory and anti-asthmatic effects. However, whether ESC has therapeutic effects on mastitis remains unexplored. This study was conducted to investigate the protective effect of ESC against murine mastitis caused by Streptococcus isolated from bovine mammary glands and elucidate the underlying mechanisms. Streptococcus uberis was used to construct a mouse model of mastitis. The results showed that the mice exhibited edema and thickening of the acinar wall with inflammatory infiltration after S. uberis tr\",\n  \"pmid\": \"37852550\",\n  \"title\": \"Esculetin improves murine mastitis induced by streptococcus isolated from bovine mammary glands by inhibiting NF-\\u03baB and MAPK signaling pathways.\"\n}", "group": "Document", "color": "#a29bfe"}, {"id": "4:1321a89f-49dc-4abc-b65b-408a9cc20d42:1566", "label": "Risk factors for dairy cows mastitis in Algeria, antibiotic resistance and molecular typing of the causative Staphylococcus aureus.", "title": "{\n  \"year\": 2024,\n  \"abstract\": \"\\ud83d\\udcc4 Risk factors for dairy cows mastitis in Algeria, antibiotic resistance and molecular typing of the causative Staphylococcus aureus. Scholars
